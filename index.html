const ZCOL = ["#5b2bc4","#1f8a4c","#c2410c","#2c5fb8","#b91c5c","#0f766e","#a16207","#6d28d9"];
const branchColor = id => ZCOL[Math.max(0, branches.findIndex(b=>b.id===id)) % ZCOL.length];
const LB = [33.89, 35.52];
function baseMap(el){
  const m = L.map(el).setView(LB, 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(m);
  return m;
}
let zonePts = [], zoneMapObj = null;
function zoneEditor(pts, selfId){
  if(typeof L === "undefined"){ $("#zInfo").textContent = "Map couldn't load. Check the internet connection."; return; }
  if(zoneMapObj){ zoneMapObj.remove(); zoneMapObj = null; }
  zonePts = (pts||[]).map(p=>[p[0],p[1]]);
  const m = zoneMapObj = baseMap("zoneMap");
  S.zones.filter(z => live(z) && z.id!==selfId && Array.isArray(z.polygon) && z.polygon.length>=3 && brandFilter({brandId: branches.find(b=>b.id===z.branchId)?.brandId}))
    .forEach(z => L.polygon(z.polygon, { color:branchColor(z.branchId), weight:1, fillOpacity:.08, dashArray:"4", interactive:false }).addTo(m).bindTooltip(z.name));
  const poly = L.polygon([], { color:"#5b2bc4", weight:2, fillOpacity:.2 }).addTo(m);
  let handles = [];
  const draw = () => {
    poly.setLatLngs(zonePts); handles.forEach(h=>h.remove());
    handles = zonePts.map((p,i) => L.marker(p, { draggable:true, icon:L.divIcon({ className:"zh", iconSize:[12,12] }) }).addTo(m)
      .on("drag", e => { const ll = e.target.getLatLng(); zonePts[i] = [ll.lat, ll.lng]; poly.setLatLngs(zonePts); }));
    $("#zInfo").textContent = zonePts.length < 3 ? `${zonePts.length} point${zonePts.length===1?"":"s"} · add at least 3` : `${zonePts.length} points`;
  };
  m.on("click", e => { zonePts.push([e.latlng.lat, e.latlng.lng]); draw(); });
  $("#zUndo").onclick = () => { zonePts.pop(); draw(); };
  $("#zClear").onclick = () => { zonePts = []; draw(); };
  draw();
  if(zonePts.length >= 3) m.fitBounds(poly.getBounds(), { padding:[20,20] });
  setTimeout(()=>m.invalidateSize(), 100); setTimeout(()=>m.invalidateSize(), 450);
}

async function saveOrder(status){
  const o = ccEdit ? S.orders.find(x=>x.id===ccEdit) : null;
  if(status==="keep") status = o?.status || "draft";
  const phone = $("#oPhone").value.trim(), name = $("#oName").value.trim(), branchId = $("#oBranch").value;
  if(!phone){ $("#oErr").textContent = "Customer phone is required."; $("#oPhone").focus(); return; }
  if(!name){ $("#oErr").textContent = "Customer name is required."; $("#oName").focus(); return; }
  const type = $("#oType .on")?.dataset.ot || "", brandId = $("#oBrand").value, sent = status!=="draft", addr = ccAddrGet();
  if(!$("#oSource").value){ $("#oErr").textContent = "Choose the order source."; $("#oSource").focus(); return; }
  if(!type){ $("#oErr").textContent = "Choose the order type: delivery or pickup."; return; }
  if(sent && brandList().length && !brandId){ $("#oErr").textContent = "Choose the brand."; return; }
  if(sent && !branchId){ $("#oErr").textContent = "Pick the branch that will prepare this order."; return; }
  if(sent && !cart.length){ $("#oErr").textContent = "Add at least one product."; return; }
  if(sent && type==="delivery"){ const miss = [["street","area / street"],["building","building"],["floor","floor"]].filter(([k]) => !addr[k]);
    if(miss.length){ $("#oErr").textContent = "Delivery address needs the " + miss.map(x=>x[1]).join(", ").replace(/, ([^,]*)$/, " and $1") + "."; $("#oA_"+miss[0][0])?.focus(); return; } }
  if(o && o.status!=="draft" && !ccEditable(S.orders.find(x=>x.id===ccEdit))){ $("#oErr").textContent = "The branch already closed this order, so it can't be changed."; return; }
  const c = orderCalc(cart, 0, ccCharges().picked);
  let data;
  if(ccLocked && o){
    // placed order: source, type, items (and the address if it just became delivery); removed items are kept as voided
    const key = i => (window.SlickMods ? SlickMods.key(i.productId, i.options) : i.productId) + "|" + (i.note||"");
    const left = cart.map(i => ({ k:key(i), q:+i.qty })), voided = [];
    ccOrig.forEach(i => { const m = left.find(x => x.k===key(i) && x.q > 0), keep = m ? Math.min(m.q, +i.qty) : 0; if(m) m.q -= keep; if(keep < +i.qty) voided.push({ ...i, qty: +i.qty - keep, voidedAt: new Date().toISOString(), voidedBy: state.userName || "Call center" }); });
    if(voided.length && !confirm(`Void ${voided.map(v => v.qty + " × " + v.name).join(", ")} from this order?`)) return;
    data = { source:$("#oSource").value, type, items:cart, subtotal:c.gross, charges:c.charges, chargesTotal:c.chargesTotal, total:c.total,
      ...(type==="delivery" && !o.address ? { address: addrJoin(addr) } : {}), ...(voided.length ? { voidedItems: [...(o.voidedItems||[]), ...voided] } : {}) };
  } else {
    data = { brandId, phone, customerName:name, source:$("#oSource").value, type, address: type==="delivery" ? addrJoin(addr) : "",
      branchId, notes:$("#oNotes").value.trim(), receiptNotes:$("#oRNotes").value.trim(), items:cart, subtotal:c.gross, charges:c.charges, chargesTotal:c.chargesTotal, total:c.total, status };
  }
  if(!ccEdit){ data.agent = state.fullName || state.userName || "Operator"; data.channel = "callcenter"; }
  try{ await put("orders", ccEdit, data); toast(o && o.status!=="draft" ? `Order ${ordRef(o)} updated · ${branchName(o.branchId)} sees the changes` : status==="pending" ? `Order sent to ${branchName(branchId)}` : "Draft saved"); $("#ccScrim").classList.remove("show"); }
  catch(err){ console.error(err); $("#oErr").textContent = "Couldn't save the order."; }
}
async function setOrderStatus(s){
  if(s==="active" || s==="closed") return toast("Only the branch can accept or close an order, on its POS.");
  try{ await put("orders", ccEdit, { status: s }); toast("Order " + CC_SUB[s].toLowerCase()); $("#ccScrim").classList.remove("show"); }
  catch(err){ console.error(err); $("#oErr").textContent = "Couldn't update the order."; }
}

  if(route==="customers") return viewCustomers();

/* ---------- Detail pages (Foodics-style): product and inventory item, with ingredients (recipes) ---------- */
const DET = { key:"", id:"", ing:null, br:null, dirtyIng:false, dirtyBr:false, saving:false };
const ORDER_TYPES = [["dinein","Dine In"],["pickup","Pick Up"],["delivery","Delivery"]];
const uomOf = it => it?.ingredientUnit || it?.storageUnit || "";
// cost of using `qty` of an item, where qty is in the item's ingredient unit and cost is per storage unit
// a produced item with no cost yet is valued at its ingredients (depth-limited to avoid loops)
const hasRecipe = it => !!it && (it.ingredients||[]).length > 0;
const itemUnitCost = (it, depth=0) => !it ? 0 : (+it.cost || (hasRecipe(it) && depth < 4 ? recipeCost(it.ingredients, depth+1) : 0));
const ingCost = (it, qty, depth=0) => !it ? 0 : (+qty||0) / (+it.factor || 1) * itemUnitCost(it, depth);
const recipeCost = (list, depth=0) => (list||[]).reduce((s,l) => s + ingCost(itemOf(l.itemId), l.qty, depth), 0);
const productCost = p => p.costingMethod==="fixed" ? (+p.cost||0) : recipeCost(p.ingredients);
const fmtCost = n => "USD " + (+n||0).toLocaleString("en-US",{maximumFractionDigits:5});

function openDetail(key, id){
  const r = S[CRUD[key].col].find(x=>x.id===id); if(!r) return;
  DET.key = key; DET.id = id; DET.dirtyIng = false; DET.dirtyBr = false; DET.var = null; DET.ingFor = "";
  DET.ing = JSON.parse(JSON.stringify(Array.isArray(r.ingredients) ? r.ingredients : []));
  DET.br = { customPrices: { ...(r.customPrices||{}) }, inactive: [...(r.inactiveBranchIds||[])], oos: [...(r.outOfStockBranchIds||[])] };
  DET.mods = JSON.parse(JSON.stringify(Array.isArray(r.modifiers) ? r.modifiers : [])); DET.dirtyMods = false;
  if(key==="inv-items") loadStock();
  render(); window.scrollTo(0,0);
}
function closeDetail(){ DET.key = ""; DET.id = ""; DET.ing = null; DET.br = null; DET.var = null; DET.ingFor = ""; DET.dirtyVar = false; }
const info = (l, v) => `<div><div class="note">${l}</div><div>${v}</div></div>`;
const infoGrid = cells => `<div class="card" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 18px;margin-bottom:16px">${cells.join("")}</div>`;

function ingEditor(forKey, rec){
  const rows = DET.ing, isProd = forKey==="products" || forKey==="modifier-options";
  const used = new Set(rows.map(l=>l.itemId));
  const avail = S.inv_items.filter(i => live(i) && !used.has(i.id) && i.id!==rec.id).sort((a,b)=>a.name.localeCompare(b.name));
  const total = recipeCost(rows);
  const head = isProd ? `<th>Name</th><th>SKU</th><th class="num">Quantity</th><th class="num">Cost</th><th>Applies on</th><th></th>` : `<th>Name</th><th>SKU</th><th class="num">Quantity</th><th class="num">Cost</th><th></th>`;
  const body = rows.map((l, ix) => {
    const it = itemOf(l.itemId) || { name:"(deleted item)" }, types = l.types || ORDER_TYPES.map(t=>t[0]);
    return `<tr><td><b>${esc(it.name)}</b></td><td><span class="code">${esc(it.sku||"")}</span></td>
      <td class="num" style="white-space:nowrap"><input type="number" min="0" step="any" class="sel" data-ingq="${ix}" value="${esc(l.qty ?? "")}" style="width:100px;text-align:right" aria-label="Quantity of ${esc(it.name)}"> <span class="note">${esc(uomOf(it))}</span></td>
      <td class="num" data-ingc="${ix}">${fmtCost(ingCost(it, l.qty))}</td>
      ${isProd ? `<td>${ORDER_TYPES.map(([k,t])=>`<label class="chk" style="display:inline-flex;margin-right:8px"><input type="checkbox" data-ingt="${ix}:${k}" ${types.includes(k)?"checked":""}> ${t}</label>`).join("")}</td>` : ""}
      <td><button class="btn sm" data-ingrm="${ix}" aria-label="Remove ${esc(it.name)}">×</button></td></tr>`;
  }).join("");

async function addVariant(){

  if(!rows.length) return err("Add at least one attribute.");
  const have = (p.variants||[]).filter(v => S.products.some(x=>x.id===v.productId && live(x))).map(v => v.name.toLowerCase()), names = rows.map(r => r.name.toLowerCase());

  const skus = rows.map(r => r.sku).filter(Boolean), usedSku = rows.find(r => r.sku && (S.products.some(x => live(x) && x.sku===r.sku) || skus.indexOf(r.sku)!==skus.lastIndexOf(r.sku)));

function flowRow(d, K, l, ix, it, base, del, qIn, ro, recv, cur, stockLoading){
  const draft = d.status==="draft", r = recv ? DOC.recv[ix] : null;
  const srcStock = draft && K.kind!=="purchase" ? `<td class="num">${stockLoading?"…":stockOf(K.kind==="torder" ? d.destId : d.locationId, l.itemId)===undefined?'<span class="note">Not counted</span>':n2(stockOf(K.kind==="torder" ? d.destId : d.locationId, l.itemId))}</td>` : "";
  const rIn = (f, v, lbl) => `<input type="number" min="0" step="any" inputmode="decimal" class="sel" data-docrecv="${ix}:${f}" value="${esc(v ?? "")}" style="width:110px;text-align:right" aria-label="${lbl} of ${esc(it.name)}">`;
  const recvCell = recv ? `<td class="num">${rIn("qty", r.qty, "Received quantity")}</td>` : (d.status==="closed" && K.kind!=="torder") ? `<td class="num">${n2(l.qty)}</td>` : "";
  let costCells = "";
  if(K.kind==="purchase"){
    const c = recv ? r.cost : (l.cost ?? it.cost), q = recv ? r.qty : l.qty;
    costCells = `<td class="num">${draft ? qIn("cost", l.cost ?? it.cost ?? "", "Unit cost") : recv ? rIn("cost", r.cost, "Unit cost") : usd(+c||0)}</td><td class="num" data-doctc="${ix}">${usd((+q||0)*(+c||0))}</td>`;
  }
  return `<tr>${base}<td>${esc(it.storageUnit||"—")}</td>${srcStock}<td class="num">${qIn("qty", l.qty, "Quantity")}</td>${recvCell}${costCells}${del}</tr>`;
}
async function flowAction(action){
  const d = DOC.edit, K = DOC_KINDS[DOC.open.route]; readDocHeader(); DOC.err = "";
  if(action==="submit"){
    if(!d.locationId || (K.kind==="purchase" && !d.supplierId) || (K.kind!=="purchase" && !d.destId)){ DOC.err = K.kind==="purchase" ? "Choose the supplier and where it's delivered." : "Choose where it comes from and where it goes."; return render(); }
    if(d.items.some(l => !(+l.qty > 0))){ DOC.err = "Enter a quantity for every item, or remove the empty rows."; return render(); }
    if(K.kind==="transfer" && !confirm(`Send ${d.items.length} item${d.items.length===1?"":"s"} from ${locName(d.locationId)} to ${locName(d.destId)}? They're taken out of ${locName(d.locationId)} now.`)) return;
    if(!(await saveDoc(true))) return;
  }
  if(action==="reject" && !confirm(`Reject ${d.ref}?`)) return;
  let lines = null;
  if(action==="receive"){
    lines = d.items.map((l, ix) => ({ itemId:l.itemId, qty: +DOC.recv[ix].qty || 0, ...(K.kind==="purchase" ? { cost: +DOC.recv[ix].cost || 0 } : {}), ordered: +l.qty || 0 }));
    const diff = lines.filter(x => x.qty !== x.ordered).length;
    if(!confirm(`Receive into ${locName(K.kind==="transfer" ? d.destId : d.locationId)}?${diff ? ` ${diff} item${diff===1?"":"s"} differ from what was ${K.kind==="transfer"?"sent":"ordered"}.` : ""}`)) return;
  }
  DOC.busy = true; render();
  const { data, error } = await WOK.sb.rpc("slick_doc_action", { p_id: d.id, p_action: action, p_by: state.fullName || state.userName || null, p_lines: lines });
  DOC.busy = false;
  if(error){ console.error(error); DOC.err = "Couldn't do that: " + error.message; return render(); }
  if(action==="submit"){ d.status = "pending"; d.submittedAt = new Date().toISOString(); d.submittedBy = state.fullName || null; toast(K.kind==="transfer" ? "Transfer sent" : "Submitted"); }
  if(action==="receive"){ d.status = "closed"; d.items = lines; d.receivedAt = new Date().toISOString(); d.receivedBy = state.fullName || null; toast("Received"); DOC.recv = null; }
  if(action==="reject"){ d.status = "rejected"; toast("Rejected"); }
  if(action==="fulfil"){ d.status = "closed"; d.linkedId = data?.transfer; d.receivedBy = state.fullName || null; d.receivedAt = new Date().toISOString(); toast("Transfer created as a draft. Check it and press Send.");
    try{ await put("inv_docs", d.id, { linkedId: data?.transfer }); }catch(e){} }   // also reloads the list so the new transfer shows up
  DASH.key = ""; IC.loaded = {}; DOC.stockAt = 0; loadStock(true); render();
}
document.addEventListener("click", e => {
  const t = e.target;
  const f = t.closest("[data-flow]"); if(f && DOC.open) return flowAction(f.dataset.flow);
  const l = t.closest("[data-doclink]"); if(l){ e.preventDefault(); const [r, id] = l.dataset.doclink.split(":"); location.hash = r; setTimeout(() => openDoc(r, id), 80); }
});
document.addEventListener("input", e => {
  const r = e.target.closest("[data-docrecv]"); if(!r || !DOC.recv) return;
  const [ix, f] = r.dataset.docrecv.split(":"); DOC.recv[+ix][f] = e.target.value;
  const tc = $(`[data-doctc="${ix}"]`); if(tc){ const x = DOC.recv[+ix]; tc.textContent = usd((+x.qty||0)*(+x.cost||0)); }
});

/* ---------- Order transactions: what each sale took out of stock ---------- */
const OT = { kind:"", page:1, per:50, rows:[], count:0, loading:false, key:"", err:"" };
async function loadOT(){
  if(storeMode!=="db") return;
  const key = [OT.kind, OT.page, state.branch].join("|"); if(OT.key===key) return; OT.key = key; OT.loading = true;
  let q = WOK.sb.from("order_transactions").select("*", { count:"exact" }).order("created_at", { ascending:false }).range((OT.page-1)*OT.per, OT.page*OT.per-1);
  if(OT.kind) q = q.eq("kind", OT.kind);
  if(state.branch!=="all") q = q.eq("branch_id", state.branch);
  const { data, error, count } = await q;
  OT.loading = false;
  if(error){ OT.err = error.message; console.error(error); } else { OT.rows = data || []; OT.count = count || 0; OT.err = ""; }
  if(location.hash.slice(1)==="order-transactions") render();
}
function viewOrderTx(){
  loadOT();
  const tabs = [["","All"],["consumption","Consumption"],["return","Return"]];
  const pages = Math.max(1, Math.ceil(OT.count/OT.per));
  let h = `<div class="phead"><h1>Order Transactions</h1><div class="sp"></div>${scopeBar(true)}<button class="btn" id="otRefresh">↻ Refresh</button></div>
    <p class="subt" style="margin-top:-6px">Every completed sale takes its recipe ingredients (product and options, for its order type) out of the branch stock. Voided sales put them back.</p>
    <div class="card tbl"><div class="ttop"><div class="ttabs">${tabs.map(t=>`<a href="#order-transactions" data-ottab="${t[0]}" class="${OT.kind===t[0]?"on":""}">${t[1]}</a>`).join("")}</div><div class="sp"></div><span class="note">${OT.loading?"Loading…":""}</span></div>`;
  if(OT.err) h += `<div class="empty">${esc(OT.err)}</div>`;
  else if(!OT.rows.length) h += `<div class="empty">${OT.loading ? "Loading…" : "No transactions yet. They appear as sales are completed for products that have ingredients."}</div>`;
  else h += `<table><thead><tr><th>Reference</th><th>Branch</th><th>Order</th><th>Type</th><th class="num">Items</th><th class="num">Cost</th><th>Created</th></tr></thead><tbody>${OT.rows.map(r=>`<tr class="click" data-otopen="${esc(r.id)}">
      <td><span class="code">${esc(r.ref)}</span></td><td>${esc(branchName(r.branch_id))}</td><td>#${esc(r.order_no||"")}</td>
      <td>${r.kind==="return"?'<span class="tag off">Return from order</span>':'<span class="tag on">Consumption from order</span>'}</td><td class="num">${(r.items||[]).length}</td><td class="num">${fmtCost(r.total_cost)}</td><td>${fmtDate(r.created_at)}</td></tr>`).join("")}</tbody></table>`;
  h += `<div class="pager"><span class="note">${OT.count} transaction${OT.count===1?"":"s"}</span><div class="sp"></div><button class="btn sm" data-otpage="-1" ${OT.page<=1?"disabled":""}>Previous</button><button class="btn sm" data-otpage="1" ${OT.page>=pages?"disabled":""}>Next</button></div></div>`;
  return h;
}
function openOT(id){
  const r = OT.rows.find(x=>x.id===id); if(!r) return;
  $("#ccBox").innerHTML = `<header><h2>${r.kind==="return"?"Return":"Consumption"} from order (${esc(r.ref)})</h2><button type="button" class="x" data-ccclose aria-label="Close">×</button></header>
    <div class="body"><p class="note">${esc(branchName(r.branch_id))} · Order #${esc(r.order_no||"")} · ${fmtDate(r.created_at)}</p>
    <table><thead><tr><th>Name</th><th>SKU</th><th class="num">Quantity</th><th class="num">Unit cost</th><th class="num">Total cost</th></tr></thead><tbody>${(r.items||[]).map(x => { const it = itemOf(x.itemId) || {};
      return `<tr><td>${esc(it.name||"(deleted item)")}</td><td><span class="code">${esc(it.sku||"")}</span></td><td class="num">${n2(x.qty)} ${esc(it.storageUnit||"")}</td><td class="num">${fmtCost(x.cost)}</td><td class="num">${fmtCost(x.qty*x.cost)}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="4"><b>Total</b></td><td class="num"><b>${fmtCost(r.total_cost)}</b></td></tr></tfoot></table></div>`;
  $("#ccScrim").classList.add("show");
}
document.addEventListener("click", e => {
  const t = e.target;
  const tb = t.closest("[data-ottab]"); if(tb){ e.preventDefault(); OT.kind = tb.dataset.ottab; OT.page = 1; OT.key = ""; return render(); }
  const pg = t.closest("[data-otpage]"); if(pg){ OT.page += +pg.dataset.otpage; OT.key = ""; return render(); }

/* ---------- Inventory documents: quantity & cost adjustments, spot checks, count sheets (Foodics "More") ---------- */
const DOC_KINDS = {
  "quantity-adjustments": { kind:"quantity", title:"Quantity Adjustment", plural:"Quantity Adjustment", loc:1, intro:"Deduct waste, expired or damaged stock, or add stock found. Submitting updates the stock level of each item at the chosen branch or warehouse." },
  "cost-adjustments":     { kind:"cost", title:"Cost Adjustment", plural:"Cost Adjustment", intro:"Adjust your inventory value here by creating a cost adjustment transaction with the new cost of your inventory items." },
  "spot-check":           { kind:"spot", title:"Inventory Spot Check", plural:"Inventory Spot Check", loc:1, intro:"The spot check captures the count of items made by the audit team. It does not change the stock levels and is only used as a reference." },
  "purchase-orders":      { kind:"purchase", title:"Purchase Order", plural:"Purchase Orders", loc:1, flow:1, intro:"Order stock from a supplier. Submit it when it's sent, then receive it when the goods arrive: receiving adds the quantities that actually arrived to the branch or warehouse and updates item costs." },
  "transfer-orders":      { kind:"torder", title:"Transfer Order", plural:"Transfer Orders", loc:1, flow:1, intro:"A branch asks a warehouse (or another branch) for stock. The sender fulfils it by creating a transfer with the same items, which they can adjust before sending." },
  "transfers":            { kind:"transfer", title:"Transfer", plural:"Transfers", loc:1, flow:1, intro:"Move stock between branches and warehouses. Sending takes it out of the source; receiving adds what actually arrived at the destination." },
  "production":           { kind:"production", title:"Production", plural:"Production", loc:1, intro:"Make produced items (sauces, prepped proteins, noodles…) from their ingredients. Submitting adds the produced quantity to the chosen branch or warehouse and takes out the ingredients used, based on each item's ingredient list." },
  "count-sheets":         { kind:"sheet", title:"Inventory Count Sheet", plural:"Count Sheet", intro:"A count sheet is a saved list of items. Pick it in Inventory Count, adjustments or spot checks to load just those items." }
};
const QA_REASONS = ["Waste","Expired","Damaged","Theft","Staff meal","Sample","Found stock","Other"];
const DOC = { tab:{}, q:{}, open:null, edit:null, stock:null, stockAt:0, busy:false, err:"" };
const invCatNames = () => { const m = S.inv_categories.filter(live).map(c=>c.name); S.inv_items.forEach(i=>{ if(i.category && !m.includes(i.category)) m.push(i.category); }); return m.sort((a,b)=>a.localeCompare(b)); };
const locList = () => [...activeBranches().map(b=>[b.id,b.name]), ...S.warehouses.filter(live).map(w=>[w.id, w.name + (w.reference?` (${w.reference})`:"") ])];
const locName = id => branches.find(b=>b.id===id)?.name || S.warehouses.find(w=>w.id===id)?.name || "—";
const itemOf = id => S.inv_items.find(i=>i.id===id);
const n2 = v => (+v||0).toLocaleString("en-US",{maximumFractionDigits:3});
async function loadStock(force){
  if(storeMode!=="db" || DOC.stock==="loading" || (!force && DOC.stock && Date.now()-DOC.stockAt < 60000)) return;
  DOC.stock = "loading";
  const { data, error } = await WOK.sb.rpc("slick_stock_all");
  if(error){ console.error(error); DOC.stock = {}; toast("Couldn't load stock levels"); }
  else { DOC.stock = {}; (data||[]).forEach(r => (DOC.stock[r.location_id] ||= {})[r.item_id] = +r.qty); }
  DOC.stockAt = Date.now(); render();
}
const stockOf = (loc, item) => (DOC.stock && DOC.stock!=="loading" && DOC.stock[loc]) ? DOC.stock[loc][item] : undefined;

// a document belongs to the brand of its branch (from or to); warehouse-only documents show for every brand
const docBrandOk = d => { if(state.brand==="all") return true; const ids = [d.locationId, d.destId].filter(Boolean), br = ids.map(id => branches.find(b=>b.id===id)).filter(Boolean);
  return !br.length || br.some(b => b.brandId===state.brand); };
function viewDocs(route){
  const K = DOC_KINDS[route];
  if(DOC.open && DOC.open.route===route) return viewDoc(route);
  const tab = DOC.tab[route] || "all", q = (DOC.q[route]||"").toLowerCase();
  const all = S.inv_docs.filter(d => d.kind===K.kind && live(d) && docBrandOk(d));
  const list = all.filter(d => tab==="all" || d.status===tab).filter(d => !q || ((d.ref||"")+" "+(d.name||"")+" "+locName(d.locationId)+" "+(d.reason||"")).toLowerCase().includes(q))
    .sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const tabs = K.kind==="sheet" ? [] : K.flow ? [["all","All"],["draft","Draft"],["pending","Pending"],["closed","Closed"],["rejected","Rejected"]] : [["all","All"],["draft","Draft"],["closed","Closed"]];
  if(K.flow) return viewFlowList(route, K, tabs, all, list);
  const cols = K.kind==="sheet" ? [["Reference",d=>`<span class="code">${esc(d.ref||"…")}</span>`],["Name",d=>`<b>${esc(d.name||"—")}</b>`],["Items",d=>(d.items||[]).length,"num"],["Created At",d=>fmtDate(d.createdAt)]]
    : [["Reference",d=>`<span class="code">${esc(d.ref||"…")}</span>`], ...(K.loc?[["Branch",d=>esc(locName(d.locationId))]]:[]), ...(K.kind==="quantity"?[["Reason",d=>esc(d.reason||"—")+(d.direction==="add"?' <span class="tag on">Add</span>':"")]]:[]),
       ["Items",d=>(d.items||[]).length,"num"],["Status",d=>d.status==="closed"?'<span class="tag on">Closed</span>':'<span class="tag off">Draft</span>'],["Business Date",d=>esc(d.businessDate||"—")],["Created",d=>fmtDate(d.createdAt)]];
  let h = `<div class="phead"><h1>${K.plural}</h1><div class="sp"></div>${all.length?`<button class="btn" data-docexport="${route}">Export</button>`:""}${scopeBar(false)}<button class="btn pri" data-docnew="${route}">New ${K.title}</button></div>
    <p class="subt" style="margin-top:-6px">${esc(K.intro)}</p>
    <div class="card tbl"><div class="ttop"><div class="ttabs">${tabs.map(t=>`<a href="#${route}" data-doctab="${route}:${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</a>`).join("")}</div><div class="sp"></div>
    <input class="sel search" data-docq="${route}" placeholder="Search" value="${esc(DOC.q[route]||"")}" aria-label="Search"></div>`;
  h += list.length ? `<table><thead><tr>${cols.map(c=>`<th class="${c[2]||""}">${c[0]}</th>`).join("")}</tr></thead><tbody>${list.map(d=>`<tr class="click" data-docopen="${route}:${esc(d.id)}">${cols.map(c=>`<td class="${c[2]||""}">${c[1](d)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    : `<div class="empty">${all.length ? "Nothing matches." : `No ${K.plural.toLowerCase()} yet.`}</div>`;
  return h + `</div>`;
}

function newDoc(route){
  const K = DOC_KINDS[route];
  DOC.edit = { id:null, kind:K.kind, status:"draft", items:[], businessDate:daysAgo(0), direction:"deduct", reason:K.kind==="quantity"?"Waste":"", locationId: K.loc ? (state.branch!=="all" ? state.branch : (locList()[0]||[])[0] || "") : "", name:"", notes:"" };
  if(K.kind==="torder") DOC.edit.destId = S.warehouses.filter(live)[0]?.id || "";
  DOC.open = { route, id:null }; DOC.err = ""; DOC.recv = null; if(K.loc || K.kind==="cost") loadStock(); render(); window.scrollTo(0,0);
}
function openDoc(route, id){
  const d = S.inv_docs.find(x=>x.id===id); if(!d) return;
  DOC.edit = JSON.parse(JSON.stringify(d)); DOC.edit.items = Array.isArray(DOC.edit.items) ? DOC.edit.items : [];
  DOC.open = { route, id }; DOC.err = ""; DOC.recv = null; if(DOC_KINDS[route].loc) loadStock(); render(); window.scrollTo(0,0);
}

    }
    if(K.kind==="production"){ const uc = ro && l.cost!=null ? +l.cost : recipeCost(it.ingredients), q = +l.qty||0, none = !ro && !(it.ingredients||[]).length;
      return `<tr>${base}<td>${esc(it.storageUnit||"—")}${none?' <span class="tag off">No ingredients</span>':""}</td><td class="num">${qIn("qty", l.qty, "Quantity")}</td><td class="num">${fmtCost(uc)}</td><td class="num" data-doctc="${ix}">${fmtCost(uc*q)}</td>${del}</tr>`; }
    if(K.kind==="cost") return `<tr>${base}<td>${esc(it.storageUnit||"—")}</td><td class="num">${ro ? (l.old!=null?usd(l.old):"—") : (+it.cost?usd(it.cost):"—")}</td><td class="num">${ro?usd(l.cost):qIn("cost", l.cost, "New cost")}</td>${del}</tr>`;
    if(K.kind==="spot"){ const sys = ro ? l.sys : cur, c = l.qty, v = (c===""||c==null||sys==null) ? null : +c - +sys;
      return `<tr>${base}<td>${esc(it.storageUnit||"—")}</td><td class="num">${stockLoading&&!ro?"…":sys==null?'<span class="note">Not counted</span>':n2(sys)}</td><td class="num">${qIn("qty", l.qty, "Counted quantity")}</td>

    : K.kind==="spot" ? ["Name","SKU","Storage unit","System qty","Counted qty","Variance"] : ["Name","SKU","Storage UOM","Ingredients UOM"];
  const numCols = new Set(["Current qty","Deducted qty","Added qty","New qty","Unit cost","Total cost","Current cost","Old cost","New cost","System qty","Counted qty","Variance","Quantity","Ordered","Sent","Requested","Received","In stock at source"]);

    : `<div class="empty">No items yet. Add items above${K.kind==="sheet"?"":" or load a count sheet"}.</div>`;
  h += `</div>`;
  if(K.kind==="production" && d.items.length) h += prodUsage(d, ro, loc);

// what a production batch takes out of stock (preview while drafting, actual once submitted)
function prodUsage(d, ro, loc){
  let list;
  if(ro) list = (d.consumed||[]).map(c => ({ itemId:c.itemId, qty:+c.qty, cost:+c.cost }));
  else { const m = {}; d.items.forEach(l => { const it = itemOf(l.itemId); (it?.ingredients||[]).forEach(g => { const sub = itemOf(g.itemId); if(!sub) return; m[sub.id] = (m[sub.id]||0) + (+g.qty||0) * (+l.qty||0) / (+sub.factor||1); }); });
    list = Object.entries(m).map(([id, q]) => ({ itemId:id, qty:q, cost:+(itemOf(id)?.cost)||0 })); }
  if(!list.length) return `<div class="card" style="margin-top:16px"><b>${ro?"Consumption from production":"Ingredients that will be used"}</b><p class="note" style="margin:6px 0 0">${ro?"Nothing was consumed.":"Enter quantities, and make sure each produced item has ingredients (open it under Inventory → Items)."}</p></div>`;
  const total = list.reduce((s,x)=>s + x.qty*x.cost, 0);
  return `<div class="card tbl" style="margin-top:16px"><div class="ttop"><b>${ro?"Consumption from production":"Ingredients that will be used"}</b><span class="note" style="margin-left:8px">${ro?"Taken out of stock when this was submitted.":"Updates as you type quantities."}</span></div>
    <table><thead><tr><th>Name</th><th>SKU</th><th class="num">Quantity</th>${ro?"":'<th class="num">In stock</th>'}<th class="num">Unit cost</th><th class="num">Total cost</th></tr></thead><tbody>${list.sort((a,b)=>(itemOf(a.itemId)?.name||"").localeCompare(itemOf(b.itemId)?.name||"")).map(x => { const it = itemOf(x.itemId) || {}, cur = stockOf(loc, x.itemId), short = !ro && cur!==undefined && cur < x.qty;
      return `<tr><td><b>${esc(it.name||"(deleted item)")}</b></td><td><span class="code">${esc(it.sku||"")}</span></td><td class="num">${n2(x.qty)} ${esc(it.storageUnit||"")}</td>${ro?"":`<td class="num" style="${short?"color:var(--accent-ink);font-weight:600":""}">${cur===undefined?'<span class="note">Not counted</span>':n2(cur)}</td>`}<td class="num">${fmtCost(x.cost)}</td><td class="num">${fmtCost(x.qty*x.cost)}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="${ro?4:5}"><b>Total</b></td><td class="num"><b>${fmtCost(total)}</b></td></tr></tfoot></table></div>`;
}

function docRowLive(ix){   // update the computed cells of one row while typing

function docAddItems(ids){

async function saveDoc(silent){

    if(K.kind==="cost"){ o.cost = l.cost===""||l.cost==null ? null : +l.cost; o.old = it.cost ?? null; }
    if(K.kind==="production"){ o.qty = l.qty===""||l.qty==null ? null : +l.qty; o.cost = +recipeCost(it.ingredients).toFixed(5); }
    if(K.kind==="spot"){ o.qty = l.qty===""||l.qty==null ? null : +l.qty; const s = stockOf(d.locationId, l.itemId); o.sys = s===undefined ? null : s; }
    if(K.flow){ o.qty = l.qty===""||l.qty==null ? null : +l.qty; if(K.kind==="purchase") o.cost = l.cost===""||l.cost==null ? (+it.cost||0) : +l.cost; }

  });

async function submitDoc(){

      <button class="btn pri" id="icSave" ${entered && !IC.saving?"":"disabled"}>${IC.saving?"Saving…":"Save count"}</button>
    </div>
    ${IC.loaded[IC.branch]==="loading" ? `<p class="note">Loading last counts…</p>` : ""}
    <div class="card tbl"><table><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th class="num">Last count</th><th class="num">Min</th><th class="num" style="width:150px">Counted now</th></tr></thead><tbody>${
      items.length ? items.map(i => { const l = lv[i.id], low = l && +i.minLevel>0 && +l.qty < +i.minLevel;
        return `<tr><td><b>${esc(i.name)}</b> <span class="code">${esc(i.sku||"")}</span></td><td>${esc(i.category||"—")}</td><td>${esc(i.storageUnit||"—")}</td>
          <td class="num"${low?' style="color:var(--accent-ink);font-weight:600"':""}>${l ? `${(+l.qty).toLocaleString()} <span class="note">· ${fmtD(l.counted_at)}</span>` : '<span class="note">Never</span>'}</td>
          <td class="num">${+i.minLevel ? (+i.minLevel).toLocaleString() : "—"}</td>
          <td class="num"><input type="number" min="0" step="any" inputmode="decimal" class="sel" data-ic="${esc(i.id)}" value="${esc(d[i.id] ?? "")}" style="width:120px;text-align:right" aria-label="Counted quantity of ${esc(i.name)}"></td></tr>`; }).join("")
      : `<tr><td colspan="6" class="note">No items match.</td></tr>`
    }</tbody></table></div>`;
}
async function saveCount(){
  const d = IC.draft[IC.branch] || {}, now = new Date().toISOString(), batch = "cnt_" + Date.now().toString(36);
  const rows = Object.entries(d).filter(([,v]) => v!=="" && v!=null && !isNaN(+v) && +v>=0).map(([item, v]) => ({ branch_id: IC.branch, item_id: item, qty: +v, counted_at: now, counted_by: state.userName || null, batch }));
  if(!rows.length) return;
  IC.saving = true; render();
  const { error } = await WOK.sb.from("stock_counts").insert(rows);
  IC.saving = false;
  if(error){ console.error(error); toast("Couldn't save the count: " + error.message); render(); return; }
  IC.draft[IC.branch] = {}; DASH.key = ""; toast(`Saved ${rows.length} item${rows.length===1?"":"s"} for ${locName(IC.branch)}`);
  await loadLevels(IC.branch, true); render();
}
$("#view").addEventListener("input", e => {
  const inp = e.target.closest("[data-ic]");
  if(inp){ (IC.draft[IC.branch] ||= {})[inp.dataset.ic] = inp.value;
    const n = Object.values(IC.draft[IC.branch]).filter(v=>v!=="").length;
    $("#icCount").textContent = `${n} item${n===1?"":"s"} entered`; $("#icSave").disabled = !n; $("#icClear").disabled = !n; return; }
  if(e.target.id==="icQ"){ IC.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#icQ"); el.focus(); el.setSelectionRange(pos,pos); }
});
$("#view").addEventListener("change", e => {
  if(e.target.id==="icBranch"){ IC.branch = e.target.value; render(); }
  if(e.target.id==="icCat"){ IC.cat = e.target.value; render(); }
  if(e.target.id==="icSheet"){ IC.sheet = e.target.value; render(); }
});
$("#view").addEventListener("click", e => {
  if(e.target.id==="icSave") saveCount();
  if(e.target.id==="icClear" && confirm("Clear the quantities you typed for this branch?")){ IC.draft[IC.branch] = {}; render(); }
  const cb = e.target.closest("[data-icbranch]"); if(cb) IC.branch = cb.dataset.icbranch;
});

/* ---------- KPI breakdown ("View Report") ---------- */
function openReport(title){
  const D = DASH.cur; if(!D) return;
  const hr = Array.from({length:24}, (_,h) => D.hours.find(x=>x.h===h) || { h, n:0, net:0, pay:0, disc:0 }).filter(x => x.n).sort((a,b) => (a.h-dayStartH()+24)%24 - (b.h-dayStartH()+24)%24);
  const period = rangeDays()===1 ? new Date(state.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}) : `${rangeDays()} days to ${new Date(state.date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
  const scope = state.branch==="all" ? (state.brand==="all" ? "All branches" : brandName(state.brand)) : (branches.find(b=>b.id===state.branch)?.name || "");
  const rowH = x => [hourLbl(x.h), x.n, (+x.net).toFixed(2), (+x.pay).toFixed(2), (+x.disc).toFixed(2), (x.n ? x.net/x.n : 0).toFixed(2)];
  const days = (D.days||[]).map(x => [x.d, x.n, (+x.net).toFixed(2)]);
  window.__rep = { title, period, scope, hr: hr.map(rowH), days };
  const box = $("#ccBox"); box.className = "modal wide";
  box.innerHTML = `<header><h2>${esc(title)} · ${esc(period)}</h2><button type="button" class="x" data-ccclose aria-label="Close">×</button></header>
    <div style="padding:16px 22px;max-height:70vh;overflow:auto"><p class="note" style="margin-top:0">${esc(scope)}. Orders that were declined or still drafts are left out.</p>
    <div class="card tbl"><table><thead><tr><th>Hour</th><th class="num">Orders</th><th class="num">Net sales</th><th class="num">Net payments</th><th class="num">Discounts</th><th class="num">Avg. ticket</th></tr></thead><tbody>${
      hr.length ? hr.map(x=>`<tr><td>${hourLbl(x.h)}</td><td class="num">${x.n}</td><td class="num">${money(+x.net)}</td><td class="num">${money(+x.pay)}</td><td class="num">${money(+x.disc)}</td><td class="num">${money(x.n?x.net/x.n:0)}</td></tr>`).join("")
        + `<tr style="font-weight:600"><td>Total</td><td class="num">${D.orders}</td><td class="num">${money(+D.net)}</td><td class="num">${money(+D.payments)}</td><td class="num">${money(+D.discount)}</td><td class="num">${money(D.orders?D.net/D.orders:0)}</td></tr>`
      : `<tr><td colspan="6" class="note">No sales in this period.</td></tr>`}</tbody></table></div>
    ${rangeDays()>1 && days.length ? `<h3 style="margin:18px 0 8px;font-size:15px">By day</h3><div class="card tbl"><table><thead><tr><th>Date</th><th class="num">Orders</th><th class="num">Net sales</th></tr></thead><tbody>${D.days.map(x=>`<tr><td>${new Date(x.d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</td><td class="num">${x.n}</td><td class="num">${money(+x.net)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div><footer><button type="button" class="btn" id="repCsv">Download CSV</button><button type="button" class="btn pri" data-ccclose>Close</button></footer>`;
  $("#ccScrim").classList.add("show");
}
function downloadReportCsv(){
  const r = window.__rep; if(!r) return;
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v;
  const lines = [[`Slick sales report`], [r.scope], [r.period], [], ["Hour","Orders","Net sales (USD)","Net payments (USD)","Discounts (USD)","Avg ticket (USD)"], ...r.hr];
  if(r.days.length > 1) lines.push([], ["Date","Orders","Net sales (USD)"], ...r.days);
  const blob = new Blob([lines.map(l => l.map(q).join(",")).join("\n")], { type:"text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `slick-sales-${dashFrom()}-to-${state.date}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
document.body.insertAdjacentHTML("beforeend", `<div class="scrim" id="crudScrim"><form class="modal" id="crudBox" autocomplete="off"></form></div>
  <div class="scrim" id="ccScrim"><div class="modal wide" id="ccBox"></div></div>`);
$("#crudBox").addEventListener("submit", submitCrud);
$("#crudScrim").addEventListener("click", async e => {
  if(e.target.id==="crudScrim" || e.target.closest("[data-cclose]")) return closeCrud();
  if(e.target.closest("#cDelete")) return softDelete(true);
  if(e.target.closest("#cRestore")) return softDelete(false);
  if(e.target.closest("#dSave")){
    const name = $("#dName").value.trim(), branchId = $("#dBranch").value;
    if(!name || !branchId){ $("#cErr").textContent = "Name and branch are required."; return; }
    const code = newCode();
    try{ await put("devices", null, { name, type:$("#dType").value, branchId, code }); closeCrud(); toast(`Device created · activation code ${code}`); }
    catch(err){ console.error(err); $("#cErr").textContent = "Couldn't create the device."; }
  }
});
$("#ccScrim").addEventListener("click", e => { if(e.target.id==="repCsv") return downloadReportCsv();
  const oa = e.target.closest("[data-oact]"); if(oa) return orderAction(oa.dataset.oact);
  if(e.target.closest("[data-oprint]")) return printOrder();
  if(e.target.id==="ccScrim" || e.target.closest("[data-ccclose]")) ORD.open = null;
  if(e.target.id==="ccScrim" || e.target.closest("[data-ccclose]")) return $("#ccScrim").classList.remove("show");
  const ot = e.target.closest("[data-ot]"); if(ot && !ot.disabled){ document.querySelectorAll("#oType button").forEach(b=>b.classList.toggle("on", b===ot)); ccAddrVis(); ccAddrLock(); renderCart(false); }
  const oc = e.target.closest("[data-ocat]"); if(oc){ state.oCat = oc.dataset.ocat; if($("#oSearch")) $("#oSearch").value = ""; renderOrderMenu(); $("#oProducts").scrollTop = 0; }
  const ce = e.target.closest("[data-cedit]"); if(ce){ e.preventDefault(); ccEditItem(+ce.dataset.cedit); return; }
  const add = e.target.closest("[data-add]"); if(add){ const p = S.products.find(x=>x.id===add.dataset.add); if(p) ccAdd(p); }
  const q = e.target.closest("[data-q]"); if(q){ const [ix,d] = q.dataset.q.split(":").map(Number); cart[ix].qty += d; if(cart[ix].qty<=0) cart.splice(ix,1); renderCart(false); }
  const sv = e.target.closest("[data-osave]"); if(sv) saveOrder(sv.dataset.osave);
  const st = e.target.closest("[data-ostatus]"); if(st) setOrderStatus(st.dataset.ostatus);
});
$("#ccScrim").addEventListener("input", e => { if(e.target.id==="oSearch") renderOrderMenu(); if(e.target.closest(".ccleft") && $("#oErr1")) $("#oErr1").textContent = ""; });
$("#ccScrim").addEventListener("click", e => { if(e.target.closest("#oCatBack")){ state.oCat = ""; if($("#oSearch")) $("#oSearch").value = ""; renderOrderMenu(); } });
$("#ccScrim").addEventListener("change", e => {
  if(e.target.id==="oBrand"){ fillOrderBranches(""); cart = cart.filter(i => S.products.find(p=>p.id===i.productId)?.brandId===e.target.value); state.oCat=""; renderOrderMenu(); renderCart(false); setTimeout(() => $("#oBranch")?.focus(), 0); }
  if(e.target.id==="oBranch"){ renderOrderMenu(); renderCart(false); }
  const cg = e.target.closest("[data-ochg]"); if(cg){ if(!ccChg) ccChg = new Set(ccCharges().picked.map(c=>c.id)); cg.checked ? ccChg.add(cg.dataset.ochg) : ccChg.delete(cg.dataset.ochg); renderCart(false); }
});
$("#view").addEventListener("click", async e => {
  const t = e.target;
  const tab = t.closest("[data-tab]"); if(tab){ e.preventDefault(); const [k,v] = tab.dataset.tab.split(":"); state.tabs[k] = v; state.page[k] = 1; render(); return; }
  const cr = t.closest("[data-create]"); if(cr) return openCrud(cr.dataset.create);
  const op = t.closest("[data-open]"); if(op && !t.closest("a")){ const i = op.dataset.open.indexOf(":"), k = op.dataset.open.slice(0,i), id = op.dataset.open.slice(i+1); return CRUD[k].detail ? openDetail(k, id) : openCrud(k, id); }
  const pg = t.closest("[data-page]"); if(pg){ const [k,v] = pg.dataset.page.split(":"); state.page[k] = +v; render(); window.scrollTo(0,0); return; }
  const cf = t.closest("[data-catfilter]"); if(cf){ e.preventDefault(); const id = cf.dataset.catfilter, c = S.categories.find(x=>x.id===id); location.hash = "products";
    setTimeout(() => { if(c && state.brand!=="all" && c.brandId!==state.brand) state.brand = "all"; state.catFilter = id; state.tabs.products = "all"; state.page.products = 1; render(); }, 60); return; }
  const ic = t.closest("[data-invcat]"); if(ic){ e.preventDefault(); const n = ic.dataset.invcat; location.hash = "inv-items";
    setTimeout(() => { state.invCat = n; state.tabs["inv-items"] = "all"; state.page["inv-items"] = 1; render(); }, 60); return; }
  if(t.closest("[data-clearcat]")){ state.catFilter = ""; render(); return; }
  if(t.closest("#ccNew")) return openOrder();
  const oc = t.closest("[data-order]"); if(oc) return openOrder(oc.dataset.order);
  if(t.closest("#devNew")) return openDevice();
  const dc = t.closest("[data-devcode]"); if(dc){ const code = newCode(); await put("devices", dc.dataset.devcode, { code, activatedAt:null }); toast("New activation code " + code); return; }
  const dd = t.closest("[data-devdel]"); if(dd){ await put("devices", dd.dataset.devdel, { deleted:true }); toast("Device removed"); return; }
  if(t.closest("#olSave")) return saveOnline();
});
$("#view").addEventListener("input", e => {
  const s = e.target.closest("[data-search]"); if(!s) return;
  const k = s.dataset.search; state.q[k] = s.value; state.page[k] = 1;
  const pos = s.selectionStart; render(); const n = document.querySelector(`[data-search="${k}"]`); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
});
$("#view").addEventListener("change", e => {
  if(e.target.id==="ccBranch"){ state.ccBranch = e.target.value; render(); }
  if(e.target.id==="ccAgent"){ state.ccAgent = e.target.value; render(); }
});

state.date = todayStr();
render();
initStore();
document.getElementById("signOut").addEventListener("click", () => window.WOK && WOK.user.signOut());
})();
</script>
</body>
