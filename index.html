<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slick – Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f9; --surface:#fff; --ink:#1c1b22; --ink2:#5b5a66; --muted:#8d8c98; --line:#e7e6ec;
  --accent:#5b2bc4; --accent-soft:#f1ecfc; --accent-ink:#47209e;
  --chart:#5b2bc4; --chart-soft:#ece6fa;
  --good:#1f8a4c; --good-soft:#e5f5ec; --warn:#a86500; --warn-soft:#fdf1dc;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted)}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--ink2);text-decoration:none;cursor:pointer;text-align:left;font-weight:500}
.nav a:hover,.nav button:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav .chev{margin-left:auto;transition:transform .15s;color:var(--muted)}
.nav .grp.open .chev{transform:rotate(90deg)}
.nav .sub{display:none;padding:2px 0 6px 30px}
.nav .grp.open .sub{display:block}
.nav .sub a{padding:6px 10px;font-weight:400;font-size:13px}
.nav .sub .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px 2px}
.ico{width:18px;height:18px;flex:none}
/* top */
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.content{padding:24px 28px 60px;max-width:1280px}
h1{font-size:22px;margin:0 0 4px}
.subt{color:var(--ink2);margin:0 0 18px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 0;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;font-weight:500}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.drpbtn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;color:inherit}
.drpbtn svg{width:16px;height:16px}
.drp{position:absolute;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(21,19,31,.16);padding:14px;width:300px}
.drp .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.drp .dh button{border:0;background:none;cursor:pointer;font-size:18px;padding:2px 10px;border-radius:8px;color:inherit}
.drp .dh button:hover{background:var(--line)}
.drp .dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}
.drp .dw{font-size:11px;color:var(--ink2);padding:4px 0}
.drp .dd{border:0;background:none;padding:7px 0;cursor:pointer;font:inherit;color:inherit;border-radius:0}
.drp .dd:disabled{opacity:.3;cursor:default}
.drp .dd.in{background:var(--chart-soft,#f3efff)}
.drp .dd.ed{background:var(--accent);color:#fff;border-radius:8px}
.drp .dd.today:not(.ed){font-weight:700;text-decoration:underline}
.drp .dq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.drp .dq button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:inherit}
.drp .dn{font-size:12px;color:var(--ink2);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#cfcdd8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.danger{color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
/* cards */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kpi{box-shadow:0 1px 3px rgba(20,18,40,.06)}
.kh{display:flex;align-items:center;justify-content:space-between}
.kh h3{font-size:14px;font-weight:600;color:var(--ink)}
.vr{font-size:13px;color:#3f6fd8;text-decoration:none}.vr:hover{text-decoration:underline}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--accent-ink)}
.kpi .chart{margin-top:10px}
.new{background:#1f8a4c;color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;vertical-align:2px}
.fbar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink2)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .trk{width:34px;height:20px;border-radius:999px;background:#d9d7e0;position:relative;transition:background .15s}
.toggle .trk::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle input:checked+.trk{background:var(--accent)}.toggle input:checked+.trk::after{left:16px}
.toggle input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--ink2)}
.kpi .v{font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:1fr 1fr;margin-top:16px}
@media(max-width:1000px){.two{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip b{font-weight:600}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tbl{padding:0;overflow:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:500}
.tag.on{background:var(--good-soft);color:var(--good)}
.tag.off{background:var(--bg);color:var(--muted)}
.tag.cc{background:var(--chart-soft);color:var(--chart)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink2)}
.empty{text-align:center;padding:48px 20px;color:var(--ink2)}
.banner{background:var(--warn-soft);color:var(--warn);padding:9px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.note{font-size:12px;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,30,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.scrim.show{display:flex}
.modal{background:var(--surface);border-radius:12px;width:min(620px,100%);box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header h2{margin:0;font-size:17px;flex:1}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:500;color:var(--ink2)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--chart-soft);border-color:var(--chart)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.err{color:var(--accent-ink);font-size:12px;grid-column:1/-1;min-height:0}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.ph{display:grid;place-items:center;text-align:center;padding:70px 20px;color:var(--ink2)}
.ph .big{font-size:18px;color:var(--ink);font-weight:600;margin-bottom:6px}

.phead{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.phead h1{margin:0}.phead .sp,.ttop .sp,.pager .sp{flex:1}
.ttop{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ttabs{display:flex;gap:18px}.ttabs a{color:var(--ink2);text-decoration:none;font-weight:500;padding:4px 0;border-bottom:2px solid transparent}.ttabs a.on{color:var(--ink);border-color:var(--accent)}
.search{min-width:220px}
tr.click{cursor:pointer}tr.click:hover td{background:#faf9fd}
.pager{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{color:#3f6fd8;text-decoration:none}.lnk:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px}
.chip button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px}
.multi{display:flex;flex-wrap:wrap;gap:6px 16px}
.f textarea{resize:vertical}
.tabs a.dis{opacity:.5;pointer-events:none}
.card h3.ct,.ct{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:230px}
.bhead{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.cnt{font-size:12px;background:var(--bg);border-radius:999px;padding:0 8px;color:var(--ink2)}.cnt.hot{background:var(--accent);color:#fff}
.info{width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700;cursor:help}
.bempty{background:#ededf2;border-radius:8px;padding:44px 12px;text-align:center;color:var(--ink2);font-size:13px}
.ocard{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(20,18,40,.08)}
.ocard:hover{border-color:#cfc6ee}
.orow{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.oline{display:flex;gap:8px;align-items:flex-start;font-size:13px}.oline .ico{width:15px;height:15px;margin-top:2px;color:var(--ink2)}
.ototal{font-weight:600;font-size:15px}
.spill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;background:var(--bg);color:var(--ink2)}
.s-active{background:#fdf0e6;color:#b45a12}.s-pending{background:#e8f0fd;color:#2c5fb8}.s-closed{background:var(--good-soft);color:var(--good)}.s-declined{background:#fdecef;color:#9e0c24}.s-void{background:#eee;color:#666;text-decoration:line-through}.s-draft{background:#f1eff6;color:#5b5a66}
.otbl tr.clk{cursor:pointer}.otbl tr.clk:hover td{background:#faf9fc}.odet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px;margin-bottom:16px}.odet div span{display:block;font-size:12px;color:var(--muted)}
.modal.wide{width:min(1000px,100%)}
.ccgrid{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:18px 22px}
@media(max-width:800px){.ccgrid{grid-template-columns:1fr}}
.ccleft{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}.chipb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow:auto}
.pbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13px}
.pbtn:hover{border-color:var(--accent)}.pbtn b{font-weight:600;color:var(--accent-ink)}
.cart{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.citem{display:grid;grid-template-columns:1fr auto 90px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.qty{display:inline-flex;align-items:center;gap:8px}.qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.ctot{display:flex;justify-content:space-between;font-size:16px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.setup{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.setup>div:first-child{flex:1;min-width:280px}
.steps{margin:8px 0 0;padding-left:20px;color:var(--ink2)}.steps li{margin:4px 0}
.apk{display:flex;flex-direction:column;gap:6px;align-items:center}
.acode{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.15em;background:var(--bg);padding:3px 8px;border-radius:6px}
.linkbox{border:1px dashed var(--line);border-radius:8px;padding:9px 10px}
.zmap{height:340px;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.zh{background:#fff;border:2px solid #5b2bc4;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.lg{display:inline-flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.leaflet-container{font:inherit}

/* ================= Slick modern theme ================= */
:root{
  --bg:#f4f5fa; --surface:#fff; --ink:#15131f; --ink2:#55536a; --muted:#8c8aa0; --line:#e8e8f0;
  --accent:#6c47ff; --accent-soft:#f0ecff; --accent-ink:#5130e8; --accent-2:#a855f7;
  --chart:#6c47ff; --chart-soft:#ebe5ff;
  --good:#12a150; --good-soft:#e3f7ec; --warn:#b26a00; --warn-soft:#fff3dc; --bad:#e5484d; --bad-soft:#fdecee;
  --radius:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(21,19,31,.04),0 4px 16px rgba(21,19,31,.05);
  --shadow-lg:0 12px 40px rgba(21,19,31,.14);
  --side:#13111c; --side-2:#1d1a29; --side-ink:#a9a6bd;
}
body{background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
::selection{background:var(--accent-soft)}
/* sidebar */
.app{grid-template-columns:256px 1fr}
.side{background:var(--side);border-right:0;padding:18px 14px 24px;scrollbar-width:thin;scrollbar-color:#2c2840 transparent}
.brand{padding:6px 8px 22px;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px rgba(108,71,255,.45);font-size:15px;letter-spacing:.02em;overflow:hidden}
.brand b{color:#fff;font-size:15px;font-weight:650}.brand small{color:#77738c;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{color:var(--side-ink);border-radius:10px;padding:9px 12px;font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav a:hover,.nav button:hover{background:var(--side-2);color:#fff}
.nav > a.on{background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;box-shadow:0 6px 16px rgba(108,71,255,.35)}
.nav .grp.open > button{color:#fff}
.nav .grp.open > button .ico{color:#c4b5fd}
.nav .chev{color:#5e5a73;font-size:16px}
.nav .sub{padding:4px 0 8px 14px;margin-left:20px;border-left:1px solid #2a2639}
.nav .sub a{padding:7px 10px;font-size:13px;gap:9px;color:#8f8ba5}
.nav .sub a .ico{width:15px;height:15px;opacity:.8}
.nav .sub a.on{background:rgba(108,71,255,.18);color:#fff}
.nav .sub a.on .ico{color:#c4b5fd;opacity:1}
.nav .sub .lbl{color:#5e5a73;font-size:10.5px;letter-spacing:.08em;padding:10px 10px 4px}
.ico{width:18px;height:18px}
/* top bar */
.top{background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);padding:12px 32px;gap:10px}
.top .sel{border-radius:999px;padding:8px 14px;background:var(--surface);box-shadow:var(--shadow)}
.pill{background:var(--good-soft);color:var(--good);font-weight:600;padding:5px 11px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:650;font-size:13px}
#who{font-weight:600;color:var(--ink);font-size:13px}
.menuBtn{display:none;border:0;background:var(--surface);border-radius:10px;width:38px;height:38px;box-shadow:var(--shadow);cursor:pointer}
.content{padding:28px 32px 70px;max-width:1360px}
/* headings */
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.phead{gap:12px;margin-bottom:20px}
.hico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),#f7f3ff);color:var(--accent);display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px #e4dcff}
.hico .ico{width:21px;height:21px}
.titlewrap{display:flex;align-items:center;gap:12px}
.subt{color:var(--ink2);font-size:14px}
/* buttons */
.btn{border-radius:var(--r-sm);padding:9px 15px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:all .15s;background:var(--surface);box-shadow:0 1px 2px rgba(21,19,31,.05)}
.btn .ico{width:16px;height:16px}
.btn:hover{border-color:#d4d2e0;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-ink));border-color:transparent;box-shadow:0 6px 16px rgba(108,71,255,.3)}
.btn.pri:hover{background:linear-gradient(135deg,#7a58ff,var(--accent-ink));box-shadow:0 8px 22px rgba(108,71,255,.38)}
.btn.danger{color:var(--bad);border-color:#f6cfd2}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{transform:none;box-shadow:none}
.seg{border-radius:12px;padding:3px;gap:2px;background:#ecebf3;border:0}
.seg button{border-radius:9px;padding:7px 16px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(21,19,31,.12)}
/* cards */
.card{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.card.tbl{padding:0}
.kpi{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo" id="coLogo">S</div><div><b id="coName">Slick</b><small id="coSub">Restaurant ERP</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <button class="menuBtn" id="menuBtn" type="button" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <select class="sel" id="brandSel" aria-label="Brand filter"></select>
      <select class="sel" id="branchSel" aria-label="Branch filter"></select>
      <span id="syncPill" style="display:none"></span>
      <div class="sp"></div>
      <div class="acct"><button type="button" class="acctbtn" id="acctBtn" aria-haspopup="menu" aria-expanded="false"><span class="avatar" id="avatar" aria-hidden="true">S</span><span id="who"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="acctmenu" id="acctMenu" role="menu" hidden>
          <div class="acchead"><b id="amName">—</b><span class="note" id="amEmail"></span><span class="tag on" id="amRole" style="margin-top:6px;align-self:flex-start">Owner</span></div>
          <a href="#account" role="menuitem">Account settings</a>
          <button type="button" role="menuitem" id="amSignOut">Sign out</button>
        </div></div><button class="btn sm" id="signOut" type="button" style="display:none"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/></svg>Sign out</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="scrim" id="scrim">
  <form class="modal wide" id="branchForm" autocomplete="off">
    <header><h2 id="mTitle">Add branch</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
    <div class="body bform">
      <h4 class="fsec">General</h4>
      <div class="f"><label for="fName">Branch name *</label><input id="fName" required maxlength="60" placeholder="e.g. Hamra"></div>
      <div class="f"><label for="fNameAr">Name (Arabic)</label><input id="fNameAr" maxlength="60" dir="auto"></div>
      <div class="f"><label for="fCode">Reference code</label><input id="fCode" maxlength="10" placeholder="Auto"></div>
      <div class="f"><label for="fBrand">Brand *</label><select id="fBrand"></select></div>
      <div class="f"><label for="fTaxNo">Branch tax (VAT) number</label><input id="fTaxNo" maxlength="40" placeholder="Leave empty to use the company's"></div>
      <div class="f"><label for="fPhone">Phone</label><input id="fPhone" maxlength="30"></div>
      <div class="f full"><label for="fAddr">Address</label><input id="fAddr" maxlength="160"></div>
      <div class="f"><label for="fCity">Area / city</label><input id="fCity" maxlength="60" placeholder="e.g. Beirut"></div>
      <div class="f"><label>Location (latitude, longitude)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="fLat" inputmode="decimal" placeholder="33.89" ><input id="fLng" inputmode="decimal" placeholder="35.50"></div><a class="lnk note" id="fMapLnk" target="_blank" rel="noopener" href="https://www.google.com/maps">Find it on Google Maps</a></div>
      <h4 class="fsec">Opening hours</h4>
      <div class="f full"><div class="hours" id="fHours"></div><div class="note">Times after midnight (e.g. closes 02:00) count for the day that opened. Reports use the business day set under Company.</div></div>
      <h4 class="fsec">Order types at this branch</h4>
      <div class="f full"><div class="multi" id="fTypes"><label class="chk"><input type="checkbox" value="dinein"> Dine-in</label><label class="chk"><input type="checkbox" value="takeaway"> Pickup</label><label class="chk"><input type="checkbox" value="delivery"> Delivery</label></div></div>
      <h4 class="fsec">Receipt</h4>
      <div class="f full"><label for="fRHead">Receipt header</label><textarea id="fRHead" rows="2" maxlength="300" placeholder="e.g. Welcome to The Wok Hamra"></textarea></div>
      <div class="f full"><label for="fRFoot">Receipt footer</label><textarea id="fRFoot" rows="2" maxlength="300" placeholder="e.g. Thank you! Follow us @thewok"></textarea></div>
      <h4 class="fsec">Options</h4>
      <div class="f full">
        <label class="chk"><input type="checkbox" id="fActive" checked> Active (shows in reports and filters)</label>
        <label class="chk"><input type="checkbox" id="fCC" checked> Receives call-center orders</label>
        <label class="chk"><input type="checkbox" id="fProd"> Central kitchen / production site</label>
      </div>
      <input type="hidden" id="fOpen" value="11:00"><input type="hidden" id="fClose" value="23:30"><input type="hidden" id="fZones">
      <div class="err" id="fErr"></div>
    </div>
    <footer>
      <button type="button" class="btn danger" id="delBtn" style="margin-right:auto;display:none">Delete branch</button>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn pri" id="saveBtn">Save branch</button>
    </footer>
  </form>
</div>

<div class="scrim" id="confirmScrim">
  <div class="modal" style="width:min(420px,100%)">
    <header><h2>Delete branch?</h2></header>
    <div style="padding:18px 22px" id="confirmText"></div>
    <footer><button class="btn" id="cNo">Cancel</button><button class="btn pri" id="cYes">Delete</button></footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// modifiers shown as a list under the product: one line per option ("2× Cheese"), then the item note
const modLines = i => { if(Array.isArray(i.options) && i.options.length){ const t = []; i.options.forEach(x => { const f = t.find(y => y.name===x.name); if(f) f.n++; else t.push({ name:x.name, n:1 }); }); return [...t.map(x => (x.n > 1 ? x.n + "× " : "") + x.name), ...(i.note ? ["Note: " + i.note] : [])]; }
  return String(i.mods||"").split(" · ").flatMap(p => p.startsWith("Note: ") ? [p] : p.split(", ")).map(x => x.trim()).filter(Boolean); };
const modList = i => { const l = modLines(i); return l.length ? `<ul class="mlist">${l.map(x => `<li${x.startsWith("Note: ") ? ' class="mn"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""; };
// every date-with-time on screen, receipt or export uses the 12-hour clock
(() => { const P = Date.prototype, ls = P.toLocaleString, lt = P.toLocaleTimeString;
  P.toLocaleString = function(l, o){ return ls.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); };
  P.toLocaleTimeString = function(l, o){ return lt.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); }; })();

const coSet = () => { try{ return S.settings.find(x=>x.id==="company") || {}; }catch(e){ return {}; } };
const DEC = () => { const d = coSet().priceDecimals; return d===0||d==="0" ? 0 : +d || 2; };
const CUR = () => coSet().currency || "USD";
const money = n => CUR() + " " + (+n||0).toLocaleString("en-US",{minimumFractionDigits:DEC(),maximumFractionDigits:DEC()});
// the same amount in the second currency (e.g. LBP at the day's rate), or "" when none is set
const money2 = n => { const c = coSet(); if(!c.currency2 || !(+c.rate2)) return ""; const d = +c.decimals2 || 0; return c.currency2 + " " + ((+n||0) * +c.rate2).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); };

// icon for a page title, a KPI card or a button, picked from its text
const KPI_ICONS = [[/order|ticket/i,"receipt"],[/net|sales|revenue|payment/i,"dollar"],[/discount/i,"percent"],[/deliver/i,"truck"],[/decline|void|late|slow/i,"alert"],[/open|pending|incoming/i,"clock"],
  [/value|cost/i,"coins"],[/stock|item|count/i,"box"],[/below|out of/i,"alert"],[/customer|repeat|new/i,"users"],[/prep|accept|time/i,"clock"],[/branch/i,"store"]];
const BTN_ICONS = [[/^(create|new|add)\b/i,"plus"],[/^export/i,"download"],[/^print/i,"printer"],[/refresh/i,"refresh"],[/^(save|submit)/i,"check"],[/^delete|^remove all/i,"trash"],
  [/^send/i,"send"],[/^receive/i,"inbox"],[/^edit/i,"edit"],[/^reject|^decline|^cancel/i,"x"],[/^produce/i,"factory"],[/^create transfer/i,"swap"],[/^start inventory count/i,"sheet"]];
function decorate(route){
  const v = $("#view"); if(!v) return;
  // page title badge
  const h = v.querySelector(".phead h1, :scope > h1");
  if(h && !h.dataset.deco){ h.dataset.deco = 1; const ic = SUBI[route]; if(ic && !h.closest(".phead")?.querySelector("[data-docback],[data-detback]")){ const w = document.createElement("span"); w.className = "hico"; w.innerHTML = svgIco(ic);
    if(h.closest(".phead")) h.parentNode.insertBefore(w, h); else { const t = document.createElement("div"); t.className = "titlewrap"; t.style.marginBottom = "4px"; h.parentNode.insertBefore(t, h); t.appendChild(w); t.appendChild(h); } } }
  // buttons
  v.querySelectorAll(".btn").forEach(b => { if(b.dataset.deco || b.querySelector("svg")) return; b.dataset.deco = 1;
    const t = b.textContent.replace(/[↻←]/g,"").trim(); if(b.matches("[data-docback],[data-detback]")){ b.innerHTML = svgIco("back") + "Back"; return; }
    const m = BTN_ICONS.find(([re]) => re.test(t)); if(m){ if(/^↻/.test(b.textContent)) b.textContent = t; b.insertAdjacentHTML("afterbegin", svgIco(m[1])); } });
  // KPI cards
  v.querySelectorAll(".kpi .kh h3").forEach(h3 => { if(h3.dataset.deco) return; h3.dataset.deco = 1; const m = KPI_ICONS.find(([re]) => re.test(h3.textContent));
    h3.style.display = "flex"; h3.style.alignItems = "center"; h3.insertAdjacentHTML("afterbegin", `<span class="kicon">${svgIco(m ? m[1] : "chart")}</span>`); });
}
new MutationObserver(() => { clearTimeout(decorate.t); decorate.t = setTimeout(() => decorate(location.hash.slice(1) || "dashboard"), 0); }).observe(document.getElementById("view"), { childList:true, subtree:true });



function renderNav(route){
  if(route==="tax-groups") route = "taxes";
  $("#nav").innerHTML = NAV.map((n,gi) => {
    if(!canOpen(n.id || n.kids.find(k=>!k[0].startsWith("@"))?.[0])) return "";
    if(n.id) return `<a href="#${n.id}" class="${route===n.id?"on":""}">${svgIco(n.i)}${n.t}</a>`;
    if(n.tabs){ const first = n.kids.find(k=>!k[0].startsWith("@"))[0]; return `<a href="#${first}" class="${n.kids.some(k=>k[0]===route)?"on":""}">${svgIco(n.i)}${n.t}</a>`; }   // one entry; its screens are tabs on the page
    const open = n.kids.some(k => k[0]===route);
    return `<div class="grp ${open?"open":""}" data-g="${gi}"><button type="button">${svgIco(n.i)}${n.t}<span class="chev">›</span></button><div class="sub">${
      n.kids.map(k => k[0].startsWith("@") ? `<div class="lbl">${k[0].slice(1)}</div>` : `<a href="#${k[0]}" class="${route===k[0]?"on":""}">${svgIco(SUBI[k[0]]||"list")}${k[1]}</a>`).join("")
    }</div></div>`;
  }).join("");
}
$("#nav").addEventListener("click", e => {
  const b = e.target.closest(".grp > button"); if(!b) return;
  const g = b.parentElement, was = g.classList.contains("open");
  document.querySelectorAll(".nav .grp").forEach(x => x.classList.remove("open"));
  if(!was) g.classList.add("open");
});

/* ---------- branch store ---------- */
let branches = [];        // {id,name,code,address,city,phone,open,close,zones,active,callCenter,production,createdAt}
let db = null, col = null, storeMode = "loading";
const state = { range:"day", dashTab:"general", branch:"all", brand:(()=>{ try{ return localStorage.getItem("slickBrand")||"all"; }catch(e){ return "all"; } })(), compare:false, date:"", userName:"" };

function activeBranches(){ return branches.filter(b => b.active !== false && (state.brand==="all" || b.brandId===state.brand)); }
function brandList(){ return (typeof S!=="undefined" ? S.brands : []).filter(b => !b.deleted).sort((a,b)=>a.name.localeCompare(b.name)); }
function brandName(id){ return (typeof S!=="undefined" ? S.brands : []).find(b=>b.id===id)?.name || "—"; }
function defaultBrand(){ const l = brandList(); return state.brand!=="all" ? state.brand : (l.length===1 ? l[0].id : ""); }
function sortBranches(){ branches.sort((a,b) => (a.code||"").localeCompare(b.code||"", undefined, {numeric:true}) || a.name.localeCompare(b.name)); }
function nextCode(){
  let n = 0; branches.forEach(b => { const m = /^B(\d+)$/i.exec(b.code||""); if(m) n = Math.max(n, +m[1]); });
  return "B" + String(n+1).padStart(2,"0");
}
function setSync(text){ $("#syncPill").textContent = text; }

async function initStore(){
  const timer = null;
  try{
    if(!window.claude || !window.claude.use) { clearTimeout(timer); return fallback(); }
    db = await window.claude.use("db");
    if(!db){ clearTimeout(timer); return fallback(); }
    try{ const user = await window.claude.use("user"); if(user){ const n = await user.name?.(); if(n){ $("#who").textContent = n; $("#avatar").textContent = String(n).trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); state.userName = String(n).split(" ")[0]; } state.role = await user.role?.(); state.userId = await user.id?.(); state.email = await user.email?.() || ""; state.fullName = n || ""; paintAcct(); } }catch(e){}
    col = db.collection("branches");
    subscribeAll();
    col.onSnapshot(snap => {
      clearTimeout(timer);
      storeMode = "db";
      const list = [];
      (snap.docs || snap).forEach(d => { const v = typeof d.data === "function" ? d.data() : d; list.push({ ...v, id: d.id ?? v.id }); });
      branches = list; sortBranches();
      setSync("Saved · " + branches.length + " branch" + (branches.length===1?"":"es"));
      render();
    }, err => { clearTimeout(timer); console.error(err); fallback("Couldn't load saved branches"); });
  }catch(e){ clearTimeout(timer); console.error(e); fallback(); }
}
function fallback(msg){
  if(storeMode === "db") return;
  storeMode = "local";
  if(!branches.length) branches = ["Branch 1","Branch 2","Branch 3","Branch 4","Branch 5"].map((n,i)=>({id:"local"+i,name:n,code:"B0"+(i+1),active:true,callCenter:true,open:"11:00",close:"23:30",city:"",zones:""}));
  setSync(msg || "Preview mode · changes not saved");
  render();
}
async function saveBranch(data, id){
  if(storeMode === "db"){
    if(id) await col.doc(id).update(data);
    else { const nid = "br_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); await col.doc(nid).set({ ...data, createdAt: new Date().toISOString() }); }
  } else {
    if(id){ const b = branches.find(x => x.id===id); Object.assign(b, data); }
    else branches.push({ ...data, id:"local"+Date.now() });
    sortBranches(); render();
  }
}
async function deleteBranch(id){
  if(storeMode === "db") await col.doc(id).delete();
  else { branches = branches.filter(b => b.id!==id); render(); }
}

/* ---------- live dashboard data (summed in Supabase by slick_dashboard) ---------- */
/* business day: runs from the day's start to its end time (Company → Business day); orders after midnight but before
   the end time still belong to the day that started */
const dayCut = () => { const m = /^(\d{1,2}):(\d{2})/.exec((S.settings.find(x=>x.id==="company")||{}).dayEnd || ""); return m ? Math.min(719, (+m[1])*60 + (+m[2])) : 0; };
const dayStartH = () => Math.floor(dayCut()/60);
const bizDate = (t = new Date()) => { const d = new Date(+new Date(t) - dayCut()*60000); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const dayBounds = (from, to) => { const c = dayCut(), t0 = new Date(from+"T00:00:00"), t1 = new Date((to||from)+"T00:00:00"); t1.setDate(t1.getDate()+1); t0.setMinutes(c); t1.setMinutes(c); return [t0, t1]; };
const todayStr = () => bizDate();
window.SlickDay = { dayCut, dayStartH, bizDate, dayBounds };
const rangeDays = () => Math.max(1, state.days || 1);
const dashFrom = () => { const d = new Date(state.date+"T12:00:00"); d.setDate(d.getDate() - rangeDays() + 1); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const DASH = { key:"", cur:null, prev:null, loading:false, err:"", at:0, t:null };
function dashParams(offset){
  const n = rangeDays(), d = new Date((offset && state.cmpDate ? state.cmpDate : state.date)+"T12:00:00"); if(offset && !state.cmpDate) d.setDate(d.getDate() - offset*n);
  const act = activeBranches();
  return { p_day: d.toISOString().slice(0,10), p_days: n,
    p_branches: state.branch!=="all" ? [state.branch] : (act.length ? act.map(b=>b.id) : null),
    p_brand: state.brand==="all" ? null : state.brand, p_tz: coSet().timeZone || "Asia/Beirut", ...(dayCut() ? { p_cut: dayCut() } : {}) };
}
async function loadDash(force){
  if(!window.WOK || storeMode!=="db") return;
  const kind = dashKind(), cur = kind==="inventory" ? { p_branches: dashParams(0).p_branches } : dashParams(0);
  const fn = kind==="kitchen" ? "slick_kitchen" : kind==="inventory" ? "slick_inventory" : "slick_dashboard";
  const key = JSON.stringify([kind, cur, state.compare, state.cmpDate||""]);
  if(!force && key===DASH.key && (DASH.cur || DASH.loading || DASH.err)) return;
  if(key!==DASH.key){ DASH.cur = null; DASH.prev = null; }
  DASH.key = key; DASH.loading = true; DASH.err = "";
  try{
    const calls = [WOK.sb.rpc(fn, cur)];
    if(state.compare && kind!=="inventory") calls.push(WOK.sb.rpc(fn, dashParams(1)));
    const act = kind==="sales" ? [dashActive(dashParams(0))] : [];
    const res = await Promise.all(calls), rr = await Promise.all(act);
    if(DASH.key!==key) return;                       // filters changed meanwhile
    const bad = res.find(r => r.error); if(bad) throw bad.error;
    DASH.cur = res[0].data; DASH.prev = res[1]?.data || null; DASH.at = Date.now();
    [DASH.cur, DASH.prev].forEach(D => { if(D && D.refunds) D.returns = D.refunds; });
    if(DASH.cur && rr[0]) DASH.cur.active = rr[0];
  }catch(e){ console.error("dashboard", e); if(DASH.key===key) DASH.err = e.message || "Couldn't load the numbers"; }
  finally{ if(DASH.key===key){ DASH.loading = false; if((location.hash.slice(1)||"dashboard")==="dashboard") render(); } }
}
// returned (voided) orders in the period: count, amount and the tax inside them
// orders not closed yet (waiting for the branch or in the kitchen) in the period: how many and how much
async function dashActive(pr){
  const end = new Date(pr.p_day + "T12:00:00"), start = new Date(end); start.setDate(end.getDate() - (pr.p_days - 1));
  const [t0, t1] = dayBounds(start.toISOString().slice(0,10), pr.p_day);
  let q = WOK.sb.from("orders").select("total,status").in("status", ["pending","active"]).gte("created_at", t0.toISOString()).lt("created_at", t1.toISOString()).limit(5000);
  if(pr.p_branches) q = q.in("branch_id", pr.p_branches); if(pr.p_brand) q = q.eq("brand_id", pr.p_brand);
  const { data, error } = await q; if(error){ console.error("active", error); return null; }
  return { n: data.length, v: data.reduce((a,o)=>a+(+o.total||0),0), pending: data.filter(o=>o.status==="pending").length };
}
async function dashReturns(pr){
  const end = new Date(pr.p_day + "T12:00:00"), start = new Date(end); start.setDate(end.getDate() - (pr.p_days - 1));
  const [t0, t1] = dayBounds(start.toISOString().slice(0,10), pr.p_day);
  const base = () => { let q = WOK.sb.from("orders").select("total,tax,refund_total,status").gte("created_at", t0.toISOString()).lt("created_at", t1.toISOString()).limit(5000);
    if(pr.p_branches) q = q.in("branch_id", pr.p_branches); if(pr.p_brand) q = q.eq("brand_id", pr.p_brand); return q; };
  const [a, b] = await Promise.all([base().eq("status", "returned"), base().eq("status", "closed").gt("refund_total", 0)]);
  if(a.error || b.error){ console.error("returns", a.error || b.error); return { n:0, v:0, tax:0 }; }
  const full = a.data || [], part = b.data || [];
  return { n: full.length + part.length, v: full.reduce((s,o)=>s+(+o.total||0),0) + part.reduce((s,o)=>s+(+o.refund_total||0),0),
    tax: full.reduce((s,o)=>s+(+o.tax||0),0) + part.reduce((s,o)=>s+(+o.total ? (+o.tax||0)*(+o.refund_total||0)/(+o.total) : 0),0) };
}

/* ---------- charts ---------- */
const FMT = { n: v => Math.round(v).toLocaleString() + " orders", m: v => money(v) };
function lineChart(values, opt = {}){
  const W=opt.w||640, H=opt.h||230, L=opt.axis===false?8:44, R=12, T=12, B=30, max = Math.max(1,...values), n = values.length;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (H-T-B)*(1 - v/max);
  const pts = values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let g = "";
  if(opt.axis!==false){
    const ticks = [0, max/2, max];
    g += ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#ecebf0"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="${opt.fs||10}" fill="#8d8c98">${Math.round(t).toLocaleString()}</text>`).join("");
  } else g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#ecebf0"/>`;
  const step = opt.labelStep || 3;
  const lab = i => opt.labels ? opt.labels[i] : hourLbl((i + dayStartH()) % 24);
  g += values.map((v,i)=> i%step===0 ? `<text x="${x(i)}" y="${H-10}" text-anchor="${opt.labels&&i===n-1?"end":opt.labels&&i===0?"start":"middle"}" font-size="${opt.axis===false?16:(opt.fs||10)}" fill="#8d8c98">${esc(lab(i))}</text>` : "").join("");
  const dots = opt.dots ? values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${opt.axis===false?4:3}" fill="var(--chart)"/>`).join("") : "";
  const area = `${L},${y(0)} ${pts} ${W-R},${y(0)}`;
  return `<div class="chart" data-vals="${values.map(v=>+v.toFixed(2)).join(",")}" data-h="${H}" data-w="${W}" data-l="${L}" data-fmt="${opt.fmt||"n"}" ${opt.labels?`data-labels="${esc(opt.labels.join("|"))}"`:""}><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"Chart by hour")}">
    ${g}${opt.area===false?"":`<polygon points="${area}" fill="var(--chart-soft)" opacity=".6"/>`}<polyline points="${pts}" fill="none" stroke="var(--chart)" stroke-width="${opt.axis===false?3:2}" stroke-linejoin="round"/>${dots}
    <line class="xh" y1="${T}" y2="${y(0)}" stroke="#bdbbc8" stroke-dasharray="3 3" visibility="hidden"/><circle class="mk" r="${opt.axis===false?8:5}" fill="var(--chart)" stroke="#fff" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`;
}
function wireLine(el){
  const svg = el.querySelector("svg"), vals = el.dataset.vals.split(",").map(Number), tip = el.querySelector(".tip");
  const fmt = FMT[el.dataset.fmt] || FMT.n, labs = el.dataset.labels ? el.dataset.labels.split("|") : null;
  const W=+el.dataset.w||640, H=+el.dataset.h, L=+el.dataset.l, R=12, T=12, B=30, max=Math.max(1,...vals), n=vals.length;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (H-T-B)*(1 - v/max);
  const xh = svg.querySelector(".xh"), mk = svg.querySelector(".mk"), hit = svg.querySelector(".hit");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n-1, Math.round((sx-L)/((W-L-R)/(n-1)))));
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.setAttribute("visibility","visible");
    mk.setAttribute("cx",x(i)); mk.setAttribute("cy",y(vals[i])); mk.setAttribute("visibility","visible");
    tip.innerHTML = `${esc(labs ? labs[i] : hourLbl((i + dayStartH()) % 24))}<br><b>${fmt(vals[i])}</b>`;
    tip.style.left = (x(i)*r.width/W)+"px"; tip.style.top = (y(vals[i])*r.height/H)+"px"; tip.style.opacity = 1;
  });
  hit.addEventListener("mouseleave", () => { xh.setAttribute("visibility","hidden"); mk.setAttribute("visibility","hidden"); tip.style.opacity = 0; });
}
function barList(rows, fmt){ // horizontal bars, single measure
  fmt = fmt || money;
  if(!rows.length) return `<p class="note" style="margin:8px 0 0">No sales in this period yet.</p>`;
  const max = Math.max(1, ...rows.map(r=>r.v));
  return `<div style="display:flex;flex-direction:column;gap:12px">${rows.map(r => `
    <div title="${esc(r.name)}: ${esc(fmt(r.v))}">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px"><span>${esc(r.name)}${r.sub?` <span class="note">· ${esc(r.sub)}</span>`:""}</span><span style="font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap">${esc(fmt(r.v))}</span></div>
      <div style="height:8px;background:var(--bg);border-radius:4px"><div style="height:8px;width:${(r.v/max*100).toFixed(1)}%;background:var(--chart);border-radius:4px"></div></div>
    </div>`).join("")}</div>`;
}

const hourLbl = i => String(i%12||12).padStart(2,"0") + ":00 " + (i<12?"AM":"PM");
function filterBar(){
  return `<div class="row fbar"><button type="button" class="sel drpbtn" id="dashRange" aria-haspopup="dialog">${svgIco("calendar")}<span>${esc(drpLabel(dashFrom(), state.date))}</span></button>${scopeBar(true)}
    <label class="toggle"><input type="checkbox" id="cmpToggle" ${state.compare?"checked":""}><span class="trk"></span>Compare</label>
    ${state.compare ? `<label class="note">with <input type="date" class="sel" id="cmpDate" value="${state.cmpDate || cmpDefault()}" max="${todayStr()}" aria-label="Compare with business date" title="Business date to compare with${rangeDays()>1 ? " (the " + rangeDays() + " days ending on it)" : ""}"></label>` : ""}
    <span class="sp"></span><span class="note">${DASH.loading ? "Updating…" : DASH.at ? "Live · updated " + new Date(DASH.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : ""}</span>
    <button class="btn" id="dashRefresh" title="Refresh now">↻ Refresh</button></div>`;
}
// what the numbers are compared with: the previous period, or the business date picked
function cmpDefault(){ const d = new Date(state.date+"T12:00:00"); d.setDate(d.getDate() - rangeDays()); return d.toISOString().slice(0,10); }
function cmpLbl(){ if(!state.cmpDate) return rangeDays()===1 ? "previous day" : "previous " + rangeDays() + " days"; const f = new Date(state.cmpDate+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); return rangeDays()===1 ? f : `${rangeDays()} days to ${f}`; }
function delta(cur, prev){
  if(!state.compare) return "";
  if(!prev) return `<div class="d">No data for previous period</div>`;
  const pct = (cur-prev)/prev*100, up = pct>=0;
  return `<div class="d ${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(pct).toFixed(1)}% vs ${cmpLbl()}</div>`;
}
function kpiCard(title, value, series, fmt, cur, prev, labels){
  return `<div class="card kpi"><div class="kh"><h3>${title}</h3><a href="#dashboard" data-report="${esc(title)}" class="vr">View Report</a></div>
    <div class="v">${value}</div>${delta(cur, prev)}
    ${lineChart(series, {h:300, axis:false, area:false, dots:true, labelStep:3, fmt, label:title+" by hour", labels})}</div>`;
}
/* brand / branch filter shown inside the pages that need it */

}

document.addEventListener("change", e => { const t = e.target.closest("[data-scope]"); if(!t) return;
  if(t.dataset.scope==="brand"){ state.brand = t.value; state.branch = "all"; } else state.branch = t.value; render(); });
function viewDashboard(){
  const act = activeBranches();
  const list = state.branch==="all" ? act : act.filter(b=>b.id===state.branch);
  const tabs = [["general","General"],["branches","Branches"],["inventory","Inventory"],["call-center","Call Center"]];
  let h = `<h1>Welcome, ${esc(state.userName||"Admin")}</h1><p class="subt">${state.branch==="all" ? `All ${act.length} active branches` : esc(list[0]?.name||"")}</p>
    <div class="tabs">${tabs.map(([k,t])=>`<a href="#dashboard" data-dt="${k}" class="${state.dashTab===k?"on":""}">${t}${k==="kitchen"?' <span class="new">New!</span>':""}</a>`).join("")}</div>`;
  if(!act.length) return h + `<div class="card empty">No active branches yet.<br><br><a class="btn pri" href="#branches">Add your first branch</a></div>`;
  if(storeMode!=="db") return h + placeholder("Dashboard", "Sign in to see live sales.");
  loadDash();
  const D = DASH.cur, P = state.compare ? DASH.prev : null;
  h += state.dashTab==="inventory" ? `<div class="row fbar"><span class="note">Based on the latest inventory count of each item${state.branch==="all"?" across your branches":""}.</span><span class="sp"></span><span class="note">${DASH.loading ? "Updating…" : DASH.at ? "Updated " + new Date(DASH.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : ""}</span><a class="btn" href="#inventory-count" style="text-decoration:none">Start inventory count</a><button class="btn" id="dashRefresh">↻ Refresh</button></div>` : filterBar();
  if(DASH.err && !D) return h + `<div class="card empty">Couldn't load the dashboard: ${esc(DASH.err)}<br><br><button class="btn" id="dashRefresh">Try again</button></div>`;
  if(!D) return h + `<div class="card ph"><div>Loading live numbers…</div></div>`;
  const avg = x => x && x.orders ? x.net/x.orders : 0;
  const bname = id => branches.find(b=>b.id===id)?.name || "Unassigned";
  if(state.dashTab==="general"){
    const hN = hours24(D.hours,"n"), hNet = hours24(D.hours,"net"), hPay = hours24(D.hours,"pay"), hDisc = hours24(D.hours,"disc");
    h += `<div class="grid kpis">
      ${kpiCard("Orders", D.orders.toLocaleString(), hN, "n", D.orders, P?.orders)}
      ${kpiCard("Net Sales", money(+D.net), hNet, "m", +D.net, P&&+P.net)}
      ${kpiCard("Net Payments", money(+D.payments), hPay, "m", +D.payments, P&&+P.payments)}
      ${kpiCard("Discount Amount", money(+D.discount), hDisc, "m", +D.discount, P&&+P.discount)}
      ${kpiCard("Average Ticket", money(avg(D)), hN.map((o,i)=>o?hNet[i]/o:0), "m", avg(D), P&&avg(P))}
      <div class="card kpi"><div class="kh"><h3>Tax Amount</h3></div><div class="v">${money(+D.tax||0)}</div>${delta(+D.tax||0, P&&(+P.tax||0))}<div class="d">Included in sales (prices include tax)</div></div>
      <div class="card kpi"><div class="kh"><h3>Return Amount</h3></div><div class="v">${money(D.returns?.v||0)}</div><div class="d">${D.returns?.n||0} refund ticket${D.returns?.n===1?"":"s"}${D.returns?.tax ? ` · incl. tax ${money(D.returns.tax)}` : ""}</div>
        ${state.compare && P ? `<div class="d">${cap(cmpLbl())}: ${money(P.returns?.v||0)}</div>` : ""}</div>
      <div class="card kpi"><div class="kh"><h3>Active orders</h3></div><div class="v">${D.active ? D.active.n : D.open}</div><div class="d">${D.active ? money(D.active.v) + " not closed yet" : "Not closed yet"}${D.active?.pending ? ` · ${D.active.pending} waiting for the branch` : ""}</div><div class="d">Counted in sales once the branch closes them on its POS.</div></div>
      <div class="card kpi"><div class="kh"><h3>Declined orders</h3></div><div class="v">${D.declined.n}</div><div class="d">${money(+D.declined.v)} not sold</div>
        ${state.compare && P ? `<div class="d">${cap(cmpLbl())}: ${P.declined.n}</div>` : ""}</div>
    </div>`;
    if(rangeDays()>1){
      const n = rangeDays(), days = [], labels = [], end = new Date(state.date+"T12:00:00");
      for(let i=n-1;i>=0;i--){ const x = new Date(end); x.setDate(end.getDate()-i); const k = x.toISOString().slice(0,10); days.push(+(D.days.find(d=>d.d===k)?.net||0)); labels.push(x.toLocaleDateString("en-GB",{day:"numeric",month:"short"})); }
      h += `<div class="card" style="margin-bottom:16px"><div class="kh"><h3>Net sales by day</h3></div>${lineChart(days, {w:1400, h:260, fs:13, fmt:"m", dots:true, labelStep: n>7?5:1, labels, label:"Net sales by day"})}</div>`;
    }
    h += `<div class="grid two">
      <div class="card"><div class="kh"><h3>Top branches by net sales</h3><a href="#dashboard" data-dt2="branches" class="vr">View all</a></div><div style="height:12px"></div>${barList(D.branches.map(b=>({name:bname(b.id), v:+b.net, sub:b.n+" orders"})).sort((a,b)=>b.v-a.v))}</div>
      <div class="card"><div class="kh"><h3>Order types</h3></div><div style="height:12px"></div>${barList(D.types.map(t=>({name:TYPE_LBL[t.k]||cap(t.k), v:+t.net, sub:t.n+" orders"})).sort((a,b)=>b.v-a.v))}</div>
      <div class="card"><div class="kh"><h3>Sales channels</h3></div><div style="height:12px"></div>${barList(D.channels.map(t=>({name:CH_LBL[t.k]||cap(t.k), v:+t.net, sub:t.n+" orders"})).sort((a,b)=>b.v-a.v))}</div>
      <div class="card"><div class="kh"><h3>Payment methods</h3></div><div style="height:12px"></div>${barList(D.payMethods.map(t=>({name:PAY_LBL[t.k]||cap(t.k), v:+t.v, sub:t.n+" orders"})).sort((a,b)=>b.v-a.v))}</div>
      <div class="card" style="grid-column:1/-1"><div class="kh"><h3>Top products</h3></div><div style="height:12px"></div>${barList(D.products.map(p=>({name:p.name, v:+p.v, sub:(+p.qty).toLocaleString()+" sold"})))}</div>
    </div>`;
  } else if(state.dashTab==="branches"){
    const rows = list.map(b => { const p = D.branches.find(x=>x.id===b.id) || { n:0, net:0, disc:0 }; const q = P?.branches.find(x=>x.id===b.id); return { b, p, q }; }).sort((a,b)=>b.p.net-a.p.net);
    const tot = +D.net || 0;
    h += `<div class="card tbl"><table><thead><tr><th>Branch</th><th>Code</th><th class="num">Orders</th><th class="num">Net sales</th><th class="num">Share</th><th class="num">Avg. ticket</th><th class="num">Discounts</th>${state.compare?'<th class="num">vs previous</th>':""}</tr></thead><tbody>${
      rows.map(({b,p,q}) => `<tr><td>${esc(b.name)}</td><td class="code">${esc(b.code)}</td><td class="num">${p.n}</td><td class="num">${money(+p.net)}</td><td class="num">${tot?(p.net/tot*100).toFixed(1)+"%":"—"}</td><td class="num">${money(p.n?p.net/p.n:0)}</td><td class="num">${money(+p.disc)}</td>${state.compare?`<td class="num">${q&&+q.net?((p.net-q.net)/q.net*100).toFixed(1)+"%":"—"}</td>`:""}</tr>`).join("")
    }<tr style="font-weight:600"><td>Total</td><td></td><td class="num">${D.orders}</td><td class="num">${money(tot)}</td><td class="num">${tot?"100%":"—"}</td><td class="num">${money(avg(D))}</td><td class="num">${money(+D.discount)}</td>${state.compare?`<td class="num">${P&&+P.net?((D.net-P.net)/P.net*100).toFixed(1)+"%":"—"}</td>`:""}</tr></tbody></table></div>`;
  } else if(state.dashTab==="kitchen"){
    h += viewKitchenDash(D, P, bname);
  } else if(state.dashTab==="inventory"){
    h += viewInventoryDash(D, bname);
  } else if(state.dashTab==="call-center"){
    const cc = D.callcenter || {}, st = cc.byStatus || {}, ccOk = (cc.byAgent||[]).reduce((a,x)=>a+x.n,0), ccNet = (cc.byAgent||[]).reduce((a,x)=>a+(+x.net),0);
    h += `<div class="grid kpis">
      ${kpi("Call center orders", ccOk.toLocaleString())}${kpi("Net sales", money(ccNet))}${kpi("Average ticket", money(ccOk?ccNet/ccOk:0))}
      ${kpi("Waiting for branch", (st.pending||0).toLocaleString())}${kpi("Active (in kitchen)", (st.active||0).toLocaleString())}${kpi("Declined", (st.declined||0).toLocaleString())}
    </div><div class="grid two">
      <div class="card"><div class="kh"><h3>Orders by user</h3></div><div style="height:12px"></div>${barList((cc.byAgent||[]).map(a=>({name:a.k, v:a.n, sub:money(+a.net)})), v=>v+" orders")}</div>
      <div class="card"><div class="kh"><h3>Orders by branch</h3></div><div style="height:12px"></div>${barList((cc.byBranch||[]).map(b=>({name:bname(b.id), v:b.n, sub:money(+b.net)})).sort((a,b)=>b.v-a.v), v=>v+" orders")}</div>
    </div>`;
  }
  return h;
}
function prevLine(cur, prev, fmt, lowerIsBetter){
  if(!state.compare || prev==null) return "";
  if(cur==null || !+prev) return `<div class="d">${cap(cmpLbl())}: ${fmt(prev)}</div>`;
  const pct = (cur-prev)/prev*100, good = lowerIsBetter ? pct<=0 : pct>=0;
  return `<div class="d ${good?"up":"down"}">${pct>=0?"▲":"▼"} ${Math.abs(pct).toFixed(1)}% vs ${cmpLbl()}</div>`;
}
const kpiX = (t, v, sub, extra) => `<div class="card kpi"><div class="kh"><h3>${t}</h3></div><div class="v">${v}</div>${sub?`<div class="d">${sub}</div>`:""}${extra||""}</div>`;
function viewKitchenDash(K, P, bname){
  const q = K.queue || [], qp = q.reduce((a,x)=>a+x.pending,0), qa = q.reduce((a,x)=>a+x.active,0);
  const late = v => v!=null && v>5 ? ` style="color:var(--accent-ink);font-weight:600"` : "";
  let h = `<div class="card" style="margin-bottom:16px"><div class="kh"><h3>Live kitchen queue</h3><span class="note">Right now · web & call center orders</span></div>
    ${q.length ? `<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Branch</th><th class="num">Waiting to accept</th><th class="num">Oldest waiting</th><th class="num">In the kitchen</th><th class="num">Longest in kitchen</th></tr></thead><tbody>${
      q.sort((a,b)=>(b.pending+b.active)-(a.pending+a.active)).map(x=>`<tr><td>${esc(bname(x.id))}</td><td class="num">${x.pending}</td><td class="num"${late(x.oldest_pending)}>${x.oldest_pending!=null?x.oldest_pending+" min":"—"}</td><td class="num">${x.active}</td><td class="num"${x.oldest_active>30?late(99):""}>${x.oldest_active!=null?x.oldest_active+" min":"—"}</td></tr>`).join("")
    }</tbody></table></div>` : `<p class="note" style="margin:10px 0 0">No orders waiting. All caught up.</p>`}</div>`;
  h += `<div class="grid kpis">
    ${kpiX("Kitchen tickets", (+K.tickets).toLocaleString(), "All orders sent to the kitchen, including POS", prevLine(+K.tickets, P&&+P.tickets, v=>(+v).toLocaleString()))}
    ${kpiX("Web & call center orders", (+K.incoming).toLocaleString(), `${K.accepted} accepted · ${K.declined} declined`, prevLine(+K.incoming, P&&+P.incoming, v=>(+v).toLocaleString()))}
    ${kpiX("Avg. time to accept", mins(K.avgAccept), `${K.slowAccept} took more than 5 min`, prevLine(K.avgAccept, P?.avgAccept, mins, true))}
    ${kpiX("Avg. preparation time", mins(K.avgPrep), "From accepted to done", prevLine(K.avgPrep, P?.avgPrep, mins, true))}
    ${kpiX("Avg. order to done", mins(K.avgTotal), "From the order coming in to done", prevLine(K.avgTotal, P?.avgTotal, mins, true))}
    ${kpiX("Late orders", (+K.late).toLocaleString(), "Took more than 45 min from order to done", prevLine(+K.late, P&&+P.late, v=>(+v).toLocaleString(), true))}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="kh"><h3>Kitchen tickets by hour</h3></div>${lineChart(hours24(K.hours,"n"), {w:1400, h:260, fs:13, dots:true, label:"Kitchen tickets by hour"})}</div>
  <div class="card tbl"><table><thead><tr><th>Branch</th><th class="num">Web & call center</th><th class="num">Avg. to accept</th><th class="num">Avg. prep</th><th class="num">Late</th><th class="num">Declined</th></tr></thead><tbody>${
    (K.branches||[]).length ? K.branches.sort((a,b)=>b.n-a.n).map(b=>`<tr><td>${esc(bname(b.id))}</td><td class="num">${b.n}</td><td class="num">${mins(b.acc)}</td><td class="num">${mins(b.prep)}</td><td class="num">${b.late}</td><td class="num">${b.declined}</td></tr>`).join("")
    : `<tr><td colspan="6" class="note">No web or call center orders in this period.</td></tr>`
  }</tbody></table></div>
  <p class="note" style="margin-top:10px">Times are recorded when a branch taps Accept and Mark done on the POS (or the order is closed from Call Center). POS sales count as tickets but aren't timed. Orders from before this update have no times.</p>`;
  return h;
}
function viewInventoryDash(I, bname){
  const fmtD = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "Never";
  const hints = [];
  if(I.items && I.withCost < I.items) hints.push(`${I.items - I.withCost} of ${I.items} items have no cost, so their stock value shows as zero.`);
  if(I.items && !I.withMin) hints.push("No item has a minimum level yet. Set one to get low-stock alerts.");
  let h = hints.length ? `<div class="card" style="margin-bottom:16px;border-color:#f3d9a4;background:#fffaf0"><b>Finish setting up inventory</b><ul style="margin:6px 0 0 18px;padding:0">${hints.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><a href="#inv-items" class="vr" style="display:inline-block;margin-top:8px">Open Inventory → Items</a></div>` : "";
  h += `<div class="grid kpis">
    ${kpiX("Stock value", money(+I.value), "Latest counts × item cost")}
    ${kpiX("Items counted", `${I.counted} <span class="note" style="font-size:14px">of ${I.items}</span>`, I.counted ? "" : "No counts yet")}
    ${kpiX("Below minimum", (+I.belowMin).toLocaleString(), "Item × branch pairs under their minimum")}
    ${kpiX("Out of stock", (+I.outOfStock).toLocaleString(), "Counted at zero")}
  </div>
  <div class="card tbl" style="margin-bottom:16px"><table><thead><tr><th>Branch</th><th class="num">Stock value</th><th class="num">Items counted</th><th class="num">Below minimum</th><th>Last count</th><th></th></tr></thead><tbody>${
    (I.branches||[]).sort((a,b)=>b.value-a.value).map(b=>`<tr><td>${esc(bname(b.id))}</td><td class="num">${money(+b.value)}</td><td class="num">${b.counted}</td><td class="num">${b.below_min}</td><td>${fmtD(b.last_count)}</td><td><a href="#inventory-count" data-icbranch="${esc(b.id)}" class="vr">Count now</a></td></tr>`).join("")
  }</tbody></table></div>
  <div class="grid two">
    <div class="card"><div class="kh"><h3>Stock value by category</h3></div><div style="height:12px"></div>${barList((I.categories||[]).map(c=>({name:c.k, v:+c.value, sub:c.n+" items"})))}</div>
    <div class="card"><div class="kh"><h3>Low stock</h3><span class="note">Lowest first</span></div>${(I.low||[]).length ? `<div class="tbl" style="margin-top:8px"><table><thead><tr><th>Item</th><th>Branch</th><th class="num">On hand</th><th class="num">Min</th><th class="num">To reach par</th></tr></thead><tbody>${
      I.low.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(bname(x.branch_id))}</td><td class="num">${(+x.qty).toLocaleString()} ${esc(x.unit||"")}</td><td class="num">${(+x.min_level).toLocaleString()}</td><td class="num">${x.par_level ? Math.max(0, x.par_level - x.qty).toLocaleString() : "—"}</td></tr>`).join("")
    }</tbody></table></div>` : `<p class="note" style="margin:10px 0 0">${I.withMin ? "Nothing is below its minimum level." : "Low-stock alerts appear once items have minimum levels and have been counted."}</p>`}</div>
  </div>`;
  return h;
}
const kpi = (t,v) => `<div class="card kpi"><h3>${t}</h3><div class="v">${v}</div></div>`;
const placeholder = (t, s) => `<div class="card ph"><div><div class="big">${esc(t)}</div>${esc(s)}</div></div>`;

function viewBranches(){
  const list = branches.filter(b => state.brand==="all" || b.brandId===state.brand);
  const n = list.length, a = activeBranches().length;
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><h1>Branches</h1><p class="subt" style="margin:0">${n} total · ${a} active</p></div>
    <div class="row" style="gap:8px;margin:0">${scopeBar(false)}<button class="btn pri" id="addBranch">+ Add branch</button></div></div><div style="height:14px"></div>`;
  if(storeMode==="local") h += `<div class="banner">Preview mode: branches you add here won't be saved. Open this page from claude.ai while signed in to save them.</div>`;
  if(!n) return h + `<div class="card empty">No branches yet. Add your first branch to get started.</div>`;
  h += `<div class="card tbl"><table><thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Area</th><th>Today</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>${
    list.map(b => `<tr>
      <td class="code">${esc(b.code)}</td>
      <td><b style="font-weight:600">${esc(b.name)}</b>${b.production?` <span class="tag cc">Central kitchen</span>`:""}</td>
      <td>${esc(brandName(b.brandId))}</td>
      <td>${esc(b.city)||'<span class="note">—</span>'}</td>
      <td>${(() => { const d = b.settings?.hours?.[DAYS[(new Date().getDay()+6)%7][0]]; return d ? (d.closed ? '<span class="note">Closed today</span>' : `${esc(t12(d.open))} – ${esc(t12(d.close))}`) : `${esc(b.open||"")}${b.open||b.close?"–":""}${esc(b.close||"")}`; })()}</td>
      <td>${esc(b.phone)||'<span class="note">—</span>'}</td>
      <td><span class="tag ${b.active!==false?"on":"off"}"><span class="dot"></span>${b.active!==false?"Active":"Inactive"}</span>${b.callCenter?` <span class="tag cc">Call center</span>`:""}</td>
      <td class="num"><a class="btn sm" href="#branch-menu" data-brmenu="${esc(b.id)}" style="text-decoration:none">Menu</a> <button class="btn sm" data-edit="${esc(b.id)}">Edit</button></td></tr>`).join("")
  }</tbody></table></div>
  <p class="note" style="margin-top:12px">Inactive branches stay in your history but are hidden from dashboards, filters and call-center routing.</p>`;
  return h;
}

function render(){
  const route = (location.hash.slice(1) || "dashboard");
  renderNav(route); document.body.dataset.route = route;
  if(!state.dateSet) state.date = todayStr();   // follows the business day (end time comes from Company settings)
  // branch selector
  const bl = brandList();
  if(state.brand!=="all" && !bl.some(b=>b.id===state.brand)) state.brand = "all";
  $("#brandSel").innerHTML = `<option value="all">All brands (${bl.length})</option>` + bl.map(b=>`<option value="${esc(b.id)}" ${state.brand===b.id?"selected":""}>${esc(b.name)}</option>`).join("");
  $("#brandSel").style.display = "none"; $("#branchSel").style.display = "none";   // brand / branch filters live on the pages that use them
  const act = activeBranches();
  if(state.branch!=="all" && !act.some(b=>b.id===state.branch)) state.branch = "all";
  $("#branchSel").innerHTML = `<option value="all">All branches (${act.length})</option>` + act.map(b=>`<option value="${esc(b.id)}" ${state.branch===b.id?"selected":""}>${esc(b.name)}</option>`).join("");
  paintCompany();
  const v = $("#view");
  if(storeMode==="loading"){ v.innerHTML = `<div class="ph"><div>Loading…</div></div>`; return; }
  if(!canOpen(route)){ v.innerHTML = `<h1>${esc(TITLES[route]||"")}</h1>` + placeholder("No access", "Your role doesn't include this area. Ask the owner to change your role under Manage → Roles."); return; }
  if(route==="dashboard") v.innerHTML = viewDashboard();
  else if(route==="branches") v.innerHTML = viewBranches();
  else if(moduleRoute(route) !== null) v.innerHTML = moduleRoute(route);
  else v.innerHTML = `<h1>${esc(TITLES[route]||"Not found")}</h1><p class="subt">&nbsp;</p>` + placeholder("Coming next", "This screen is part of the plan and will be built in a later step.");
  const tg = NAV.find(n => n.tabs && n.kids.some(k=>k[0]===route));   // Inventory: every screen is a tab at the top of the page
  if(tg) v.insertAdjacentHTML("afterbegin", `<nav class="ptabs" aria-label="${esc(tg.t)}">${tg.kids.filter(k=>!k[0].startsWith("@")).map(k=>`<a href="#${k[0]}" class="${k[0]===route?"on":""}">${svgIco(SUBI[k[0]]||"list")}${esc(k[1])}</a>`).join("")}</nav>`);
  v.querySelectorAll(".chart").forEach(wireLine);
  if(route==="delivery-zones") setTimeout(initZonesOverview, 0);
}

/* ---------- events ---------- */
let lastRoute = location.hash.slice(1) || "dashboard";
// phone/tablet: slide-in menu
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); document.body.classList.toggle("navopen"); });
document.addEventListener("click", e => { if(document.body.classList.contains("navopen") && (!e.target.closest(".side") || e.target.closest(".side a"))) document.body.classList.remove("navopen"); });
window.addEventListener("hashchange", () => { const r = location.hash.slice(1) || "dashboard"; if(r !== lastRoute){ resetPageFilters(); lastRoute = r; document.querySelectorAll(".scrim.show").forEach(x => x.classList.remove("show")); } render(); window.scrollTo(0,0); });
$("#view").addEventListener("change", e => {
  if(e.target.id==="datePick" && e.target.value){ state.date = e.target.value; state.dateSet = state.date !== todayStr(); render(); }
  if(e.target.id==="cmpToggle"){ state.compare = e.target.checked; state.cmpDate = ""; render(); }
  if(e.target.id==="cmpDate"){ state.cmpDate = e.target.value && e.target.value!==cmpDefault() ? e.target.value : ""; render(); }
});
$("#branchSel").addEventListener("change", e => { state.branch = e.target.value; render(); });
$("#brandSel").addEventListener("change", e => { state.brand = e.target.value; state.branch = "all"; try{ localStorage.setItem("slickBrand", state.brand); }catch(err){} render(); });
$("#view").addEventListener("click", e => {
  if(e.target.closest("#dashRefresh")){ loadDash(true); render(); return; }
  const rp = e.target.closest("[data-report]"); if(rp){ e.preventDefault(); openReport(rp.dataset.report); return; }

async function put(col, id, data){
  const now = new Date().toISOString();
  if(storeMode === "db"){
    if(id && S[col].some(r => r.id===id)) await db.collection(col).doc(id).update({ ...data, updatedAt: now });
    else await db.collection(col).doc(id || uid(col.slice(0,3))).set({ ...data, createdAt: now, updatedAt: now });
  } else {

/* SKU generator: PR for products, MD for modifier options, IN for inventory items (PR-0001, PR-0002…) */
const SKU_PREFIX = { products:"PR", modifier_options:"MD", inv_items:"IN" };
function nextSku(col, taken){ const pre = SKU_PREFIX[col] || "SK", re = new RegExp("^" + pre + "-?(\\d+)$", "i"); let n = 0;
  S[col].forEach(r => { const m = re.exec(r.sku||""); if(m) n = Math.max(n, +m[1]); }); (taken||[]).forEach(v => { const m = re.exec(v); if(m) n = Math.max(n, +m[1]); });
  return pre + "-" + String(n+1).padStart(4,"0"); }
// give every item without a prefixed SKU (empty or the old sk-0001 style) a new one, in list order
async function generateSkus(key){
  const cfg = CRUD[key], col = cfg.col, pre = SKU_PREFIX[col], re = new RegExp("^" + pre + "-\\d+$", "i");
  const todo = S[col].filter(r => live(r) && !re.test(r.sku||"")).sort(cfg.sort);
  if(!todo.length) return toast(`Every ${cfg.one.toLowerCase()} already has a ${pre} SKU`);
  if(!confirm(`Give ${todo.length} ${cfg.title.toLowerCase()} new SKUs (${pre}-0001, ${pre}-0002…)? Items that already have a ${pre} SKU keep theirs.`)) return;
  const made = [];
  try{ for(const r of todo){ const sku = nextSku(col, made); made.push(sku); await put(col, r.id, { sku }); } toast(`${made.length} SKUs generated`); }

function csvParse(text){

    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; continue; }
    if(c === '"') q = true; else if(c === d){ row.push(f); f = ""; } else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; } else if(c !== "\r") f += c; }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift()||[]).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => String(v).trim())).map(r => { const o = {}; head.forEach((h, i) => o[h] = String(r[i] ?? "").trim()); return o; });

async function impexPreview(key, text){
  const X = IMPEX[key], rows = csvParse(text);
  const need = key==="modifiers" ? "modifier" : "name";
  if(!rows.length || !(need in rows[0]) && !(key==="modifiers" && "modifier name" in rows[0])){ impexDialog("Import", `<p class="err">This file has no "${key==="modifiers"?"Modifier":"Name"}" column, or no rows. Use the column names shown before, in the first line.</p>`); return; }
  const bad = [], nNew = [], nUpd = [];
  rows.forEach((x, i) => { if(!(x[need] || x["modifier name"])) return bad.push(`Line ${i+2}: ${need} is empty`);
    if(key!=="modifiers"){ const r = X.build(x, { skus:[] }); if(r.err) bad.push(`Line ${i+2} (${x.name}): ${r.err}`); else (r.id ? nUpd : nNew).push(1); } });
  const ok = rows.length - bad.length;
  impexDialog(`Import ${CRUD[key].title.toLowerCase()}`, `<p><b>${rows.length}</b> line${rows.length===1?"":"s"} in the file.${key!=="modifiers" ? ` <b>${nNew.length}</b> new, <b>${nUpd.length}</b> update${nUpd.length===1?"":"s"}.` : ""}</p>
    ${bad.length ? `<div class="banner" style="margin:8px 0">${bad.length} line${bad.length===1?"":"s"} will be skipped:<br>${bad.slice(0,12).map(esc).join("<br>")}${bad.length>12?`<br>…and ${bad.length-12} more`:""}</div>` : ""}<div class="note" id="impSt"></div>`, ok ? `Import ${ok} line${ok===1?"":"s"}` : "");
  if(!ok) return;
  $("#impGo").onclick = async () => {
    $("#impGo").disabled = true; const ctx = { skus:[], mods:{}, touched:{}, made:0 }; let done = 0, fail = 0;
    for(const [i, x] of rows.entries()){
      if(!(x[need] || x["modifier name"])) continue;
      try{ const r = await X.build(x, ctx); if(r.err){ fail++; continue; } if(r.skip){ done++; continue; } await put(r.col, r.id, r.data); done++; }
      catch(err){ console.error("import line", i+2, err); fail++; }
      if(done % 10 === 0) $("#impSt").textContent = `Importing… ${done} of ${ok}`;
    }
    $("#ccScrim").classList.remove("show"); toast(`Imported ${done} line${done===1?"":"s"}${fail ? ` · ${fail} skipped` : ""}`); render();
  };
}

function customerImport(){
  impexDialog("Import customers", `<p>Upload a CSV file with these columns. <b>Name</b> and <b>Phone</b> are required.</p>
    <p class="code">Name, Phone, Email, Birthday, Tags, Notes, Address</p>
    <p class="note">Customers are matched by phone number. Birthday as YYYY-MM-DD. Separate tags with ";". Customers belong to the company, so every brand and branch sees them.</p>`, "Choose file…");
  $("#impGo").onclick = () => impexPick(async text => {
    const rows = csvParse(text), bad = [], good = [], seen = new Set();
    rows.forEach((x, i) => { const ph = normPhone(x.phone || x.mobile || x["phone number"]);
      if(!(x.name||"").trim()) return bad.push(`Line ${i+2}: name is empty`); if(ph.length < 6) return bad.push(`Line ${i+2} (${x.name}): phone is missing or too short`);
      if(seen.has(ph)) return bad.push(`Line ${i+2} (${x.name}): same phone as an earlier line`); seen.add(ph);
      good.push({ name:x.name.trim(), phone:ph, email:x.email||null, birthday:/^\d{4}-\d{2}-\d{2}$/.test(x.birthday||"") ? x.birthday : null, tags:(x.tags||"").split(/[;|]/).map(t=>t.trim()).filter(Boolean), notes:x.notes||null, address:(x.address||"").trim() }); });
    impexDialog("Import customers", `<p><b>${good.length}</b> customer${good.length===1?"":"s"} ready to import.</p>${bad.length ? `<div class="banner" style="margin:8px 0">${bad.length} line${bad.length===1?"":"s"} will be skipped:<br>${bad.slice(0,12).map(esc).join("<br>")}${bad.length>12?`<br>…and ${bad.length-12} more`:""}</div>` : ""}<div class="note" id="impSt"></div>`, good.length ? `Import ${good.length}` : "");
    if(!good.length) return;
    $("#impGo").onclick = async () => {
      $("#impGo").disabled = true; let add = 0, upd = 0, fail = 0;
      for(let i = 0; i < good.length; i += 200){
        const part = good.slice(i, i+200), { data:have, error } = await WOK.sb.from("customers").select("id,phone,name,email,birthday,tags,notes,addresses").in("phone", part.map(c=>c.phone));
        if(error){ console.error(error); fail += part.length; continue; }
        for(const c of part){
          const h = (have||[]).find(r => r.phone===c.phone), addrs = c.address ? [{ address:c.address }] : [];
          try{
            if(!h){ const { error:e1 } = await WOK.sb.from("customers").insert({ name:c.name, phone:c.phone, email:c.email, birthday:c.birthday, tags:c.tags, notes:c.notes, addresses:addrs }); if(e1) throw e1; add++; }
            else { const row = { name:h.name || c.name, email:h.email || c.email, birthday:h.birthday || c.birthday, notes:h.notes || c.notes, tags:[...new Set([...(h.tags||[]), ...c.tags])], updated_at:new Date().toISOString() };
              if(c.address && !(h.addresses||[]).some(a => a.address===c.address)) row.addresses = [...(h.addresses||[]), ...addrs];
              const { error:e2 } = await WOK.sb.from("customers").update(row).eq("id", h.id); if(e2) throw e2; upd++; }
          }catch(err){ console.error("customer import", c.phone, err); fail++; }
        }
        $("#impSt").textContent = `Importing… ${Math.min(i+200, good.length)} of ${good.length}`;
      }
      $("#ccScrim").classList.remove("show"); toast(`${add} added · ${upd} updated${fail ? ` · ${fail} failed` : ""}`); loadCustomers(true);
    };
  });
}

async function submitCrud(e){
  e.preventDefault();
  if(crudEdit?.key==="devset") return saveDeviceSettings();
  if(crudEdit?.key==="addvar") return addVariant();
  if(!crudEdit || !CRUD[crudEdit.key]) return;
  const cfg = CRUD[crudEdit.key], data = {};
  for(const f of cfg.fields){
    const el = $("#cf_"+f.k);
    if(!el && f.t!=="polygon") continue;   // not shown on this form
    if(f.when && ($("#cf_"+f.when.k)?.value || "") !== f.when.is) continue;   // hidden: not asked, not changed
    if(f.t==="polygon"){ data[f.k] = zonePts.map(p=>[+p[0].toFixed(6), +p[1].toFixed(6)]); if(data[f.k].length < 3){ $("#cErr").textContent = "Draw the zone on the map (at least 3 points)."; return; } continue; }
    if(f.t==="chk") data[f.k] = el.checked;
    else if(f.t==="multi") data[f.k] = [...el.querySelectorAll("input:checked")].map(i=>i.value);
    else if(f.t==="items"){ const pending = ($("#cf_"+f.k+"_new")?.value || "").trim(); data[f.k] = [...el.querySelectorAll("[data-item]")].map(i => i.value.trim()).filter(Boolean); if(pending) data[f.k].push(pending); if(f.req && !data[f.k].length){ $("#cErr").textContent = f.l + " is required."; return; } continue; }
    else if(f.t==="number") data[f.k] = el.value==="" ? null : +el.value;
    else data[f.k] = el.value.trim();
    if(f.req && (data[f.k]===""||data[f.k]===null)){ $("#cErr").textContent = f.l + " is required."; el.focus(); return; }
    if(f.k==="factor" && !(data.factor > 0)){ $("#cErr").textContent = "The factor must be more than 0 (how many ingredient units are in one storage unit)."; el.focus(); return; }
  }
  if(cfg.prep){ const msg = await cfg.prep(data, crudEdit.id); if(msg){ $("#cErr").textContent = msg; return; } }
  if(cfg.fields.some(f=>f.k==="sku") && data.sku && S[cfg.col].some(r=>r.id!==crudEdit.id && live(r) && r.sku===data.sku)){ $("#cErr").textContent = "That SKU is already used."; return; }
  if(cfg.unique && S[cfg.col].some(r=>r.id!==crudEdit.id && live(r) && String(r[cfg.unique]||"").toLowerCase()===String(data[cfg.unique]||"").toLowerCase())){ $("#cErr").textContent = `That ${cfg.unique} is already used by another ${cfg.one.toLowerCase()}.`; return; }

  const newId = !crudEdit.id && data.id ? data.id : null; delete data.id;
  try{ await put(cfg.col, crudEdit.id || newId, data); if(cfg.after) await cfg.after(old, data); toast(cfg.one + " saved"); closeCrud(); }
  catch(err){ console.error(err); $("#cErr").textContent = "Couldn't save. You may not have edit access."; }
}
