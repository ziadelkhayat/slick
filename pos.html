<style>

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* activation */
.center{min-height:100%;display:grid;place-items:center;padding:24px}

.app{display:grid;grid-template-rows:56px 1fr;height:100vh}

.ocard .oc2{display:flex;flex-direction:column;font-size:14px}.ocard .oc2 small{color:#8d8c98;font-size:12.5px;padding-left:22px}.ocard .oc-s{font-size:12.5px}.ocard .oc-t{font-size:17px}
@media(max-width:900px){.oboard{grid-template-columns:1fr}}
.acts button{border:1px solid var(--line);background:var(--s);border-radius:12px;padding:14px 6px;font-weight:600}
.acts .pay{background:var(--acc);border-color:var(--acc);color:#fff;font-size:16px}
.acts button:disabled{opacity:.45}

.modal{background:var(--s);border-radius:16px;width:min(520px,100%);max-height:92vh;overflow:auto}

.modal{display:flex;flex-direction:column}.modal>.mh,.modal>.mf,.modal>.ohdr{flex:none}.modal>.mb{flex:1 1 auto;min-height:0;overflow:auto}
.modal.wide{width:min(860px,100%)}
.pdcols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}@media (max-width:760px){.pdcols{grid-template-columns:1fr}}
.pdside{display:flex;flex-direction:column;gap:10px}.pdside0{border:1px dashed var(--line,#e4e1ef);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:6px;color:#6b6880;font-size:14px;text-align:center;align-self:stretch;justify-content:center;min-height:240px}.pdside0 b{color:var(--ink,#1c1830);font-size:16px}.modal.full .pdcols{max-width:1400px;width:100%;margin:0 auto}
.custpg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start;max-width:1100px;width:100%;margin:0 auto}@media (max-width:820px){.custpg{grid-template-columns:1fr}}
.custcol{display:flex;flex-direction:column;gap:12px}.custpg .cpast{max-height:none}.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}.kv span{color:#6b6880}.kv b{text-align:right;font-weight:600}#modal:has(.pdform) .mf{position:sticky;bottom:0;background:var(--s);z-index:2}
.cins{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8f7fc;display:flex;flex-direction:column;gap:8px}.cins-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cins-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cins-g div{display:flex;flex-direction:column;font-size:12px;color:var(--mut,#6b6880);background:#fff;border-radius:10px;padding:7px 9px}.cins-g b{font-size:16px;color:inherit;color:#15131f}
.ctags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}.ctags .tag{background:#efeafe;color:#5b3fd6;border-radius:999px;padding:3px 9px;font-weight:600}.ctags .tag.bad{background:#fde8e8;color:#b42318}
.cmix{font-size:12.5px;color:#6b6880}
.cpast{display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:340px;overflow-y:auto}
.cdet{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}.cdl{display:flex;justify-content:space-between;gap:10px}.cdl span{display:flex;flex-direction:column}.cdl small{color:#6b6880;font-size:11.5px}.cdl.vd{text-decoration:line-through;color:#9a97ab}.cdl.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.acard{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;font-size:13px;color:inherit;min-height:56px}
.acard span{color:#6b6880;font-size:12px}.acard.on{border-color:#6a4cf5;background:#f3efff}.acard.new{border-style:dashed}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:18px;flex:1}
.x{border:0;background:none;font-size:24px;color:var(--mut)}
.mb{padding:18px 20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:11px 16px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.5}

.osk{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#e9e7f0;padding:8px 8px 10px;box-shadow:0 -6px 24px rgba(20,16,40,.18);transform:translateY(100%);transition:transform .15s;display:flex;flex-direction:column;gap:6px}
.osk.show{transform:none}.oskr{display:flex;gap:6px;justify-content:center}.osk button{flex:1;max-width:86px;height:54px;border:0;border-radius:10px;background:#fff;font:inherit;font-size:20px;font-weight:500;color:#1b1830;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.osk button.w{max-width:140px;font-size:16px;background:#d6d3e2}.osk button.sp{max-width:none;flex:4}.osk button.on{background:#6a4cf5;color:#fff}.osk button.done{background:#6a4cf5;color:#fff}.osk button:active{background:#efebff}
body.oskopen .scrim,body.oskopen .npsc{padding-bottom:260px!important;align-items:flex-start}
.npad{margin-top:12px}.npad span{display:block}.npw .npad{display:none}.npw:focus-within .npad{display:grid}

/* touch: no double-tap zoom delay, no text selection on taps, bigger targets */
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button,.btn,[role=tab]{user-select:none;-webkit-user-select:none}
.btn{min-height:48px;padding-left:18px;padding-right:18px}#modal input:not([type=checkbox]):not([type=radio]),#modal select,#modal textarea{min-height:48px;font-size:17px}

/* ===== Slick modern theme (POS) ===== */
:root{--bg:#f4f5fa;--line:#e8e8f0;--acc:#6c47ff;--accs:#f0ecff;--acci:#5130e8;--good:#12a150;--goods:#e3f7ec;--bad:#e5484d}
body{-webkit-font-smoothing:antialiased}
.logo{background:linear-gradient(135deg,#6c47ff,#a855f7);box-shadow:0 6px 18px rgba(108,71,255,.4)}
.panel{border-radius:22px;box-shadow:0 20px 60px rgba(21,19,31,.12)}
.big,.acts .pay,.btn.pri,.otype button.on{background:linear-gradient(135deg,#6c47ff,#5130e8);border-color:transparent;box-shadow:0 6px 16px rgba(108,71,255,.3)}
.top{background:#13111c;border-bottom:0;color:#fff}
.top b{color:#fff}

.cats{background:#fff;padding:10px}
.cat{border-radius:12px;padding:13px 12px;font-weight:600}
.cat.on{background:linear-gradient(135deg,#6c47ff,#5130e8);color:#fff;box-shadow:0 6px 14px rgba(108,71,255,.3)}
.menu{padding:16px}
.search{border-radius:999px;padding:12px 18px;box-shadow:0 1px 2px rgba(21,19,31,.05)}
.grid{gap:12px}
.prod{border-radius:16px;border-color:transparent;box-shadow:0 1px 2px rgba(21,19,31,.04),0 4px 14px rgba(21,19,31,.06);min-height:104px;position:relative;overflow:hidden}
.prod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#6c47ff,#a855f7);opacity:.8}
.prod span{font-weight:600}.prod b{font-size:15px}
.cart{border-left:0;box-shadow:-8px 0 30px rgba(21,19,31,.05)}
.otype button{border-radius:12px;font-weight:600}
.extra input,.f input,.f textarea,.tender{border-radius:12px}
.line{border-bottom-color:#f0eff5}
.qty button{border-radius:10px;background:#f4f3f9;border-color:transparent}
.totals .g{font-size:22px}
.acts button{border-radius:14px}
.modal{border-radius:22px;box-shadow:0 20px 60px rgba(21,19,31,.2)}
.scrim{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.x{width:36px;height:36px;border-radius:10px;background:#f3f2f8;font-size:20px}

.toast{border-radius:12px}

<script>
/* ---------- naming: menu "products" are called Items; inventory "items" are called Products ----------
   Done on what's shown, so data and links keep their names. On inventory screens both words swap
   (there "item" meant an inventory item and "product" a menu product); everywhere else Product → Item. */
const INV_ROUTES = new Set(["inv-categories","inv-items","warehouses","suppliers","purchase-orders","transfer-orders","transfers","inventory-count","production","quantity-adjustments","cost-adjustments","spot-check","count-sheets","inv-levels","inv-history","purchasing","order-transactions","inventory-reports"]);
const NM_SEEN = new WeakMap();
function nmCase(src, w){ if(src === src.toUpperCase()) return w.toUpperCase(); if(src[0] === src[0].toUpperCase()) return w[0].toUpperCase() + w.slice(1); return w; }
function nmText(t, inv){
  return t.replace(/\b(products?|items?)\b/gi, m => { const l = m.toLowerCase(), pl = l.endsWith("s");
    if(l.startsWith("product")) return nmCase(m, pl ? "items" : "item");
    return inv ? nmCase(m, pl ? "products" : "product") : m; });
}
function nmApply(root){
  const inv = false;
  const skip = el => !el || el.closest?.("#nav, script, style, textarea, [contenteditable], .nm-keep");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const fix = n => { if(skip(n.parentElement)) return; const was = NM_SEEN.get(n); if(was === n.data) return; const v = nmText(n.data, inv); if(v !== n.data) n.data = v; NM_SEEN.set(n, n.data); };
  if(root.nodeType === 3) fix(root); else { let n; while((n = w.nextNode())) fix(n);
    (root.querySelectorAll ? [root, ...root.querySelectorAll("[placeholder],[title],[aria-label]")] : []).forEach(el => { if(el.nodeType!==1 || skip(el)) return;
      ["placeholder","title","aria-label"].forEach(a => { const v = el.getAttribute?.(a); if(!v) return; const k = { placeholder:"nmPh", title:"nmTi", "aria-label":"nmAl" }[a]; if(el.dataset[k] === v) return; const nv = nmText(v, inv); if(nv !== v) el.setAttribute(a, nv); el.dataset[k] = nv; }); }); }
}
let NMQ = new Set(), NMT = 0;
new MutationObserver(ms => { ms.forEach(m => { if(m.type === "characterData") NMQ.add(m.target); else m.addedNodes.forEach(n => NMQ.add(n)); });
  if(!NMT) NMT = requestAnimationFrame(() => { NMT = 0; const q = [...NMQ]; NMQ = new Set(); q.forEach(n => { if(n.isConnected) nmApply(n); }); }); })
  .observe(document.documentElement, { childList:true, subtree:true, characterData:true });
window.addEventListener("hashchange", () => setTimeout(() => nmApply(document.body), 0));
document.addEventListener("DOMContentLoaded", () => nmApply(document.body));

/* ---------- Slick's own Yes / No message (instead of the browser's) ---------- */
function askDlg(o){
  return new Promise(res => {
    const w = document.createElement("div"); w.className = "slk-ask"; w.setAttribute("role", "dialog"); w.setAttribute("aria-modal", "true");
    const danger = o.input === undefined && /\b(delete|remove|void|decline|reject|deactivate|discard|clear|leave without|cancel this)\b/i.test(o.msg || "");
    const esc2 = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    w.innerHTML = `<div class="slk-ask-b"><p>${esc2(o.msg)}</p>${o.input !== undefined ? `<input class="slk-ask-i" value="${esc2(o.input)}" autocomplete="off">` : ""}
      <div class="slk-ask-f"><button type="button" class="slk-ask-no">${esc2(o.no)}</button><button type="button" class="slk-ask-yes${danger ? " red" : ""}">${esc2(o.yes)}</button></div></div>`;
    const prev = document.activeElement;
    const done = v => { document.removeEventListener("keydown", key, true); w.remove(); try{ prev?.focus?.(); }catch(e){} res(v); };
    const ok = () => done(o.input !== undefined ? w.querySelector(".slk-ask-i").value : true), no = () => done(o.input !== undefined ? null : false);
    const key = e => { if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); no(); } else if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); ok(); } };
    w.addEventListener("click", e => { if(e.target === w || e.target.closest(".slk-ask-no")) no(); else if(e.target.closest(".slk-ask-yes")) ok(); });
    document.addEventListener("keydown", key, true);
    document.body.appendChild(w);
    setTimeout(() => { const i = w.querySelector(".slk-ask-i"); if(i){ i.focus(); i.select(); } else w.querySelector(".slk-ask-yes").focus(); }, 0);
  });
}
function askYes(msg){ return askDlg({ msg, yes:"Yes", no:"No" }); }
window.SLICK_OFFLINE = true;</script>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// modifiers shown as a list under the product: one line per option ("2× Cheese"), then the item note
const modLines = (i, hideFree) => { if(Array.isArray(i.options) && i.options.length){ const t = []; i.options.forEach(x => { if(hideFree && !(+x.price)) return; const f = t.find(y => y.name===x.name); if(f) f.n++; else t.push({ name:x.name, n:1 }); }); return [...t.map(x => (x.n > 1 ? x.n + "× " : "") + x.name), ...(i.note ? ["Note: " + i.note] : [])]; }
  return String(i.mods||"").split(" · ").flatMap(p => p.startsWith("Note: ") ? [p] : p.split(", ")).map(x => x.trim()).filter(Boolean); };
const modList = i => { const l = modLines(i); return l.length ? `<ul class="mlist">${l.map(x => `<li${x.startsWith("Note: ") ? ' class="mn"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""; };
const coS = () => { try{ return S.settings.find(x=>x.id==="company") || {}; }catch(e){ return {}; } };
const DEC = () => { const d = coS().priceDecimals; return d===0||d==="0" ? 0 : +d || 2; };
const usd = n => (coS().currency || "USD") + " " + (+n||0).toLocaleString("en-US",{minimumFractionDigits:DEC(),maximumFractionDigits:DEC()});
const CUR2 = () => { const c = coS(); return c.currency2 && +c.rate2 ? { code: c.currency2, rate: +c.rate2, dec: +c.decimals2 || 0 } : null; };
const num2 = (n, d) => (+n||0).toLocaleString("en-US", { minimumFractionDigits: +d||0, maximumFractionDigits: +d||0 });
const ceilD = (n, d) => { const f = Math.pow(10, d); return Math.ceil(n * f - 1e-7) / f; };
const usd2 = n => { const c = coS(); if(!c.currency2 || !(+c.rate2)) return ""; const d = +c.decimals2 || 0; return c.currency2 + " " + ((+n||0) * +c.rate2).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); };
(() => { const P = Date.prototype, ls = P.toLocaleString, lt = P.toLocaleTimeString;   // 12-hour clock on screen and receipts
  P.toLocaleString = function(l, o){ return ls.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); };
  P.toLocaleTimeString = function(l, o){ return lt.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); }; })();
// delivery address parts, stored as one line: "[Home] Hamra, Bliss St · Bldg: … · Floor: … · Info: …"
const ADDR_K = ["label","street","building","floor","extra"];
const addrJoin = a => { const c = v => String(v||"").replace(/\s*·\s*/g, ", ").trim(); return [c(a.label) ? "[" + c(a.label).replace(/[\[\]]/g,"") + "]" : "", [c(a.street), c(a.building) && "Bldg: " + c(a.building), c(a.floor) && "Floor: " + c(a.floor), c(a.extra) && "Info: " + c(a.extra)].filter(Boolean).join(" · ")].filter(Boolean).join(" "); };
const show = id => ["boot","activate","app"].forEach(x => $("#"+x).classList.toggle("hide", x!==id));
// no example text inside fields that need filling (search boxes keep theirs)
const noHints = () => document.querySelectorAll("input[placeholder], textarea[placeholder]").forEach(el => { if(!el.matches("#ovQ, .search, [type=search]")) el.removeAttribute("placeholder"); });
let nhT = null; new MutationObserver(() => { if(!nhT) nhT = requestAnimationFrame(() => { nhT = null; noHints(); }); }).observe(document.documentElement, { childList:true, subtree:true });
let tt; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); };
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} } };

let db = null;
const S = { brands:[], devices:[], branches:[], categories:[], products:[], orders:[], shifts:[], modifiers:[], modifier_options:[], taxes:[], tax_groups:[], payment_methods:[], roles:[], users:[], settings:[], day_closes:[], charges:[], order_sources:[] };
let posChg = null, posOpen = {};   // posOpen: amounts the cashier entered for open-amount charges   // null = the charges that apply automatically; otherwise the ids the cashier kept
let GUESTS = 0, orderNote = "", kitchenNote = "", SEEN = new Set(), SEEN_READY = false;   // pending call-center / web orders already announced   // order-level note, printed on the receipt (not the kitchen ticket)
let EDIT = null;   // an order opened from the Orders list into the billing section: { id }
// "Force Sync Data" from the back office: reload this register's data as soon as it's idle (empty cart, no window open)
function syncCheck(){ const at = device?.settings?.syncAt; if(!at) return; const seen = store.get("wokSyncAt"); if(!seen){ store.set("wokSyncAt", at); return; } if(at===seen) return;
  if(cart.length || document.getElementById("scrim")?.classList.contains("show")){ clearTimeout(syncCheck.t); syncCheck.t = setTimeout(syncCheck, 15000); return; }
  store.set("wokSyncAt", at); location.reload(); }
/* order and customer tags (Manage → Tags) picked on this order; written when the order is saved or paid */
let posTags = null, posCustTags = null;
const tgDoc = () => S.settings.find(x => x.id==="tags") || {};
const tgList = type => (tgDoc().list||[]).filter(t => t.type===type && !t.deleted).sort((a,b) => (a.sort ?? 9999) - (b.sort ?? 9999) || a.name.localeCompare(b.name));
function openTags(){
  const ot = tgList("order"), ct = tgList("customer"), ph = String(cust.phone||"").replace(/\D/g,"");

  modal("tags", `<div class="mh"><h2>Tags</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">${box("Order Tags", ot, oSel, "data-tco")}
    ${ph.length >= 6 ? box("Customer Tags", ct, cSel, "data-tcc") : `<div class="mut" style="font-size:13px;margin-top:12px">Add the customer's phone to tag the customer.</div>`}</div>
    <div class="mf"><button class="btn pri" id="tagsApply">Apply</button></div>`);
  $("#tagsApply").onclick = () => { posTags = [...document.querySelectorAll("[data-tco]:checked")].map(i => i.dataset.tco); if(document.querySelector("[data-tcc]")) posCustTags = [...document.querySelectorAll("[data-tcc]:checked")].map(i => i.dataset.tcc); closeModal(); renderCart(); toast("Tags set"); };
}
async function posTagsCommit(oid){
  const ot = posTags, ct = posCustTags, ph = String(cust.phone||""); posTags = null; posCustTags = null;
  try{ if(ot && oid){ const d = tgDoc(), on = JSON.parse(JSON.stringify(d.on || {})), m = on.order ||= {}; if(ot.length) m[oid] = ot; else delete m[oid]; await db.collection("settings").doc("tags").update({ list: d.list || [], on }); } }catch(e){ console.warn("order tags", e); }
  try{ if(ct && ph.replace(/\D/g,"").length >= 6 && window.WOK?.sb){ const full = normPhone(ph), { data } = await window.WOK.sb.from("customers").select("id,tags").in("phone", phoneVariants(full)).limit(1); const c = data?.[0];
      if(c){ const names = tgList("customer").map(t => t.name.toLowerCase()), next = [...(c.tags||[]).filter(x => !names.includes(String(x).toLowerCase())), ...ct]; await window.WOK.sb.from("customers").update({ tags: next }).eq("id", c.id); } } }catch(e){ console.warn("customer tags", e); }
}
let DSET = null;   // a set discount (Marketing → Discounts) on this order; its amount follows the cart
let device = null, branch = null, cat = "", otype = "dinein", cart = [], discount = 0, discType = "pct", tableNo = "", cust = { name:"", phone:"", addr:{} };

/* ---------- boot ---------- */
(async function boot(){
  const timer = setTimeout(() => { const g = document.getElementById("wkGate"); if(!db && !(g && g.style.display!=="none")) $("#boot p").textContent = navigator.onLine ? "Still connecting… If this doesn't clear, close and reopen the app." : "No internet. Connect once to sign in; after that the register works offline."; }, 15000);
  try{ db = window.claude && await window.claude.use("db"); }catch(e){ db = null; }

  if(!db){ $("#boot p").textContent = "Sign in with your staff account to continue."; return; }

})();
let started = false;
function onData(c){
  if(c==="orders" && !window.__ordSnap){ window.__ordSnap = true; }
  if(c==="devices" && !started){ started = true; const id = store.get("wokDevice"); if(id && S.devices.some(d=>d.id===id && !d.deleted && d.activatedAt)) startApp(id); else { store.set("wokDevice", null); show("activate"); $("#code").focus(); } return; }
  if(!device) return;

  branch = S.branches.find(b => b.id===device.branchId) || branch;
  if(c==="settings") salesResetCheck();
  if(c==="orders") window.__ordLoaded = true;
  if(c==="orders" || c==="day_closes") setTimeout(autoDayEnd, 1500);
  if(c==="orders" && devSet().autoAccept) autoAccept();
  if(c==="users" || c==="roles"){ if(cashier){ cashier = S.users.find(u=>u.id===cashier.id && live(u) && u.active!==false) || null; } lockIfNeeded(); }
  renderAll();
}

/* ---------- offline & sync status ---------- */
let syncSt = { online:navigator.onLine, pending:0, failed:0 };
const ago = t => { if(!t) return "never"; const m = Math.round((Date.now()-new Date(t))/60000); return m<1?"just now":m<60?m+" min ago":new Date(t).toLocaleString("en-GB"); };
function paintSync(){
  const p = $("#syncPill"), s = syncSt; if(!p) return;
  p.className = "sync" + (s.failed||s.needsLogin ? " bad" : !s.online ? " off" : s.pending ? " off busy" : "");
  p.textContent = s.needsLogin ? "Sign in to sync" : !s.online ? (s.pending ? `Offline · ${s.pending} to sync` : "Offline") : s.pending ? `Syncing ${s.pending}…` : s.failed ? `${s.failed} not synced` : "Online";
}
window.addEventListener("slick-sync", e => { const was = syncSt; syncSt = e.detail; paintSync();
  if(was.pending && !syncSt.pending && syncSt.online) toast("All offline sales synced");
  if(was.online && !syncSt.online) toast("Offline · sales will be saved on this tablet and synced later"); });
false && $("#syncPill").addEventListener("click", () => {
  const s = syncSt, f = window.WOK.sync.failed();
  modal("sync", `<div class="mh"><h2>Connection & sync</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">
    <div class="stats"><div><span class="mut">Connection</span><b>${s.online?"Online":"Offline"}</b></div><div><span class="mut">Waiting to sync</span><b>${s.pending}</b></div></div>
    <p class="mut">Last synced: ${ago(s.lastSync)}. Sales, shifts and order updates made offline are kept on this tablet and sent automatically when the connection is back.</p>
    ${f.length ? `<p><b>${f.length} change(s) the server rejected</b></p>${f.map(o=>`<p class="mut">${esc(o.col)} · ${esc(o.data?.no ? "Order #"+o.data.no : o.id)} — ${esc(o.lastError||"")}</p>`).join("")}` : ""}</div>
    <div class="mf">${f.length?'<button class="btn" id="retryFailed">Retry rejected</button>':""}<button class="btn pri" id="syncNow">Sync now</button></div>`);
});
document.addEventListener("click", e => {
  if(e.target.id==="syncNow"){ window.WOK.sync.flush(); closeModal(); toast(navigator.onLine ? "Syncing…" : "Still offline · will sync when the connection is back"); }
  if(e.target.id==="retryFailed"){ window.WOK.sync.retryFailed(); closeModal(); toast("Retrying"); }
});

/* ---------- activation ---------- */
$("#code").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,""); $("#actBtn").disabled = e.target.value.length!==6; $("#actErr").textContent = ""; });
$("#actForm").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("#code").value, d = S.devices.find(x => x.code===code && !x.deleted);
  if(!navigator.onLine){ $("#actErr").textContent = "Connect to the internet to activate. After that the register works offline too."; return; }
  if(!d){ $("#actErr").textContent = "That code isn't valid. Check it in Manage → Devices."; return; }
  if(d.activatedAt){ $("#actErr").textContent = "This code was already used. Generate a new code in the back office."; return; }
  $("#actBtn").disabled = true;
  try{ await db.collection("devices").doc(d.id).update({ activatedAt:new Date().toISOString(), lastSeen:new Date().toISOString() }); store.set("wokDevice", d.id); startApp(d.id); toast("Device activated"); }
  catch(err){ console.error(err); $("#actErr").textContent = "Couldn't activate. You may not have access to this back office."; $("#actBtn").disabled = false; }
});
function startApp(id){
  device = S.devices.find(d => d.id===id); branch = S.branches.find(b => b.id===device.branchId);
  show("app"); renderAll(); lockIfNeeded(); if(devSet().autoAccept) autoAccept(); setTimeout(autoDayEnd, 4000);
  setInterval(() => db.collection("devices").doc(device.id).update({ lastSeen:new Date().toISOString() }).catch(()=>{}), 5*60*1000);
}

/* ---------- data helpers ---------- */
const live = r => !r.deleted;
// price at this branch: the order type's own price (Sales Channels → price per order type), else the POS price, else the item price
const prodPrice = p => { const cp = p.customPrices||{}, t = cp[device.branchId + ":pos:" + menuType()], c = t!=null && t!=="" ? t : cp[device.branchId]; return c!=null && c!=="" ? +c : +p.price||0; };
// switching order type re-prices the items not sent yet
function repriceCart(){ cart.forEach(i => { if(i.saved || i.manualPrice) return; const p = S.products.find(x => x.id===i.productId); if(!p || p.pricingMethod==="open") return;
  const opt = (i.options||[]).reduce((a, x) => a + (+x.price||0), 0), np = +(prodPrice(p) + opt).toFixed(2); if(np !== +i.price){ i.price = np; reDisc(i); } }); }
// variants are full products linked from their parent (parent.variants = [{ name, productId }]); the menu shows the parent, which asks for the variant
const kidIds = () => new Set(S.products.flatMap(p => (p.variants||[]).map(v => v.productId).filter(Boolean)));
const kidsOf = p => { const ok = products(); return (p.variants||[]).map(v => ({ name:v.name, p: ok.find(x => x.id===v.productId) })).filter(x => x.p); };
const tilePrice = p => { const k = kidsOf(p); return k.length ? Math.min(...k.map(x => prodPrice(x.p))) : prodPrice(p); };
const products = () => S.products.filter(p => live(p) && p.active!==false && !(p.inactiveBranchIds||[]).includes(device.branchId) && !(p.inactiveBranchIds||[]).includes(device.branchId + ":pos") && !(p.inactiveBranchIds||[]).includes(device.branchId + ":pos:" + menuType())); // which channels sell it is set per branch in Menus
const openShift = () => S.shifts.find(s => s.deviceId===device.id && !s.closedAt);
/* ---------- cashiers: PIN sign-in and what each role may do ---------- */
let cashier = null, pinBuf = "";
const posUsers = () => S.users.filter(u => live(u) && u.active!==false && u.pinHash && (isAdminUser(u) || !(u.branchIds||[]).length || u.branchIds.includes(device.branchId)));
const usePins = () => S.users.some(u => live(u) && u.pinHash);           // no PIN users yet = the register stays open, as before
// a user can have several roles (Foodics-style); a permission from any of them counts
// owners and admins (their PIN is set in the back office under My profile) may do everything, on any device
const isAdminUser = u => !!u && (u.role==="owner" || u.role==="admin");
const userPerms = u => { const ids = (u?.roleIds||[]).length ? u.roleIds : [u?.roleId]; return S.roles.filter(r => ids.includes(r.id) && !r.deleted).flatMap(r => r.permissions||[]); };
const can = perm => { if(!usePins()) return true; if(!cashier) return false; return isAdminUser(cashier) || userPerms(cashier).includes(perm); };
async function pinHash(id, pin){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("slick:" + id + ":" + pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function lockIfNeeded(){ if(usePins() && !cashier) lock(); paintCashier(); }
function lock(){ cashier = null; pinBuf = ""; paintPin(); $("#pinErr").textContent = ""; $("#lock").classList.remove("hide"); paintCashier(); }
function paintPin(){ document.querySelectorAll("#pinDots i").forEach((d,i) => d.classList.toggle("on", i < pinBuf.length)); }
function paintCashier(){ $("#lockBtn").classList.toggle("hide", !usePins()); $("#exitBtn")?.classList.toggle("hide", !usePins()); $("#cashierName").textContent = cashier ? cashier.name : ""; }
// login PINs are 5 digits (Foodics); older 4-digit PINs still work: at 4 digits a match signs in, otherwise the 5th digit is awaited
const pinUser = async (list, pin) => { for(const u of list){ if(await pinHash(u.id, pin) === u.pinHash) return u; } return null; };
async function tryPin(){
  const pin = pinBuf, u = await pinUser(posUsers(), pin);
  if(!u && pin.length < 5) return;
  pinBuf = ""; paintPin();
  if(!u){ $("#pinErr").textContent = "Wrong PIN. Try again."; return; }
  if(!isAdminUser(u) && !userPerms(u).includes("pos_access")){ $("#pinErr").textContent = "Your role doesn't allow using the POS."; return; }
  cashier = u; $("#lock").classList.add("hide"); paintCashier(); toast("Signed in as " + u.name);
}
$("#lock").addEventListener("click", e => { const b = e.target.closest("[data-pin]"); if(!b) return; const k = b.dataset.pin;
  if(k==="c") pinBuf = ""; else if(k==="b") pinBuf = pinBuf.slice(0,-1); else if(pinBuf.length < 5) pinBuf += k;
  $("#pinErr").textContent = ""; paintPin(); if(pinBuf.length>=4) tryPin(); });
document.addEventListener("keydown", e => { if($("#lock").classList.contains("hide")) return; if(/^\d$/.test(e.key) && pinBuf.length < 5){ pinBuf += e.key; paintPin(); if(pinBuf.length>=4) tryPin(); } else if(e.key==="Backspace"){ pinBuf = pinBuf.slice(0,-1); paintPin(); } });
let idleT; ["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => { clearTimeout(idleT); const mins = devSet().lockMinutes ?? appSet().logoutMinutes ?? 10; if(+mins > 0) idleT = setTimeout(() => { if(usePins() && cashier) lock(); }, mins*60*1000); }));
const deny = what => { toast(`${cashier ? cashier.name + ", your" : "Your"} role doesn't allow ${what}.`); return true; };
/* ---------- order numbers: each tablet counts 1, 2, 3… and starts again every business day ---------- */
// the business day starts at this branch's own time (Manage → Branches); the old company-wide setting is the fallback
const dayCut = () => { const b = (typeof branch!=="undefined" && branch) || null, v = b?.settings?.dayStart || (S.settings.find(x=>x.id==="company")||{}).dayEnd || "";
  const m = /^(\d{1,2}):(\d{2})/.exec(v); return m ? Math.min(719, (+m[1])*60 + (+m[2])) : 0; };
const nextDay = d => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + 1); return x.toISOString().slice(0,10); };
// ending the day early (before the start time) starts the next business day right then
const bizDate = (t = new Date()) => { const ms = +new Date(t), d0 = new Date(ms - dayCut()*60000); let d = new Date(d0 - d0.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const bid = (typeof device!=="undefined" && device?.branchId) || null;
  if(bid && S.day_closes.length) for(let i = 0; i < 3; i++){ const c = S.day_closes.find(c => c.branchId===bid && String(c.businessDate).slice(0,10)===d); if(c && +new Date(c.closedAt) <= ms) d = nextDay(d); else break; }
  return d; };
// call number: one sequence per branch (all registers), starting again at 1 after each end of day; the server fixes any clash
function nextOrderNo(){
  const since = S.day_closes.filter(c => c.branchId===device.branchId).reduce((m,c) => Math.max(m, +new Date(c.closedAt) || 0), 0);
  const key = "slickNo_" + device.branchId; let c = {}; try{ c = JSON.parse(store.get(key) || "{}"); }catch(e){}
  let n = c.since===since ? +c.n||0 : 0;
  // the latest order of the day (not the highest number), so the sequence carries on after it wraps at Call Number Reset
  let last = null; S.orders.forEach(o => { if(o.branchId===device.branchId && o.no && o.status!=="refund" && +new Date(o.createdAt) > since && (!last || +new Date(o.createdAt) > +new Date(last.createdAt))) last = o; });
  if(last && (!c.at || +new Date(last.createdAt) > c.at)) n = parseInt(String(last.no).replace(/\D/g,""),10)||0;
  // Device Settings: Call Number Start / Call Number Reset
  const st = Math.max(1, +devSet().callStart || 1), rs = +devSet().callReset || 0;
  n = n < st - 1 ? st - 1 : n; n++; if(rs && n > rs) n = st;
  store.set(key, JSON.stringify({ since, n, at: Date.now() })); return String(n);
}

function whistle(){

    const t0 = AUD.currentTime + 0.05, g = AUD.createGain(); g.connect(AUD.destination); g.gain.setValueAtTime(0.0001, t0);
    const note = (start, dur, f) => { const o = AUD.createOscillator(); o.type = "sine"; o.connect(g); o.frequency.setValueAtTime(f[0], start);
      f.slice(1).forEach((x, i) => o.frequency.exponentialRampToValueAtTime(x, start + dur * (i + 1) / (f.length - 1)));
      g.gain.exponentialRampToValueAtTime(0.35, start + 0.04); g.gain.setValueAtTime(0.35, start + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, start + dur); o.start(start); o.stop(start + dur + 0.02); };

/* ---------- approval with a manager's PIN ---------- */
function approve(perm, title){
  if(!usePins()) return Promise.resolve({ name: cashier?.name || device.name });
  if(isAdminUser(cashier)) return Promise.resolve({ name: cashier.name, id: cashier.id });   // owners and admins never need a second PIN
  return new Promise(resolve => {
    let buf = ""; const el = document.createElement("div"); el.className = "apv";
    const draw = err => { el.innerHTML = `<div class="apvbox"><h2>${esc(title)}</h2><p class="mut">A manager whose role allows this, or an admin, types their PIN.</p><div class="pindots">${[0,1,2,3,4].map(i=>`<i class="${i<buf.length?"on":""}"></i>`).join("")}</div>
      <div class="err" style="min-height:20px;color:#b42318">${esc(err||"")}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-ap="${n}">${n}</button>`).join("")}<button data-ap="c">C</button><button data-ap="0">0</button><button data-ap="b">⌫</button></div>
      <button class="btn" data-apx style="margin-top:12px;width:100%">Cancel</button></div>`; };
    const done = v => { el.remove(); document.removeEventListener("keydown", key, true); resolve(v); };
    const check = async () => { const pin = buf, u = await pinUser(S.users.filter(u => !u.deleted && u.active!==false && u.pinHash), pin);
      if(!u && pin.length < 5) return;
      buf = "";
      if(!u) return draw("Wrong PIN. Try again.");
      if(isAdminUser(u) || userPerms(u).includes(perm)) return done(u);
      return draw(`${u.name}'s role can't approve this.`); };
    const press = k => { if(k==="c") buf = ""; else if(k==="b") buf = buf.slice(0,-1); else if(buf.length < 5) buf += k; draw(); if(buf.length>=4) check(); };
    const key = e => { if(/^\d$/.test(e.key)){ e.stopPropagation(); press(e.key); } else if(e.key==="Backspace"){ e.stopPropagation(); press("b"); } else if(e.key==="Escape") done(null); };
    el.addEventListener("click", e => { const b = e.target.closest("[data-ap]"); if(b) return press(b.dataset.ap); if(e.target.closest("[data-apx]") || e.target===el) done(null); });
    document.addEventListener("keydown", key, true); draw(); document.body.appendChild(el);
  });
}

  if(!navigator.onLine){ $("#vrErr").textContent = "Voids and returns need the internet connection."; return; }
  const ok = await approve(kind==="void" ? "pos_void" : "pos_return", kind==="void" ? "Approve void" : "Approve return"); if(!ok) return;
  const now = new Date().toISOString(), by = cashier?.name || device.name, patch = { updatedAt: now, approvedBy: ok.name, stockAction: stock };
  const full = mode!=="items" || (o.items||[]).every((i,ix) => (qs[ix]||0) >= (kind==="return" ? retLeft(o, ix) : +i.qty));
  let ticket = null;
  if(kind==="void"){
    if(full) Object.assign(patch, { status:"void", voidReason: reason, voidedAt: now, voidedBy: by });
    else {
      const items = (o.items||[]).map((i,ix) => { const left = +i.qty - (qs[ix]||0); if(left <= 0) return null; const k = { ...i, qty:left }; if(+i.disc) k.disc = +(i.disc * left / i.qty).toFixed(2); return k; }).filter(Boolean);
      const sub = items.reduce((s,i)=>s+lineNet(i),0), d = o.discountType==="amt" ? Math.min(+o.discount||0, sub) : +(sub * (+o.discountPct||0) / 100).toFixed(2);   // a % discount stays a %
      const charges = (o.charges||[]).map(c => ({ ...c, amount: +(c.type==="percent" ? (sub-d)*(+c.value||0)/100 : +c.amount||0).toFixed(2) }));
      const tp = orderTaxParts(items, d), tax = tp.tax, total = +(sub - d + charges.reduce((s,c)=>s+c.amount,0) + tp.added).toFixed(2);
      Object.assign(patch, { items, subtotal: +sub.toFixed(2), discount: d, discountPct: o.discountType==="amt" ? (sub ? +(d/sub*100).toFixed(2) : 0) : (+o.discountPct||0), tax, charges, chargesTotal: +charges.reduce((s,c)=>s+c.amount,0).toFixed(2), total,
        voidedItems: [...(o.voidedItems||[]), ...chosen.map(c => ({ ...c, reason, stock, voidedAt: now, voidedBy: by, approvedBy: ok.name }))] });
    }
  } else {

    const ret = chosen.map((c,k) => { const orig = o.items[idx[k]] || c, unit = lineNet(orig) / (+orig.qty||1);
      return { ...c, ix: idx[k], refund: +(unit * c.qty * share).toFixed(2), reason, stock, returnedAt: now, returnedBy: by, approvedBy: ok.name }; });
    const left = +((+o.total||0) - (+o.refundTotal||0)).toFixed(2), allBack = (o.items||[]).every((i,ix) => retLeft(o, ix) - (ret.find(r=>r.ix===ix)?.qty||0) <= 0);
    const refund = allBack ? left : Math.min(left, +ret.reduce((s,r)=>s+r.refund,0).toFixed(2));
    const rgross = ret.reduce((s,r)=>s+lineNet(r),0), rdisc = +(rgross * (1 - dshare)).toFixed(2);
    Object.assign(patch, { returnedItems: [...(o.returnedItems||[]), ...ret], refundTotal: +((+o.refundTotal||0) + refund).toFixed(2) });
    delete patch.stockAction; delete patch.approvedBy;
    ticket = { channel:o.channel, source:o.source, type:o.type, status:"refund", refundOf:o.id, brandId:o.brandId || branch?.brandId || null, branchId:device.branchId, deviceId:device.id, shiftId:openShift()?.id || null,
      agent: by, customerName:o.customerName || "", phone:o.phone || "", items: ret.map(({ ix, refund, returnedAt, returnedBy, approvedBy, reason, stock, ...it }) => it),
      subtotal: -(+rgross.toFixed(2)), discount: -rdisc, total: -refund, tax: -(+((+o.tax||0) * (o.total ? refund / o.total : 0)).toFixed(2)),
      payment: { method: o.payment?.method || "Cash", type: o.payment?.type || "cash", methodId: o.payment?.methodId || null, tendered: -refund, change: 0 },
      returnReason: reason, stockAction: stock, approvedBy: ok.name, returnedBy: by, invoiceRef: o.invoiceNo || null, createdAt: now, updatedAt: now };
  }
  try{
    if(ticket){ const rid = "ref_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); await db.collection("orders").doc(rid).set(ticket); ticket.id = rid; }
    await db.collection("orders").doc(o.id).update(patch);
    // stock: a void before the sale used the food → waste takes it out; a return → back to stock puts it back
    const mv = kind==="void" ? (stock==="waste" ? "waste" : null) : (stock==="stock" ? "restock" : null);
    if(mv && window.WOK?.sb){ try{ const r = await window.WOK.sb.rpc("slick_stock_items", { p_order:o.id, p_items:chosen.map(({ ix, ...it }) => it), p_mode:mv }); if(r.error) throw r.error; }
      catch(err){ console.error("stock", err); toast("Saved, but the stock couldn't be updated. Adjust it under Inventory → Quantity Adjustment."); } }
    toast(`${kind==="void"?"Voided":"Refund ticket created · "+usd(-ticket.total)} · approved by ${ok.name}`);
    if(EDIT && EDIT.id===o.id && kind==="void"){ const keep = window.__keep; window.__keep = null; setTimeout(() => { const n = S.orders.find(x=>x.id===o.id); if(n && isOpenOrd(n)) loadOrder(o.id, keep); else { closeModal(); unloadOrder(); } }, 400); }
    else if(EDIT && EDIT.id===o.id){ setTimeout(() => { closeModal(); loadOrder(o.id); }, 400); }
    else closeModal();
  }catch(err){ console.error(err); $("#vrErr") && ($("#vrErr").textContent = "Couldn't save. Check the connection and try again."); }
}

  const L = [ (branch?.name||"").padStart((w+(branch?.name||"").length)/2), ("REPORT · " + RP_L[RP].toUpperCase()).slice(0,w), device.name, new Date().toLocaleString("en-GB"), "-".repeat(w),
    row("Orders", d.sales.length), row("Gross sales", m(d.gross)), row("Returns", d.ref ? "-" + m(d.ref) : m(0)), row("Net sales", m(d.net)), row("Tax", m(d.tax)), row("Discounts", m(d.disc)), row("Charges", m(d.chg)),
    row("Voided orders " + d.voids.length, m(d.voidTotal)), row("Voided items " + d.voidItemsN, m(d.voidItemsTotal)), "-".repeat(w), "PAYMENTS", ...d.pay.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))),
    "-".repeat(w), "ORDER TYPES", ...d.types.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))), "-".repeat(w), "CHANNELS", ...d.chans.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))), "-".repeat(w), "CATEGORIES", ...d.catRows.map(([k,c]) => row(k + " x" + c.n, m(c.v))), "-".repeat(w), "TOP PRODUCTS", ...d.prodRows.slice(0, 15).map(([k,c]) => row(k + " x" + c.n, m(c.v))), "-".repeat(w), "STAFF", ...d.staff.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))), "-".repeat(w) ];
  return L.join("\n");
}

/* ---------- devices & diagnostics ---------- */
const devOnline = d => d.id===device.id || (d.lastSeen && Date.now() - new Date(d.lastSeen) < 11*60000);
function openDevices(){
  const l = (S.devices||[]).filter(d => !d.deleted && d.branchId===device.branchId).sort((a,b) => (b.id===device.id) - (a.id===device.id) || String(a.name).localeCompare(String(b.name)));
  const hasM = l.some(d => d.settings?.master), role = d => d.type && d.type!=="cashier" ? ({ kds:"Kitchen display", waiter:"Waiter", kiosk:"Kiosk", notifier:"Notifier", display:"Display", sub_cashier:"Sub cashier" }[d.type] || d.type) : hasM ? (d.settings?.master ? "Master POS" : "Sub-POS") : "POS";
  modal("devices", `<div class="mh"><h2>Devices · ${esc(branch?.name||"")}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><div class="dvl">${l.map(d => `<div class="dvc"><span class="dot${devOnline(d)?" on":""}"></span><div class="sp"><b>${esc(d.name)}</b>${d.id===device.id ? ` <span class="pill">This device</span>` : ""}<div class="mut">${esc(role(d))} · ${d.activatedAt ? (devOnline(d) ? "Online" : "Last seen " + ago(d.lastSeen)) : "Not activated yet"}</div></div>${d.settings?.master ? `<span class="spill s-active">Master</span>` : ""}</div>`).join("") || `<p class="mut">No devices.</p>`}</div>
    <p class="mut" style="margin-top:12px">${hasM ? "Only the master POS accepts call-center and web orders and ends the day." : "No master POS set: every POS can accept orders and end the day. Pick one in Manage → Devices → Settings."} Add or change devices in the back office.</p></div>
    <div class="mf"><button class="btn pri" data-close>Done</button></div>`);
}
async function openDiag(){
  const s = syncSt, f = window.WOK?.sync?.failed?.() || [], est = await (navigator.storage?.estimate?.() || Promise.resolve(null)).catch(() => null), today = bizDate();
  const sw = "serviceWorker" in navigator ? (navigator.serviceWorker.controller ? "Active" : "Not active") : "Not supported";
  const rows = [["Connection", s.online ? "Online" : "Offline"], ["Waiting to sync", s.pending], ["Rejected by the server", f.length], ["Last synced", ago(s.lastSync)], ["Signed in", s.needsLogin ? "No · sign in to sync" : "Yes"],
    ["Device", device.name + (isMaster() ? "" : " (sub-POS)")], ["Branch", branch?.name || "—"], ["Business date", today + (openDay() < today ? ` · ${openDay()} not ended` : "")], ["Shift", openShift() ? "Open" : "Closed"],
    ["Menu loaded", `${products().length} products · ${S.categories.filter(live).length} categories`], ["Orders on this tablet", S.orders.filter(o => o.branchId===device.branchId).length], ["Users with a PIN", posUsers().length],
    ["Offline app", sw], ["Storage", est ? `${(est.usage/1048576).toFixed(1)} MB used of ${(est.quota/1048576/1024).toFixed(1)} GB` : "—"], ["Screen", `${innerWidth} × ${innerHeight}`], ["Clock", new Date().toLocaleString("en-GB") + " · " + (Intl.DateTimeFormat().resolvedOptions().timeZone || "")],
    ["Printing", window.Capacitor ? "Android app" : "Browser · printing works in the Android app"], ["App", "Slick POS · " + (document.querySelector('script[src^="wokdb.js"]')?.getAttribute("src").split("?v=")[1] ? "data v" + document.querySelector('script[src^="wokdb.js"]').getAttribute("src").split("?v=")[1] : "")]];
  modal("diag", `<div class="mh"><h2>Diagnostics</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><div class="rsec" style="box-shadow:none;padding:0"><table>${rows.map(([k,v]) => `<tr><td class="c">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>
    ${f.length ? `<p style="margin-top:12px"><b>Rejected changes</b></p>${f.map(o=>`<p class="mut">${esc(o.col)} · ${esc(o.data?.no ? "Order #"+o.data.no : o.id)} — ${esc(o.lastError||"")}</p>`).join("")}` : ""}</div>
    <div class="mf">${f.length?'<button class="btn" id="retryFailed">Retry rejected</button>':""}<button class="btn" id="diagReload" style="margin-right:auto">Reload app</button><button class="btn pri" id="syncNow">Sync now</button></div>`);
}
})();
