function pickTable(k, guests){
  const l = tableOrders(k);
  if(l.length === 1) return loadOrder(l[0].id);
  if(l.length > 1){ OV.q = ""; return modal("tables", `<div class="mh"><h2>Table ${esc(k)} · ${l.length} open orders</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><div class="olist2">${l.map(o => `<button class="lrow" data-ov="${esc(o.id)}" style="grid-template-columns:90px 1fr 120px"><span class="lno">${esc(o.no||"—")}</span><span class="lc"><b>${esc(o.agent||"")}</b><span>${new Date(o.createdAt).toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit"})}</span></span><span class="lr"><b class="lst-${o.status}">${stLbl(o)}</b><span>${usd(o.total)}</span></span></button>`).join("")}</div></div>`); }
  if(!allowedTypes().includes("dinein")) return toast("Dine-in isn't enabled on this register");
  if(EDIT || !cart.length){ const keepNote = EDIT ? "" : orderNote; resetOrder(); orderNote = keepNote; }   // items already in a new order stay, and move to this table
  if(otype==="takeaway" || otype==="delivery") cust = { name:"", phone:"", addr:{} };
  posChg = null; otype = "dinein"; if(guests) GUESTS = +guests; tableNo = String(k); closeModal(); renderCart(); renderMenu(); toast(`${tblLbl(k)}${GUESTS ? " · " + GUESTS + " guests" : ""} · new dine-in order`);
}

/* ---------- POS reports (this shift / today on this register / today for the branch) ---------- */
let RP = "shift";
function reportData(){
  const today = bizDate(), sh = openShift() || [...S.shifts].filter(x => x.deviceId===device.id).sort((a,b) => String(b.openedAt).localeCompare(String(a.openedAt)))[0];
  const inScope = o => o.branchId===device.branchId && (RP==="shift" ? sh && o.shiftId===sh.id : bizDate(o.createdAt)===today && (RP==="branch" || o.deviceId===device.id));
  const all = S.orders.filter(inScope), sales = all.filter(o => o.status==="closed"), refunds = all.filter(o => o.status==="refund"), voids = S.orders.filter(o => o.branchId===device.branchId && o.status==="void" && (RP==="shift" ? sh && o.shiftId===sh.id : bizDate(o.voidedAt || o.updatedAt || o.createdAt)===today && (RP==="branch" || o.deviceId===device.id)));
  const sum = (l, f) => +l.reduce((s,x) => s + (+f(x)||0), 0).toFixed(2), grp = (l, key, val) => { const m = new Map(); l.forEach(x => { const k = key(x) || "—"; const c = m.get(k) || { n:0, v:0 }; c.n++; c.v += +val(x)||0; m.set(k, c); }); return [...m.entries()].sort((a,b) => b[1].v - a[1].v); };
  const items = sales.flatMap(o => (o.items||[]).map(i => ({ ...i, o })));
  const catOf = i => S.categories.find(c => c.id===S.products.find(p => p.id===i.productId)?.categoryId)?.name || "Other";
  const prodRows = (() => { const m = new Map(); items.forEach(i => { const c = m.get(i.name) || { n:0, v:0 }; c.n += +i.qty||0; c.v += lineNet(i); m.set(i.name, c); }); return [...m.entries()].sort((a,b) => b[1].n - a[1].n); })();
  const catRows = (() => { const m = new Map(); items.forEach(i => { const k = catOf(i), c = m.get(k) || { n:0, v:0 }; c.n += +i.qty||0; c.v += lineNet(i); m.set(k, c); }); return [...m.entries()].sort((a,b) => b[1].v - a[1].v); })();
  const voidItems = all.concat(sales).flatMap(o => o.voidedItems || []).filter((x,i,a) => a.indexOf(x)===i);
  const gross = sum(sales, o => o.total), ref = -sum(refunds, o => o.total);
  return { sh, all, sales, refunds, voids, gross, ref, net: +(gross - ref).toFixed(2), tax: +(sum(sales, o => o.tax) + sum(refunds, o => o.tax)).toFixed(2), disc: sum(sales, o => o.discount), chg: sum(sales, o => o.chargesTotal),
    pay: grp([...sales, ...refunds], o => o.payment?.method, o => o.total), types: grp(sales, o => typLbl(o.type), o => o.total), chans: grp(sales, o => o.channel==="pos" ? "POS" : o.channel==="callcenter" ? "Call center" : "Web ordering", o => o.total),
    staff: grp(sales, o => o.handledBy || o.agent, o => o.total), prodRows, catRows, voidTotal: sum(voids, o => o.total), voidItemsTotal: +voidItems.reduce((s,i) => s + (+i.price||0)*(+i.qty||1), 0).toFixed(2), voidItemsN: voidItems.reduce((s,i) => s + (+i.qty||1), 0) };
}
const RP_L = { shift:"This shift", device:"Today · this register", branch:"Today · whole branch" };
function openReports(){
  const d = reportData(), cnt = d.sales.length, tbl = (rows, money = true) => rows.length ? `<table>${rows.map(([k,c]) => `<tr><td>${esc(k)}</td><td class="c">${c.n}</td><td>${money ? usd(c.v) : c.v}</td></tr>`).join("")}</table>` : `<p class="mut">Nothing yet</p>`;
  const sec = (h, x) => `<div class="rsec"><h3>${h}</h3>${x}</div>`;
  modal("reports", `<div class="ohdr"><button class="hbtn" data-close>Back</button><b style="font-size:18px">Reports</b><span class="sp"></span>
    <div class="otabs2" style="box-shadow:none;border:1px solid var(--line)">${Object.entries(RP_L).map(([k,l]) => `<button data-rp="${k}" class="${RP===k?"on":""}">${l}</button>`).join("")}</div><button class="hbtn ghost" data-rprint>Print</button></div>
    <div class="mb"><p class="mut" style="margin:0 0 12px">${RP==="shift" ? (d.sh ? `Shift opened ${new Date(d.sh.openedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}${d.sh.cashier ? " by " + esc(d.sh.cashier) : ""}${d.sh.closedAt ? " · closed" : " · still open"}` : "No shift on this register yet.") : `Business day ${bizDate()}${RP==="device" ? " · " + esc(device.name) : " · " + esc(branch?.name||"")}`}</p>
    <div class="rgrid"><div><span>Orders</span><b>${cnt}</b></div><div><span>Gross sales</span><b>${usd(d.gross)}</b></div><div><span>Returns</span><b>${usd(-d.ref)}</b></div><div><span>Net sales (after returns)</span><b>${usd(d.net)}</b></div>
      <div><span>Tax</span><b>${usd(d.tax)}</b></div><div><span>Discounts</span><b>${usd(d.disc)}</b></div><div><span>Charges</span><b>${usd(d.chg)}</b></div><div><span>Average order</span><b>${usd(cnt ? d.gross / cnt : 0)}</b></div>
      <div><span>Voided orders</span><b>${d.voids.length} · ${usd(d.voidTotal)}</b></div><div><span>Voided items</span><b>${d.voidItemsN} · ${usd(d.voidItemsTotal)}</b></div></div>
    <div class="rsecs">${sec("Payments", tbl(d.pay))}${sec("Order types", tbl(d.types))}${sec("Channels", tbl(d.chans))}${sec("Categories", tbl(d.catRows))}${sec("Top products", tbl(d.prodRows.slice(0, 15)))}${sec("Staff", tbl(d.staff))}</div></div>`, true);
  $("#modal").classList.add("full"); $("#scrim").classList.add("fullscr");
}
function reportText(){
  const d = reportData(), w = 32, row = (a,b) => String(a).slice(0, w-String(b).length-1).padEnd(w-String(b).length) + b, m = n => (+n||0).toFixed(2);
  const L = [ (branch?.name||"").padStart((w+(branch?.name||"").length)/2), ("REPORT · " + RP_L[RP].toUpperCase()).slice(0,w), device.name, new Date().toLocaleString("en-GB"), "-".repeat(w),
    row("Orders", d.sales.length), row("Gross sales", m(d.gross)), row("Returns", d.ref ? "-" + m(d.ref) : m(0)), row("Net sales", m(d.net)), row("Tax", m(d.tax)), row("Discounts", m(d.disc)), row("Charges", m(d.chg)),
    row("Voided orders " + d.voids.length, m(d.voidTotal)), row("Voided items " + d.voidItemsN, m(d.voidItemsTotal)), "-".repeat(w), "PAYMENTS", ...d.pay.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))),
    "-".repeat(w), "ORDER TYPES", ...d.types.map(([k,c]) => row(k + " (" + c.n + ")", m(c.v))), "-".repeat(w), "CATEGORIES", ...d.catRows.map(([k,c]) => row(k + " x" + c.n, m(c.v))), "-".repeat(w) ];
  return L.join("\n");
}

/* ---------- devices & diagnostics ---------- */
const devOnline = d => d.id===device.id || (d.lastSeen && Date.now() - new Date(d.lastSeen) < 11*60000);
function openDevices(){
  const l = (S.devices||[]).filter(d => !d.deleted && d.branchId===device.branchId).sort((a,b) => (b.id===device.id) - (a.id===device.id) || String(a.name).localeCompare(String(b.name)));
  const hasM = l.some(d => d.settings?.master), role = d => d.type && d.type!=="cashier" ? ({ kds:"Kitchen display", waiter:"Waiter", kiosk:"Kiosk", notifier:"Notifier" }[d.type] || d.type) : hasM ? (d.settings?.master ? "Master POS" : "Sub-POS") : "POS";
  modal("devices", `<div class="mh"><h2>Devices · ${esc(branch?.name||"")}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><div class="dvl">${l.map(d => `<div class="dvc"><span class="dot${devOnline(d)?" on":""}"></span><div class="sp"><b>${esc(d.name)}</b>${d.id===device.id ? ` <span class="pill">This device</span>` : ""}<div class="mut">${esc(role(d))} · ${d.activatedAt ? (devOnline(d) ? "Online" : "Last seen " + ago(d.lastSeen)) : "Not activated yet"}</div></div>${d.settings?.master ? `<span class="spill s-active">Master</span>` : ""}</div>`).join("") || `<p class="mut">No devices.</p>`}</div>
    <p class="mut" style="margin-top:12px">${hasM ? "Only the master POS accepts call-center and web orders and ends the day." : "No master POS set: every POS can accept orders and end the day. Pick one in Manage → Devices → Settings."} Add or change devices in the back office.</p></div>
    <div class="mf"><button class="btn pri" data-close>Done</button></div>`);
}
async function openDiag(){
  const s = syncSt, f = window.WOK?.sync?.failed?.() || [], est = await (navigator.storage?.estimate?.() || Promise.resolve(null)).catch(() => null), today = bizDate();
  const sw = "serviceWorker" in navigator ? (navigator.serviceWorker.controller ? "Active" : "Not active") : "Not supported";
  const rows = [["Connection", s.online ? "Online" : "Offline"], ["Waiting to sync", s.pending], ["Rejected by the server", f.length], ["Last synced", ago(s.lastSync)], ["Signed in", s.needsLogin ? "No · sign in to sync" : "Yes"],
    ["Device", device.name + (isMaster() ? "" : " (sub-POS)")], ["Branch", branch?.name || "—"], ["Business day", today + (openDay() < today ? ` · ${openDay()} not ended` : "")], ["Shift", openShift() ? "Open" : "Closed"],
    ["Menu loaded", `${products().length} products · ${S.categories.filter(live).length} categories`], ["Orders on this tablet", S.orders.filter(o => o.branchId===device.branchId).length], ["Users with a PIN", posUsers().length],
    ["Offline app", sw], ["Storage", est ? `${(est.usage/1048576).toFixed(1)} MB used of ${(est.quota/1048576/1024).toFixed(1)} GB` : "—"], ["Screen", `${innerWidth} × ${innerHeight}`], ["Clock", new Date().toLocaleString("en-GB") + " · " + (Intl.DateTimeFormat().resolvedOptions().timeZone || "")],
    ["Printing", window.Capacitor ? "Android app" : "Browser · printing works in the Android app"], ["App", "Slick POS · " + (document.querySelector('script[src^="wokdb.js"]')?.getAttribute("src").split("?v=")[1] ? "data v" + document.querySelector('script[src^="wokdb.js"]').getAttribute("src").split("?v=")[1] : "")]];
  modal("diag", `<div class="mh"><h2>Diagnostics</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><div class="rsec" style="box-shadow:none;padding:0"><table>${rows.map(([k,v]) => `<tr><td class="c">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>
    ${f.length ? `<p style="margin-top:12px"><b>Rejected changes</b></p>${f.map(o=>`<p class="mut">${esc(o.col)} · ${esc(o.data?.no ? "Order #"+o.data.no : o.id)} — ${esc(o.lastError||"")}</p>`).join("")}` : ""}</div>
    <div class="mf">${f.length?'<button class="btn" id="retryFailed">Retry rejected</button>':""}<button class="btn" id="diagReload" style="margin-right:auto">Reload app</button><button class="btn pri" id="syncNow">Sync now</button></div>`);
}
})();
