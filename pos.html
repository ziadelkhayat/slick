<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slick POS</title>
<style>
:root{--bg:#f3f2f7;--s:#fff;--ink:#1c1b22;--ink2:#5b5a66;--mut:#8d8c98;--line:#e5e3ec;--acc:#5b2bc4;--accs:#efe9fc;--acci:#47209e;--good:#1f8a4c;--goods:#e5f5ec;--warn:#b45a12;--warns:#fdf0e6;--bad:#9e0c24;--bads:#fdecef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* activation */
.center{min-height:100%;display:grid;place-items:center;padding:24px}
.panel{background:var(--s);border-radius:16px;padding:32px;width:min(420px,100%);box-shadow:0 10px 40px rgba(30,20,60,.08);text-align:center}
.logo{width:56px;height:56px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:24px;margin:0 auto 14px}
.panel h1{margin:0 0 6px;font-size:22px}.panel p{color:var(--ink2);margin:0 0 20px}
.codein{width:100%;font-size:30px;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;font-family:ui-monospace,Menlo,monospace}
.codein:focus{outline:none;border-color:var(--acc)}
.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;margin-top:14px}
.big:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* app */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:12px;background:var(--s);border-bottom:1px solid var(--line);padding:0 14px}
.top .logo{width:34px;height:34px;font-size:15px;border-radius:9px;margin:0}
.top b{font-size:15px}.top .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:8px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tbtn .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;font-weight:600}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--goods);color:var(--good);font-weight:500}
.pill.off{background:var(--warns);color:var(--warn)}
.sync{border:0;cursor:pointer;font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:500;display:inline-flex;align-items:center;gap:6px;background:var(--goods);color:var(--good)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.off{background:var(--warns);color:var(--warn)}.sync.bad{background:#fde7ea;color:#9e0c24}
.sync.busy::before{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.main{display:grid;grid-template-columns:1fr 380px;min-height:0}
@media(max-width:1000px){.main{grid-template-columns:1fr 320px}}
#cats{display:none}
.cats{background:var(--s);border-right:1px solid var(--line);overflow:auto;padding:8px}
.cat{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:10px;font-weight:500;color:var(--ink2);margin-bottom:2px}
.cat.on{background:var(--accs);color:var(--acci)}
.menu{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .05s}
.prod:active{transform:scale(.97);border-color:var(--acc)}
.prod span{font-weight:500;line-height:1.25}.prod b{color:var(--acci)}
.cart{background:var(--s);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.otype{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.otype button{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:9px 4px;font-weight:500;font-size:14px}
.otype button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.extra{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.extra input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;width:100%}
.lines{flex:1;overflow:auto;padding:4px 12px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{font-weight:500}.line .p{text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:10px}.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--s);font-size:18px;line-height:1}
.line .note{grid-column:1/-1;font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.totals{padding:12px;border-top:1px solid var(--line);display:grid;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between}.totals .g{font-size:20px;font-weight:700}
.acts{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;padding:0 12px 12px}.acts .pay{grid-column:span 2}
.obar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#f6f2ff}.obar b{font-size:15px}.obar .sp{flex:1}.obar button{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px}
.line .sent{display:block;font-size:11.5px;color:#5b5a66}
#modal.full{width:100vw!important;height:100vh;max-width:none;max-height:none;border-radius:0;display:flex;flex-direction:column}.scrim.fullscr{padding:0!important}.modal.full .mb{flex:1;overflow:auto}
.modal.full{background:#f3f3f9}.modal.full .mh{background:var(--s)}
.oboard{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;min-height:100%}
.ocol{display:flex;flex-direction:column;gap:10px}.ochead{display:flex;align-items:center;gap:8px;background:var(--s);border-radius:14px;padding:12px 16px;box-shadow:0 1px 3px rgba(21,19,31,.06)}.ochead b{font-size:16px}.ochead .cnt{background:#ececf3;border-radius:999px;padding:1px 9px;font-size:13px}
.oempty{background:#e9e8f1;border-radius:14px;padding:30px 14px;text-align:center;color:#5b5a66}
.ocard{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--s);border:1px solid transparent;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(21,19,31,.08);font:inherit;color:inherit;cursor:pointer}
.ocard:hover{border-color:var(--acc)}.ocard .oc1{display:flex;align-items:center;gap:8px}.ocard .oc1 b{font-size:17px}.ocard .oc1 .spill{margin-left:auto}
.ocard .oc2{display:flex;flex-direction:column;font-size:14px}.ocard .oc2 small{color:#8d8c98;font-size:12.5px;padding-left:22px}.ocard .oc-s{font-size:12.5px}.ocard .oc-t{font-size:17px}
@media(max-width:900px){.oboard{grid-template-columns:1fr}}
.acts button{border:1px solid var(--line);background:var(--s);border-radius:12px;padding:14px 6px;font-weight:600}
.acts .pay{background:var(--acc);border-color:var(--acc);color:#fff;font-size:16px}
.acts button:disabled{opacity:.45}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,16,35,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.scrim.show{display:flex}
.modal{background:var(--s);border-radius:16px;width:min(520px,100%);max-height:92vh;overflow:auto}
.modal.wide{width:min(860px,100%)}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:18px;flex:1}
.x{border:0;background:none;font-size:24px;color:var(--mut)}
.mb{padding:18px 20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:11px 16px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.5}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.paym button{border:1px solid var(--line);background:var(--s);border-radius:12px;padding:16px 6px;font-weight:600}.paym button.on{border-color:var(--acc);background:var(--accs);color:var(--acci)}
.due{font-size:30px;font-weight:700;text-align:center;margin:4px 0 14px}
.tender{width:100%;font-size:24px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.quick button{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:12px 4px;font-weight:600}
.change{display:flex;justify-content:space-between;font-size:18px;margin-top:14px}
.f{display:grid;gap:6px;margin-bottom:12px}.f label{font-size:13px;color:var(--ink2);font-weight:500}.f input,.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.receipt{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fbfbfd;border:1px dashed var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;line-height:1.5}
.ilist{display:grid;gap:10px}
.icard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.icard .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spill{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500}.s-pending{background:#e8f0fd;color:#2c5fb8}.s-active{background:var(--warns);color:var(--warn)}
.mut{color:var(--mut);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stats div{background:var(--bg);border-radius:10px;padding:12px}.stats b{display:block;font-size:20px;margin-top:2px}
/* ===== Slick modern theme (POS) ===== */
:root{--bg:#f4f5fa;--line:#e8e8f0;--acc:#6c47ff;--accs:#f0ecff;--acci:#5130e8;--good:#12a150;--goods:#e3f7ec;--bad:#e5484d}
body{-webkit-font-smoothing:antialiased}
.logo{background:linear-gradient(135deg,#6c47ff,#a855f7);box-shadow:0 6px 18px rgba(108,71,255,.4)}
.panel{border-radius:22px;box-shadow:0 20px 60px rgba(21,19,31,.12)}
.big,.acts .pay,.btn.pri,.otype button.on{background:linear-gradient(135deg,#6c47ff,#5130e8);border-color:transparent;box-shadow:0 6px 16px rgba(108,71,255,.3)}
.top{background:#13111c;border-bottom:0;color:#fff}
.top b{color:#fff}
.tbtn{background:#1f1c2c;border-color:#2c2840;color:#e3e0f0;border-radius:12px}
.cats{background:#fff;padding:10px}
.cat{border-radius:12px;padding:13px 12px;font-weight:600}
.cat.on{background:linear-gradient(135deg,#6c47ff,#5130e8);color:#fff;box-shadow:0 6px 14px rgba(108,71,255,.3)}
.menu{padding:16px}
.search{border-radius:999px;padding:12px 18px;box-shadow:0 1px 2px rgba(21,19,31,.05)}
.grid{gap:12px}
.prod{border-radius:16px;border-color:transparent;box-shadow:0 1px 2px rgba(21,19,31,.04),0 4px 14px rgba(21,19,31,.06);min-height:104px;position:relative;overflow:hidden}
.prod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#6c47ff,#a855f7);opacity:.8}
.prod span{font-weight:600}.prod b{font-size:15px}
.cart{border-left:0;box-shadow:-8px 0 30px rgba(21,19,31,.05)}
.otype button{border-radius:12px;font-weight:600}
.extra input,.f input,.f textarea,.tender{border-radius:12px}
.line{border-bottom-color:#f0eff5}
.qty button{border-radius:10px;background:#f4f3f9;border-color:transparent}
.totals .g{font-size:22px}
.acts button{border-radius:14px}
.modal{border-radius:22px;box-shadow:0 20px 60px rgba(21,19,31,.2)}
.scrim{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.x{width:36px;height:36px;border-radius:10px;background:#f3f2f8;font-size:20px}
.paym button{border-radius:14px}.paym button.on{box-shadow:0 0 0 3px rgba(108,71,255,.15)}
.icard{border-radius:16px;box-shadow:0 1px 2px rgba(21,19,31,.04),0 4px 14px rgba(21,19,31,.05);border-color:transparent}
.toast{border-radius:12px}
.stats div{border-radius:14px}
.pindots{display:flex;gap:14px;justify-content:center;margin:6px 0 8px}.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);display:block}.pindots i.on{background:var(--acc)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.pinpad button{height:62px;border-radius:14px;border:1px solid #e4e1ef;background:#fff;font:inherit;font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:#efeaff}
.prod.hasimg{padding-top:8px}.prod img{width:100%;height:78px;object-fit:cover;border-radius:10px;display:block}
.dseg{display:flex;gap:6px}.dseg button{flex:1;border:1px solid var(--line);background:var(--s);border-radius:10px;padding:10px;font-weight:600}.dseg button.on{background:#efe9fb;border-color:#5b2bc4;color:#5b2bc4}
.addrg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.addrg .wide{grid-column:1/-1}
.chgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.chg{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mut,#6b6a75)}.chg.on{border-style:solid;border-color:#5b2bc4;color:#5b2bc4;background:#f6f2ff}
.otabs{display:flex;gap:6px;flex-wrap:wrap}.otabs button{border:1px solid var(--line);background:var(--s);border-radius:999px;padding:8px 14px;font-weight:600}.otabs button.on{background:#5b2bc4;color:#fff;border-color:#5b2bc4}.otabs button.on .mut{color:#e9e2ff}
.olist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}.orow{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--s);border-radius:12px;padding:10px 12px;cursor:pointer}
.orow .r1,.orow .r2{display:flex;gap:10px;align-items:center}.orow .r1 .spill{margin-left:auto}.orow .r2 span{flex:1}.orow .r3{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlines>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.vlines .qty{display:flex;align-items:center;gap:8px}.vlines .qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--s);font-weight:700}
.spill.s-void,.spill.s-returned,.spill.s-refund{background:#fde8e8;color:#9e0c24}.spill.s-closed{background:#e7f6ec;color:#1f7a3f}
.apv{position:fixed;inset:0;background:rgba(20,16,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999}.apvbox{background:#fff;border-radius:18px;padding:22px;width:min(340px,92vw);text-align:center}
.apvbox .pindots{display:flex;justify-content:center;gap:12px;margin:14px 0 6px}.apvbox .pindots i{width:14px;height:14px;border-radius:50%;border:2px solid #5b2bc4}.apvbox .pindots i.on{background:#5b2bc4}
.apvbox .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.apvbox .pinpad button{padding:14px 0;font-size:20px;font-weight:600;border:1px solid var(--line);background:var(--s);border-radius:12px}
.ctile{border:1px solid var(--line);background:var(--s);border-radius:16px;min-height:96px;padding:14px;font-size:16px;font-weight:700;text-align:left;display:flex;align-items:flex-end;box-shadow:0 2px 6px rgba(30,20,60,.05)}
.ctile:hover{border-color:#5b2bc4;color:#5b2bc4}
.cback{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:2px 0 4px}.cbtn{border:1px solid var(--line);background:var(--s);border-radius:999px;padding:8px 14px;font-weight:600;color:#5b2bc4}
.mlist{margin:3px 0 0;padding:0 0 0 16px;font-size:12px;line-height:1.45;color:#6b6a75;list-style:disc;text-align:left}.mlist li.mn{list-style:none;margin-left:-16px;font-style:italic}
/* ===== Foodics-style layout: order on the left, actions + menu on the right, bottom navigation ===== */
.app{grid-template-rows:1fr!important}
.main{grid-template-columns:400px 1fr!important;min-height:0;height:100vh}
@media(max-width:1000px){.main{grid-template-columns:340px 1fr!important}}
.cart{border-left:0;border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(21,19,31,.05);order:0}
.chead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#13111c;color:#fff;flex-wrap:wrap}
.chead .logo{width:30px;height:30px;font-size:14px;border-radius:9px;margin:0}.chead .cinfo{flex:1;min-width:0}.chead .cinfo b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chead .mut{color:#a9a5c0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockb{border:1px solid #2c2840;background:#1f1c2c;color:#e3e0f0;border-radius:10px;padding:5px 9px;font-size:13px;font-weight:600}
.rside{display:flex;flex-direction:column;min-height:0;min-width:0}
.abar{display:flex;gap:10px;padding:14px 16px 4px;justify-content:flex-end;flex-wrap:wrap}
.abtn{width:84px;height:80px;border:0;border-radius:12px;background:linear-gradient(135deg,#6c47ff,#5130e8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;box-shadow:0 6px 16px rgba(108,71,255,.28);transition:transform .05s}
.abtn:active{transform:scale(.96)}.abtn svg,.mitem svg,.bnav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.abtn.off{opacity:.45}
.rside .menu{flex:1;min-height:0}
.qwrap{position:sticky;top:-16px;z-index:2;background:var(--bg);padding:2px 0 4px}
.search{border-radius:12px!important}
.ctile{align-items:center!important;justify-content:center;text-align:center!important;font-weight:500!important;font-size:15px!important;min-height:96px!important;border-radius:6px!important;box-shadow:0 1px 3px rgba(21,19,31,.08)!important;border-color:transparent!important}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 16px 14px;background:var(--s);border-radius:14px;box-shadow:0 2px 10px rgba(21,19,31,.07);padding:6px}
.bnav button{border:0;background:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 6px;border-radius:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:#3d3a4f;position:relative}
.bnav button svg{width:22px;height:22px;color:var(--acc)}.bnav button.on{background:var(--accs);color:var(--acci)}
.bnav .badge{position:absolute;top:4px;right:calc(50% - 60px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;letter-spacing:0}
.morepop{position:fixed;top:100px;right:16px;width:300px;background:var(--s);border-radius:14px;box-shadow:0 20px 60px rgba(21,19,31,.25);z-index:9;overflow:hidden}
.mitem{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 18px;font-size:16px;text-align:left;color:#3d3a4f}
.mitem:last-child{border-bottom:0}.mitem:hover{background:var(--accs)}.mitem svg{width:22px;height:22px;color:var(--acc)}
.line.vd .n,.line.vd .p,.line.vd .qty{text-decoration:line-through;color:#a3a1ad}.line.vd .sent{text-decoration:none;color:#b42318;display:inline-block;width:100%}.line.vd .mlist{text-decoration:line-through}
.onote{margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:#fff8e6;color:#8a5a00;font-size:13px;cursor:pointer}
/* orders list (Foodics style) */
.ohdr{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--s);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ohdr .sp{flex:1}.hbtn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(135deg,#6c47ff,#5130e8);color:#fff}
.hbtn.ghost{background:var(--s);color:var(--acci);border:1px solid var(--line)}
.otabs2{display:flex;background:var(--s);border-radius:12px;box-shadow:0 1px 3px rgba(21,19,31,.06);overflow:auto}
.otabs2 button{flex:1;border:0;background:none;padding:15px 12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:#8d8c98;white-space:nowrap;border-bottom:3px solid transparent}.otabs2 button.on{color:var(--ink);border-bottom-color:var(--acc)}
.ofilt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--s);border-radius:12px;padding:10px 12px}
.ofilt .chip{border:1px solid var(--line);background:var(--s);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}.ofilt .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.olist2{background:var(--s);border-radius:12px;box-shadow:0 1px 3px rgba(21,19,31,.06);overflow:hidden}
.lrow{display:grid;grid-template-columns:110px 1.2fr 1.2fr 140px;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 20px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lrow:hover{background:#faf9fe}.lrow:last-child{border-bottom:0}.lrow .lno{font-size:17px;font-weight:600}.lrow .lc{display:flex;flex-direction:column;gap:3px;color:#5b5a66;font-size:14px}.lrow .lc b{color:var(--ink);font-weight:500;text-transform:uppercase;font-size:13.5px;letter-spacing:.02em}.lrow .lr{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}.lrow .lr b{text-transform:uppercase;font-size:13.5px;letter-spacing:.03em}
.lrow.ol5{grid-template-columns:1fr 1fr 1.4fr 1fr}.lrow.lhead{cursor:default;padding-top:10px;padding-bottom:10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#8d8c98}.lrow.lhead:hover{background:none}

.lst-pending{color:#2c5fb8}.lst-active{color:var(--warn)}.lst-closed{color:var(--good)}.lst-void,.lst-refund,.lst-declined,.lst-returned{color:var(--bad)}
@media(max-width:800px){.lrow{grid-template-columns:80px 1fr 110px}.lrow .lc2{display:none}}
/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ttile{min-height:96px;border:2px solid transparent;border-radius:16px;background:var(--s);box-shadow:0 1px 3px rgba(21,19,31,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;color:inherit;cursor:pointer;padding:10px}
.ttile .tn{font-size:26px;font-weight:700}.ttile small{font-size:12.5px;color:#8d8c98}
.ttile.busy{background:#fff4e8;border-color:#f3c18f}.ttile.busy .tn{color:var(--warn)}.ttile.long{background:#fdecef;border-color:#f2a3ae}.ttile.long .tn{color:var(--bad)}
.tsec{margin:18px 0 10px;font-size:16px}.tsec:first-child{margin-top:0}
.tleg{display:flex;gap:16px;font-size:13px;color:#5b5a66;align-items:center}.tleg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* reports & diagnostics */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}.rgrid div{background:var(--s);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(21,19,31,.06)}.rgrid span{font-size:12.5px;color:#8d8c98}.rgrid b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.rsecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.rsec{background:var(--s);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(21,19,31,.06)}.rsec h3{margin:0 0 8px;font-size:15px}
.rsec table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.rsec td{padding:7px 0;border-bottom:1px solid var(--line)}.rsec tr:last-child td{border-bottom:0}.rsec td+td{text-align:right;padding-left:10px;white-space:nowrap}.rsec td.c{color:#8d8c98}
.toast{bottom:96px!important}
.extra:empty{display:none}
@keyframes ring{0%,100%{transform:none}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}.bnav button.ring{animation:ring 1s 3;background:#fff4e8}
.gpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gpad button{min-height:60px;border:1px solid var(--line);background:var(--s);border-radius:14px;font-size:20px;font-weight:700}.gpad button.on{border-color:var(--acc);background:var(--accs);color:var(--acci)}.gpad button:active{transform:scale(.95)}
.clrc{border:1px solid #f1c4c9!important;background:#fff5f6!important;color:#b42318;font-weight:600}
.htabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}.htab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px dashed #b9a9f5;background:#fbf9ff;border-radius:10px;padding:6px 12px;min-height:44px;font-size:12px;color:#5b5a66}.htab b{font-size:14px;color:var(--acci)}.htab:active{background:var(--accs)}
.ctx{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:#f6f2ff;border-radius:12px;padding:8px 8px 8px 12px}.ctx .ci{font-size:22px}.ctx .ci-svg{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);color:#fff}.ctx .ci-svg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.ctx b{display:block;font-size:16px}.ctx small{color:#6b6a75;font-size:12.5px}.ctx .sp{flex:1}.ctx button{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;min-height:44px}
#modal .addrg input{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}#modal .f input:not([type=checkbox]){width:100%}
.dvl{display:grid;gap:10px}.dvc{display:flex;align-items:center;gap:12px;background:var(--s);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(21,19,31,.06)}.dvc .sp{flex:1}.dot{width:10px;height:10px;border-radius:50%;background:#c9c7d4;flex:none}.dot.on{background:var(--good)}
/* ===== touch screens (iPad / tablets) ===== */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,.receipt{-webkit-user-select:text;user-select:text}
*{touch-action:manipulation}                                   /* no double-tap zoom, no 300ms delay */
input,select,textarea{font-size:16px!important}                /* iOS doesn't zoom into fields */
.app{height:100vh;height:100dvh}.main{height:100vh!important;height:100dvh!important}
.app{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.lines,.menu,.mb,.modal,.olist2{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* bigger targets */
.qty{gap:12px}.qty button{width:44px!important;height:44px!important;font-size:22px;border-radius:12px}
.line{padding:12px 0}.line .n{font-size:15.5px}
.otype button{min-height:50px;font-size:15px}
.extra input,.extra select{min-height:48px}
.acts button{min-height:60px;font-size:16px}
.prod{min-height:112px!important;padding:16px 14px!important}.prod span{font-size:15.5px}
.ctile{min-height:110px!important;font-size:16px!important}
.cbtn{min-height:44px;padding:10px 16px}
.bnav button{min-height:56px}
.x{width:44px!important;height:44px!important}
.btn{min-height:48px;padding:12px 18px}
.hbtn{min-height:46px}
.chg,.ofilt .chip{min-height:40px;padding:8px 14px!important}
.dseg button,.paym button{min-height:52px}
.quick button{min-height:52px}
.mitem{min-height:56px}
.lrow{min-height:64px}
.search{min-height:48px}
/* pressed feedback instead of hover */
.prod:active,.ctile:active,.ttile:active,.ocard:active{transform:scale(.97);filter:brightness(.97)}
.abtn:active,.acts button:active,.btn:active,.hbtn:active,.otype button:active,.qty button:active,.chg:active,.chip:active,.cbtn:active{transform:scale(.95);filter:brightness(.94)}
.bnav button:active,.mitem:active,.lrow:active{background:var(--accs)}
@media (hover:none){.ctile:hover{border-color:transparent!important;color:inherit!important}.lrow:hover{background:none}.ocard:hover{border-color:transparent}.mitem:hover{background:none}}
/* iPad portrait and small tablets */
@media (max-width:900px){
  .main{grid-template-columns:330px 1fr!important}
  .abar{gap:8px;padding:12px 12px 4px;flex-wrap:nowrap;justify-content:stretch}
  .abtn{flex:1;width:auto;min-width:0;height:68px;font-size:12px;gap:4px}.abtn svg{width:22px;height:22px}
  .rside .menu{padding:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .bnav{margin:0 12px 12px}.bnav button{flex-direction:column;gap:3px;font-size:11px;letter-spacing:.02em;padding:8px 4px;text-align:center;line-height:1.15}
  .bnav .badge{top:2px;right:calc(50% - 26px)}
  .chead .cinfo{flex:1 1 140px}
  .oboard{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){.main{grid-template-columns:1fr!important}}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// modifiers shown as a list under the product: one line per option ("2× Cheese"), then the item note
const modLines = i => { if(Array.isArray(i.options) && i.options.length){ const t = []; i.options.forEach(x => { const f = t.find(y => y.name===x.name); if(f) f.n++; else t.push({ name:x.name, n:1 }); }); return [...t.map(x => (x.n > 1 ? x.n + "× " : "") + x.name), ...(i.note ? ["Note: " + i.note] : [])]; }
  return String(i.mods||"").split(" · ").flatMap(p => p.startsWith("Note: ") ? [p] : p.split(", ")).map(x => x.trim()).filter(Boolean); };
const modList = i => { const l = modLines(i); return l.length ? `<ul class="mlist">${l.map(x => `<li${x.startsWith("Note: ") ? ' class="mn"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""; };
const coS = () => { try{ return S.settings.find(x=>x.id==="company") || {}; }catch(e){ return {}; } };
const DEC = () => { const d = coS().priceDecimals; return d===0||d==="0" ? 0 : +d || 2; };
const usd = n => (coS().currency || "USD") + " " + (+n||0).toLocaleString("en-US",{minimumFractionDigits:DEC(),maximumFractionDigits:DEC()});
const usd2 = n => { const c = coS(); if(!c.currency2 || !(+c.rate2)) return ""; const d = +c.decimals2 || 0; return c.currency2 + " " + ((+n||0) * +c.rate2).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); };
(() => { const P = Date.prototype, ls = P.toLocaleString, lt = P.toLocaleTimeString;   // 12-hour clock on screen and receipts
  P.toLocaleString = function(l, o){ return ls.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); };
  P.toLocaleTimeString = function(l, o){ return lt.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); }; })();
// delivery address parts, stored as one line: "[Home] Hamra, Bliss St · Bldg: … · Floor: … · Info: …"
const ADDR_K = ["label","street","building","floor","extra"];
const addrJoin = a => { const c = v => String(v||"").replace(/\s*·\s*/g, ", ").trim(); return [c(a.label) ? "[" + c(a.label).replace(/[\[\]]/g,"") + "]" : "", [c(a.street), c(a.building) && "Bldg: " + c(a.building), c(a.floor) && "Floor: " + c(a.floor), c(a.extra) && "Info: " + c(a.extra)].filter(Boolean).join(" · ")].filter(Boolean).join(" "); };
const show = id => ["boot","activate","app"].forEach(x => $("#"+x).classList.toggle("hide", x!==id));
let tt; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); };
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} } };

let db = null;
const S = { brands:[], devices:[], branches:[], categories:[], products:[], orders:[], shifts:[], modifiers:[], modifier_options:[], taxes:[], tax_groups:[], payment_methods:[], roles:[], users:[], settings:[], day_closes:[], charges:[] };
let posChg = null;   // null = the charges that apply automatically; otherwise the ids the cashier kept
let GUESTS = 0, orderNote = "", SEEN = new Set(), SEEN_READY = false;   // pending call-center / web orders already announced   // order-level note, printed on the receipt (not the kitchen ticket)
let EDIT = null;   // an order opened from the Orders list into the billing section: { id }
let device = null, branch = null, cat = "", otype = "dinein", cart = [], discount = 0, discType = "pct", tableNo = "", cust = { name:"", phone:"", addr:{} };

/* ---------- boot ---------- */
(async function boot(){
  const timer = setTimeout(() => { const g = document.getElementById("wkGate"); if(!db && !(g && g.style.display!=="none")) $("#boot p").textContent = navigator.onLine ? "Still connecting… If this doesn't clear, close and reopen the app." : "No internet. Connect once to sign in; after that the register works offline."; }, 15000);
  try{ db = window.claude && await window.claude.use("db"); }catch(e){ db = null; }
  clearTimeout(timer);
  if(!db){ $("#boot p").textContent = "Sign in with your staff account to continue."; return; }
  Object.keys(S).forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ ...d.data(), id:d.id })); onData(c); }, e => console.error(c, e)));
})();
let started = false;
function onData(c){
  if(c==="devices" && !started){ started = true; const id = store.get("wokDevice"); if(id && S.devices.some(d=>d.id===id && !d.deleted && d.activatedAt)) startApp(id); else { store.set("wokDevice", null); show("activate"); $("#code").focus(); } return; }
  if(!device) return;
  device = S.devices.find(d => d.id===device.id) || device;
  if(device.deleted){ store.set("wokDevice", null); location.reload(); return; }
  branch = S.branches.find(b => b.id===device.branchId) || branch;
  if(c==="orders") window.__ordLoaded = true;
  if(c==="orders" && devSet().autoAccept) autoAccept();
  if(c==="users" || c==="roles"){ if(cashier){ cashier = S.users.find(u=>u.id===cashier.id && live(u) && u.active!==false) || null; } lockIfNeeded(); }
  renderAll();
}

/* ---------- offline & sync status ---------- */
let syncSt = { online:navigator.onLine, pending:0, failed:0 };
const ago = t => { if(!t) return "never"; const m = Math.round((Date.now()-new Date(t))/60000); return m<1?"just now":m<60?m+" min ago":new Date(t).toLocaleString("en-GB"); };
function paintSync(){
  const p = $("#syncPill"), s = syncSt; if(!p) return;
  p.className = "sync" + (s.failed||s.needsLogin ? " bad" : !s.online ? " off" : s.pending ? " off busy" : "");
  p.textContent = s.needsLogin ? "Sign in to sync" : !s.online ? (s.pending ? `Offline · ${s.pending} to sync` : "Offline") : s.pending ? `Syncing ${s.pending}…` : s.failed ? `${s.failed} not synced` : "Online";
}
window.addEventListener("slick-sync", e => { const was = syncSt; syncSt = e.detail; paintSync();
  if(was.pending && !syncSt.pending && syncSt.online) toast("All offline sales synced");
  if(was.online && !syncSt.online) toast("Offline · sales will be saved on this tablet and synced later"); });
$("#syncPill").addEventListener("click", () => {
  const s = syncSt, f = window.WOK.sync.failed();
  modal("sync", `<div class="mh"><h2>Connection & sync</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">
    <div class="stats"><div><span class="mut">Connection</span><b>${s.online?"Online":"Offline"}</b></div><div><span class="mut">Waiting to sync</span><b>${s.pending}</b></div></div>
    <p class="mut">Last synced: ${ago(s.lastSync)}. Sales, shifts and order updates made offline are kept on this tablet and sent automatically when the connection is back.</p>
    ${f.length ? `<p><b>${f.length} change(s) the server rejected</b></p>${f.map(o=>`<p class="mut">${esc(o.col)} · ${esc(o.data?.no ? "Order #"+o.data.no : o.id)} — ${esc(o.lastError||"")}</p>`).join("")}` : ""}</div>
    <div class="mf">${f.length?'<button class="btn" id="retryFailed">Retry rejected</button>':""}<button class="btn pri" id="syncNow">Sync now</button></div>`);
});
document.addEventListener("click", e => {
  if(e.target.id==="syncNow"){ window.WOK.sync.flush(); closeModal(); toast(navigator.onLine ? "Syncing…" : "Still offline · will sync when the connection is back"); }
  if(e.target.id==="retryFailed"){ window.WOK.sync.retryFailed(); closeModal(); toast("Retrying"); }
});

/* ---------- activation ---------- */
$("#code").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,""); $("#actBtn").disabled = e.target.value.length!==6; $("#actErr").textContent = ""; });
$("#actForm").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("#code").value, d = S.devices.find(x => x.code===code && !x.deleted);
  if(!navigator.onLine){ $("#actErr").textContent = "Connect to the internet to activate. After that the register works offline too."; return; }
  if(!d){ $("#actErr").textContent = "That code isn't valid. Check it in Manage → Devices."; return; }
  if(d.activatedAt){ $("#actErr").textContent = "This code was already used. Generate a new code in the back office."; return; }
  $("#actBtn").disabled = true;
  try{ await db.collection("devices").doc(d.id).update({ activatedAt:new Date().toISOString(), lastSeen:new Date().toISOString() }); store.set("wokDevice", d.id); startApp(d.id); toast("Device activated"); }
  catch(err){ console.error(err); $("#actErr").textContent = "Couldn't activate. You may not have access to this back office."; $("#actBtn").disabled = false; }
});
function startApp(id){
  device = S.devices.find(d => d.id===id); branch = S.branches.find(b => b.id===device.branchId);
  show("app"); renderAll(); lockIfNeeded(); if(devSet().autoAccept) autoAccept();
  setInterval(() => db.collection("devices").doc(device.id).update({ lastSeen:new Date().toISOString() }).catch(()=>{}), 5*60*1000);
}

/* ---------- data helpers ---------- */
const live = r => !r.deleted;
const prodPrice = p => { const c = (p.customPrices||{})[device.branchId]; return c!=null && c!=="" ? +c : +p.price||0; };
// variants are full products linked from their parent (parent.variants = [{ name, productId }]); the menu shows the parent, which asks for the variant
const kidIds = () => new Set(S.products.flatMap(p => (p.variants||[]).map(v => v.productId).filter(Boolean)));
const kidsOf = p => { const ok = products(); return (p.variants||[]).map(v => ({ name:v.name, p: ok.find(x => x.id===v.productId) })).filter(x => x.p); };
const tilePrice = p => { const k = kidsOf(p); return k.length ? Math.min(...k.map(x => prodPrice(x.p))) : prodPrice(p); };
const products = () => S.products.filter(p => live(p) && !(p.inactiveBranchIds||[]).includes(device.branchId) && !(p.inactiveBranchIds||[]).includes(device.branchId + ":pos") && !(p.inactiveBranchIds||[]).includes(device.branchId + ":pos:" + menuType()) && (!p.brandId || !branch?.brandId || p.brandId===branch.brandId)); // which channels sell it is set per branch in Menus
const openShift = () => S.shifts.find(s => s.deviceId===device.id && !s.closedAt);
/* ---------- cashiers: PIN sign-in and what each role may do ---------- */
let cashier = null, pinBuf = "";
const posUsers = () => S.users.filter(u => live(u) && u.active!==false && u.pinHash && (!(u.branchIds||[]).length || u.branchIds.includes(device.branchId)));
const usePins = () => S.users.some(u => live(u) && u.pinHash);           // no PIN users yet = the register stays open, as before
const can = perm => { if(!usePins()) return true; if(!cashier) return false; const r = S.roles.find(x => x.id===cashier.roleId && live(x)); return !!r && (r.permissions||[]).includes(perm); };
async function pinHash(id, pin){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("slick:" + id + ":" + pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function lockIfNeeded(){ if(usePins() && !cashier) lock(); paintCashier(); }
function lock(){ cashier = null; pinBuf = ""; paintPin(); $("#pinErr").textContent = ""; $("#lock").classList.remove("hide"); paintCashier(); }
function paintPin(){ document.querySelectorAll("#pinDots i").forEach((d,i) => d.classList.toggle("on", i < pinBuf.length)); }
function paintCashier(){ $("#lockBtn").classList.toggle("hide", !usePins()); $("#cashierName").textContent = cashier ? cashier.name : ""; }
async function tryPin(){
  const pin = pinBuf; pinBuf = ""; paintPin();
  for(const u of posUsers()){ if(await pinHash(u.id, pin) === u.pinHash){
    const r = S.roles.find(x => x.id===u.roleId && live(x));
    if(!r || !(r.permissions||[]).includes("pos_access")){ $("#pinErr").textContent = "Your role doesn't allow using the POS."; return; }
    cashier = u; $("#lock").classList.add("hide"); paintCashier(); toast("Signed in as " + u.name); return; } }
  $("#pinErr").textContent = "Wrong PIN. Try again.";
}
$("#lock").addEventListener("click", e => { const b = e.target.closest("[data-pin]"); if(!b) return; const k = b.dataset.pin;
  if(k==="c") pinBuf = ""; else if(k==="b") pinBuf = pinBuf.slice(0,-1); else if(pinBuf.length < 4) pinBuf += k;
  $("#pinErr").textContent = ""; paintPin(); if(pinBuf.length===4) tryPin(); });
document.addEventListener("keydown", e => { if($("#lock").classList.contains("hide")) return; if(/^\d$/.test(e.key) && pinBuf.length < 4){ pinBuf += e.key; paintPin(); if(pinBuf.length===4) tryPin(); } else if(e.key==="Backspace"){ pinBuf = pinBuf.slice(0,-1); paintPin(); } });
$("#lockBtn").addEventListener("click", () => lock());
let idleT; ["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => { clearTimeout(idleT); const mins = devSet().lockMinutes ?? 10; if(+mins > 0) idleT = setTimeout(() => { if(usePins() && cashier) lock(); }, mins*60*1000); }));
const deny = what => { toast(`${cashier ? cashier.name + ", your" : "Your"} role doesn't allow ${what}.`); return true; };
/* ---------- order numbers: each tablet counts 1, 2, 3… and starts again every business day ---------- */
const dayCut = () => { const m = /^(\d{1,2}):(\d{2})/.exec((S.settings.find(x=>x.id==="company")||{}).dayEnd || ""); return m ? Math.min(719, (+m[1])*60 + (+m[2])) : 0; };
const bizDate = (t = new Date()) => { const d = new Date(+new Date(t) - dayCut()*60000); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
// call number: one sequence per branch (all registers), starting again at 1 after each end of day; the server fixes any clash
function nextOrderNo(){
  const since = S.day_closes.filter(c => c.branchId===device.branchId).reduce((m,c) => Math.max(m, +new Date(c.closedAt) || 0), 0);
  const key = "slickNo_" + device.branchId; let c = {}; try{ c = JSON.parse(store.get(key) || "{}"); }catch(e){}
  let n = c.since===since ? +c.n||0 : 0;
  S.orders.forEach(o => { if(o.branchId===device.branchId && o.no && o.status!=="refund" && +new Date(o.createdAt) > since) n = Math.max(n, parseInt(String(o.no).replace(/\D/g,""),10)||0); });
  n++; store.set(key, JSON.stringify({ since, n })); return String(n);
}
/* ---------- company and app settings (Account settings, Manage → Settings) ---------- */
const company = () => S.settings.find(x=>x.id==="company") || {};
const APP_DEF = { requireCustPickup:true, requireCustDelivery:true, requireTable:false, stockAction:"ask", reasonRequired:true, discountApproval:false, rcptInvoice:true, rcptCustomer:true, rcptTax:true, rcptSource:false,
  voidReasons:"Customer changed mind\nWrong item entered\nItem not available\nKitchen mistake", returnReasons:"Quality complaint\nWrong order delivered\nLate delivery\nCustomer cancelled" };
const appSet = () => ({ ...APP_DEF, ...(S.settings.find(x=>x.id==="app")||{}) });
const taxIncl = () => company().taxInclusive !== false;
const typeKey = t => t==="takeaway" ? "pickup" : t;
const menuType = () => otype==="takeaway" || otype==="fast" ? "pickup" : otype;   // fast orders sell the pickup menu
const chargeList = type => S.charges.filter(c => !c.deleted && c.active!==false && (!(c.orderTypes||[]).length || c.orderTypes.includes(typeKey(type)))
  && (!(c.brandIds||[]).length || c.brandIds.includes(branch?.brandId)) && (!(c.branchIds||[]).length || c.branchIds.includes(device.branchId))).sort((a,b)=>(a.sort??999)-(b.sort??999)||a.name.localeCompare(b.name));
const pickedCharges = () => chargeList(otype).filter(c => posChg ? posChg.has(c.id) : c.auto!==false);
const lineNet = i => Math.max(0, (+i.price||0) * (+i.qty||1) - (+i.disc||0));
/* ---------- tax (prices include it, unless the company turned tax-inclusive pricing off) ---------- */
const prodTaxRate = id => { const p = S.products.find(x=>x.id===id), g = p && S.tax_groups.find(x=>x.id===p.taxGroup && live(x)); return g ? (g.taxIds||[]).reduce((a,t) => { const x = S.taxes.find(y=>y.id===t && live(y)); return a + (x ? +x.rate||0 : 0); }, 0)/100 : 0; };
function orderTax(items, disc){ const incl = taxIncl(); let g = 0, t = 0; (items||[]).forEach(i => { const l = lineNet(i), r = prodTaxRate(i.productId); g += l; t += incl ? l*r/(1+r) : l*r; }); if(g>0 && disc>0) t *= 1 - Math.min(disc,g)/g; return +t.toFixed(2); }
/* ---------- payment methods (Manage → Payment Methods; Cash / Card / Other until some are added) ---------- */
const payMethods = () => { const l = S.payment_methods.filter(m => live(m) && m.active!==false).sort((a,b)=>(a.sort??999)-(b.sort??999)||a.name.localeCompare(b.name));
  return l.length ? l.map(m => ({ id:m.id, name:m.name, type:m.type||"other" })) : [{ id:"cash", name:"Cash", type:"cash" },{ id:"card", name:"Card", type:"card" },{ id:"other", name:"Other", type:"other" }]; };
const incoming = () => S.orders.filter(o => o.branchId===device.branchId && o.channel!=="pos" && (o.status==="pending" || o.status==="active"));

/* ---------- render ---------- */
const autoDone = new Set();
// one master POS per branch takes the call-center and web orders and ends the day; sub-POS sell and bill. No master set = every POS can
const isMaster = () => { const m = (S.devices||[]).filter(d => !d.deleted && d.branchId===device?.branchId && d.settings?.master); return !m.length || m.some(d => d.id===device.id); };
async function autoAccept(){
  if(!isMaster()) return;
  for(const o of S.orders.filter(o => o.branchId===device.branchId && o.channel!=="pos" && o.status==="pending" && !autoDone.has(o.id))){
    autoDone.add(o.id);
    try{ await db.collection("orders").doc(o.id).update({ status:"active", updatedAt:new Date().toISOString(), handledBy:(cashier?.name || device.name) + " (auto)", ...(o.no ? {} : { no: nextOrderNo(), deviceId: device.id }) });
      toast(`New ${o.channel==="online"?"online":"call-center"} order accepted automatically`); }catch(err){ console.error(err); autoDone.delete(o.id); }
  }
}
/* ---------- end of day: one per branch per business day ---------- */
const liveOrder = o => o.branchId===device.branchId && !["draft","declined","void"].includes(o.status);
const dayClosed = d => S.day_closes.some(c => c.branchId===device.branchId && String(c.businessDate).slice(0,10)===d);
// the latest earlier business day at this branch that had sales and wasn't ended; otherwise today
function openDay(){ const today = bizDate(), days = [...new Set(S.orders.filter(liveOrder).map(o => bizDate(o.createdAt)))].filter(d => d < today && !dayClosed(d)).sort(); return days.length ? days[days.length-1] : today; }
function saleBlock(){
  const today = bizDate(), od = openDay();
  if(od < today) return `The business day of ${fmtDay(od)} hasn't been ended. End that day first (End day button), then you can sell.`;
  if(dayClosed(today)) return `Today's business day (${fmtDay(today)}) is already ended at this branch. New sales start after the day end time.`;
  return "";
}
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
function openDayEnd(){
  if(!isMaster()) return toast("The day is ended on the master POS");
  if(!can("pos_endday")) return deny("ending the day");
  const day = openDay(), act = S.orders.filter(o => o.branchId===device.branchId && ["pending","active"].includes(o.status));
  const shifts = S.shifts.filter(x => x.branchId===device.branchId && !x.closedAt);
  const sales = S.orders.filter(o => liveOrder(o) && (o.status==="closed" || o.status==="refund") && bizDate(o.createdAt)===day);
  const blockers = [];
  if(act.length) blockers.push(`<p><b>${act.length} order${act.length===1?" is":"s are"} still active.</b> Finish, decline or void ${act.length===1?"it":"them"} first:</p><p class="mut">${act.slice(0,12).map(o => (o.no ? "#"+esc(o.no) : esc(invNo(o.invoiceNo))) + " · " + (o.status==="pending" ? "waiting" : "in kitchen")).join("<br>")}</p>`);
  if(shifts.length) blockers.push(`<p><b>${shifts.length} shift${shifts.length===1?" is":"s are"} still open.</b> Close ${shifts.length===1?"it":"them"} first:</p><p class="mut">${shifts.map(x => esc(S.devices.find(d=>d.id===x.deviceId)?.name || "Device") + " · " + esc(x.cashier||"")).join("<br>")}</p>`);
  modal("dayend", `<div class="mh"><h2>End day · ${esc(fmtDay(day))}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">
    ${blockers.length ? blockers.join("") : `<div class="stats"><div>Orders<b>${sales.length}</b></div><div>Net sales<b>${usd(sales.reduce((a,o)=>a+(+o.total||0)-(+o.tax||0),0))}</b></div><div>Payments<b>${usd(sales.reduce((a,o)=>a+(+o.total||0),0))}</b></div></div>
      <p class="mut">Ending the day closes ${esc(fmtDay(day))} for ${esc(branch?.name||"this branch")}. Every device at the branch then starts the next business day.</p>`}</div>
    <div class="mf"><button class="btn" data-close>${blockers.length ? "OK" : "Cancel"}</button>${blockers.length ? "" : `<button class="btn pri" id="doDayEnd" data-day="${day}">End day</button>`}</div>`);
}
async function doDayEnd(day){
  const sales = S.orders.filter(o => liveOrder(o) && (o.status==="closed" || o.status==="refund") && bizDate(o.createdAt)===day);
  if(S.orders.some(o => o.branchId===device.branchId && ["pending","active"].includes(o.status)) || S.shifts.some(x => x.branchId===device.branchId && !x.closedAt)) return openDayEnd();
  try{ await db.collection("day_closes").doc("dc_" + device.branchId + "_" + day).set({ branchId:device.branchId, businessDate:day, closedAt:new Date().toISOString(), closedBy:cashier?.name || device.name, deviceId:device.id, orders:sales.length, sales:+sales.reduce((a,o)=>a+(+o.total||0),0).toFixed(2) });
    closeModal(); toast(`Day ended · ${fmtDay(day)}`); renderAll(); }
  catch(err){ console.error(err); toast("Couldn't end the day. Check the connection and try again."); }
}
$("#dayBtn").addEventListener("click", openDayEnd);
/* ---------- device & branch settings (Manage → Devices → Settings, Manage → Branches) ---------- */
const devSet = () => device?.settings || {}, brSet = () => branch?.settings || {};
const allowedTypes = () => { const b = brSet().orderTypes || ["dinein","takeaway","delivery"], d = devSet().orderTypes || b, a = ["dinein","takeaway","delivery"].filter(t => b.includes(t) && d.includes(t)); return a.length ? a : ["dinein","takeaway","delivery"]; };
const defaultType = () => "fast";   // a new order is a fast sale until a table is picked (Tables) or it's taken as pickup / delivery   // the POS starts on Dine-in or Fast sale
function applyTypes(){ const a = allowedTypes(); $("#otype [data-t=dinein]").style.display = a.includes("dinein") ? "" : "none";
  if(!(otype==="fast" || a.includes(otype) || (otype==="dinein" && tableNo))) otype = defaultType(); }
let typeInit = false;
function renderAll(){
  if(!typeInit && device){ typeInit = true; otype = defaultType(); }
  applyTypes();
  const bn = S.brands.find(b=>b.id===branch?.brandId)?.name;
  $("#tBranch").textContent = (bn ? bn + " · " : "") + (branch?.name || "Unknown branch");
  $("#tDevice").textContent = device.name + ((S.devices||[]).some(d => !d.deleted && d.branchId===device.branchId && d.settings?.master) ? (isMaster() ? " · Master POS" : " · Sub-POS") : "");
  $("#dayBtn").style.display = isMaster() ? "" : "none";
  const sh = openShift();
  $("#shiftPill").textContent = sh ? "Shift open" : "Shift closed"; $("#shiftPill").classList.toggle("off", !sh);
  const blk = saleBlock(); $("#dayBtn span").textContent = (blk && openDay() < bizDate() ? "⚠ " : "") + "End of day (" + openDay().split("-").reverse().join("/") + ")"; $("#dayBtn").title = blk || "End the business day for this branch";
  $("#shiftBtn span").textContent = sh ? "Close till" : "Open till"; paintAbar();
  const inc = incoming(), pend = isMaster() ? inc.filter(o=>o.status==="pending").length : 0;
  $("#incBadge").textContent = pend; $("#incBadge").classList.toggle("hide", !pend);
  if(isMaster()){ const fresh = inc.filter(o => o.status==="pending" && !SEEN.has(o.id)); inc.forEach(o => SEEN.add(o.id));
    if(fresh.length && SEEN_READY){ $("#boardBtn").classList.remove("ring"); void $("#boardBtn").offsetWidth; $("#boardBtn").classList.add("ring");
      toast(fresh.length===1 ? `New ${fresh[0].channel==="callcenter" ? "call-center" : "web"} order${fresh[0].customerName ? " · " + fresh[0].customerName : ""} · open Pickup & delivery to accept it` : `${fresh.length} new orders · open Pickup & delivery to accept them`);
      try{ navigator.vibrate?.(200); }catch(e){} }
    if(window.__ordLoaded) SEEN_READY = true; }
  renderMenu(); renderCart();
  if(modalKind==="incoming" && document.activeElement?.id!=="ovQ") openIncoming();
  if(modalKind==="orderview" && OV.open) openOrderView(OV.open);
  if(modalKind==="tables") openTables();

  if(modalKind==="devices") openDevices();
}
const catRank = p => { const c = S.categories.find(x=>x.id===p.categoryId); return c?.sort ?? 999; };   // "All" follows the category order
function renderMenu(){
  const kids = kidIds(), prods = products().filter(p => !kids.has(p.id) && (!(p.variants||[]).some(v => v.productId) || kidsOf(p).length));
  const cats = S.categories.filter(c => live(c) && !(c.inactiveBranchIds||[]).includes(device.branchId) && !(c.inactiveBranchIds||[]).includes(device.branchId + ":pos") && prods.some(p => p.categoryId===c.id)).sort((a,b)=>(a.sort??999)-(b.sort??999) || a.name.localeCompare(b.name));

function modData(p){

async function addProduct(p){

  let options = [], mods = "";
  if((p.modifiers||[]).length && window.SlickMods){ const r = await SlickMods.pick({ name:p.name, basePrice:price, ...modData(p), money:usd }); if(!r) return; options = r.options; mods = r.mods; price = r.unitPrice; }
  const k = SlickMods ? SlickMods.key(p.id, options) : p.id;

  renderCart();
}

    <div style="display:flex;gap:8px;margin-top:10px"><input id="discVal" inputmode="decimal" placeholder="${discType==="amt"?"Amount in USD":"Percent"}" value="${discount && ![5,10,15,20,25,50,100].includes(discount) || discType==="amt" && discount ? discount : ""}" style="flex:1"><button class="pay" id="discApply" style="flex:none;padding:0 22px">Apply</button></div>

/* payment */
let payMethod = null;
function openPay(){
  const blk = saleBlock(); if(blk){ modal("blocked", `<div class="mh"><h2>Can't take sales yet</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb"><p>${esc(blk)}</p></div><div class="mf"><button class="btn" data-close>OK</button><button class="btn pri" id="goDayEnd">End day</button></div>`); return; }
  if(!openShift()){ toast("Open a shift before taking payments"); return; }
  if(!orderInfoOk()) return;
  const t = totals(), pms = payMethods(); payMethod = pms[0];
  const q = [t.total, Math.ceil(t.total/5)*5, Math.ceil(t.total/10)*10, Math.ceil(t.total/20)*20].filter((v,i,a)=>a.indexOf(v)===i);
  modal("pay", `<div class="mh"><h2>Payment</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">
    <div class="due">${usd(t.total)}</div>${usd2(t.total) ? `<div class="mut" style="text-align:center;margin:-6px 0 8px">≈ ${usd2(t.total)}</div>` : ""}
    <div class="paym">${pms.map((m,i)=>`<button data-pm="${esc(m.id)}" class="${i?"":"on"}">${esc(m.name)}</button>`).join("")}</div>
    <div id="cashBox" ${pms[0].type==="cash"?"":'style="display:none"'}><input class="tender" id="tender" inputmode="decimal" value="${t.total.toFixed(2)}" aria-label="Amount received">
    <div class="quick">${q.map(v=>`<button data-qk="${v}">${usd(v)}</button>`).join("")}</div>
    <div class="change"><span>Change</span><b id="chg">USD 0.00</b></div></div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" id="confirmPay">Complete sale</button></div>`);
}
function updChange(){ const t = totals().total, v = +$("#tender")?.value || 0; if($("#chg")) $("#chg").textContent = payMethod?.type==="cash" ? usd(Math.max(0, v-t)) : "—"; if($("#confirmPay")) $("#confirmPay").disabled = payMethod?.type==="cash" && v < t; }
async function completeSale(){
  const t = totals(), now = new Date().toISOString(), tender = payMethod?.type==="cash" ? +$("#tender").value : t.total;
  const no = nextOrderNo();
  const order = { no, channel:"pos", source:"POS", type: otype==="dinein"?"dinein":otype==="fast"?"fast":otype==="takeaway"?"pickup":"delivery", table: otype==="dinein"?tableNo:"",
    customerName:cust.name.trim(), phone:cust.phone.trim(), address: otype==="delivery"?addrJoin(cust.addr):"",
    brandId:branch?.brandId || null, branchId:device.branchId, deviceId:device.id, shiftId:openShift().id, agent:cashier?.name || device.name, items:cart, subtotal:+t.sub.toFixed(2), charges:t.charges, chargesTotal:t.chT, discountPct: discType==="pct" ? discount : (t.sub ? +(t.disc/t.sub*100).toFixed(2) : 0), discountType: discType, discount:t.disc, total:t.total, receiptNotes: orderNote.trim(), ...(otype==="dinein" && GUESTS ? { guests: GUESTS } : {}),
    tax:t.tax, payment:{ method:payMethod.name, type:payMethod.type, methodId:payMethod.id, tendered:tender, change:+Math.max(0,tender-t.total).toFixed(2) }, status:"closed", createdAt:now, updatedAt:now };
  $("#confirmPay").disabled = true;
  try{
    const eo = editOrder();
    if(eo){   // billing an open order: it keeps its number, channel and customer; this register bills it
      Object.assign(order, { no: eo.no || no, channel: eo.channel, source: eo.source, createdAt: eo.createdAt, brandId: eo.brandId || order.brandId, items: cart.map(cleanItem),
        ...(eo.channel!=="pos" ? { agent: eo.agent, customerName: eo.customerName || order.customerName, phone: eo.phone || order.phone, address: eo.address || order.address } : {}), handledBy: cashier?.name || device.name });
      await db.collection("orders").doc(eo.id).update(order); EDIT = null;
    } else {
    const id = "pos_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    await db.collection("orders").doc(id).set(order);
    }
    if(devSet().receipt==="none"){ closeModal(); toast(`Sale complete · ${usd(order.total)}${order.payment.change ? " · change " + usd(order.payment.change) : ""}`); } else showReceipt(order);
    resetOrder(); if(devSet().lockAfterSale && usePins()) lock(); if(!syncSt.online) toast("Saved on this tablet · will sync when online");
  }catch(err){ console.error(err); toast("Couldn't save the sale. Try again."); $("#confirmPay").disabled = false; }
}
function rcptHead(w){
  const c = l => l.slice(0,w).padStart((w + Math.min(w,l.length))/2), out = [];
  if(branch?.nameAr) out.push(c(branch.nameAr));
  (brSet().receiptHeader || "").split("\n").map(l=>l.trim()).filter(Boolean).forEach(l => out.push(c(l)));
  const tax = branch?.taxNumber || (S.settings.find(x=>x.id==="company")||{}).taxNumber; if(tax) out.push(c("VAT No. " + tax));
  if(branch?.phone) out.push(c("Tel " + branch.phone));
  return out;
}
function receiptText(o){
  const w = 32, row = (a,b) => a.slice(0, w-b.length-1).padEnd(w-b.length) + b, a = appSet(), net = (+o.total||0) - (+o.tax||0);
  const typ = o.type==="dinein" ? "Dine-in"+(o.table?" T"+o.table:"") : o.type==="pickup"||o.type==="takeaway" ? "Pickup" : o.type==="fast" ? "Fast sale" : "Delivery";
  const lines = [ (()=>{ const n = (S.brands.find(b=>b.id===branch?.brandId)?.name || "Slick").toUpperCase(); return n.padStart((w+n.length)/2); })(), (branch?.name||"").padStart((w+(branch?.name||"").length)/2), ...rcptHead(w), "",
    ...(o.status==="refund" ? ["*** REFUND ***".padStart((w+14)/2), row("Return " + ordRef(o), typ), ...(o.invoiceRef || S.orders.find(x=>x.id===o.refundOf)?.invoiceNo ? ["Original invoice " + invNo(o.invoiceRef || S.orders.find(x=>x.id===o.refundOf)?.invoiceNo)] : []), ...(o.returnReason ? ["Reason: " + o.returnReason] : [])]
      : [row("Order #"+(o.no||"—"), typ), ...(o.ref ? ["Ref " + o.ref] : []), ...(a.rcptInvoice && o.invoiceNo ? ["Invoice " + invNo(o.invoiceNo)] : [])]), ...(a.rcptSource && o.source ? ["Source: " + o.source] : []),
    ...(o.type==="dinein" && +o.guests ? ["Guests: " + o.guests] : []),
    ...(a.rcptCustomer && (o.customerName || o.phone) ? [[o.customerName, o.phone].filter(Boolean).join(" · ")] : []),
    new Date(o.createdAt).toLocaleString("en-GB"), "-".repeat(w),
    ...o.items.flatMap(i => [row(i.qty+" x "+i.name, lineNet(i).toFixed(2)), ...modLines(i).map(m => ("   - " + m).slice(0, w)), ...(+i.disc ? ["  discount -" + (+i.disc).toFixed(2)] : [])]), "-".repeat(w) ];
  if(o.discount) lines.push(row(o.discountType==="amt" ? "Discount" : "Discount "+o.discountPct+"%", "-"+(+o.discount).toFixed(2)));
  (o.charges||[]).filter(c=>+c.amount).forEach(c => lines.push(row(c.name, (+c.amount).toFixed(2))));
  lines.push(row("Subtotal", net.toFixed(2)));
  if(a.rcptTax) lines.push(row(taxIncl() ? "Tax (incl.)" : "Tax", (+o.tax||0).toFixed(2)));
  lines.push(row("TOTAL USD", (+o.total).toFixed(2)));
  if(usd2(o.total)) lines.push(row("", "= " + usd2(o.total)));
  if(o.payment){ lines.push(row((o.status==="refund" ? "Refunded (" : "Paid (")+o.payment.method+")", Math.abs(+o.payment.tendered).toFixed(2))); if(o.payment.change) lines.push(row("Change", (+o.payment.change).toFixed(2))); }
  if(o.status==="void") lines.push("", "*** VOID ***".padStart((w+12)/2)); if(o.status==="returned") lines.push("", "*** RETURNED ***".padStart((w+16)/2));
  if(o.receiptNotes) lines.push("", ...o.receiptNotes.split("\n").map(l => l.trim().slice(0,w)).filter(Boolean));
  const foot = (brSet().receiptFooter || "Thank you!").split("\n").map(l => l.trim()).filter(Boolean);
  lines.push("", ...foot.map(l => l.slice(0,w).padStart((w + Math.min(w,l.length))/2)));
  return lines.join("\n");
}
// kitchen ticket: big order number, type, time, then each item with its modifiers listed under it (no prices)
function kitchenText(o){
  const w = 32, typ = o.type==="dinein" ? "DINE-IN"+(o.table?" T"+o.table:"") : o.type==="pickup"||o.type==="takeaway" ? "PICKUP" : o.type==="fast" ? "FAST SALE" : "DELIVERY";
  const ctr = t => t.padStart((w + t.length)/2);
  const lines = [ctr("KITCHEN"), ctr("ORDER #" + (o.no || "—")), ctr(typ), ...(o.ref ? [ctr(o.ref)] : []), ...(o.source && o.channel!=="pos" ? [ctr(o.source)] : []),
    new Date(o.createdAt).toLocaleString("en-GB"), "=".repeat(w)];
  (o.items||[]).forEach(i => { lines.push((i.qty + " x " + i.name).slice(0, w)); modLines(i).forEach(m => lines.push(("   - " + m).slice(0, w))); });
  lines.push("=".repeat(w));
  if(o.notes) lines.push("NOTE: " + o.notes);
  return lines.join("\n");
}
window.SlickKitchenText = kitchenText;

}

/* ---------- approval with a manager's PIN ---------- */
function approve(perm, title){
  if(!usePins()) return Promise.resolve({ name: cashier?.name || device.name });
  return new Promise(resolve => {
    let buf = ""; const el = document.createElement("div"); el.className = "apv";
    const draw = err => { el.innerHTML = `<div class="apvbox"><h2>${esc(title)}</h2><p class="mut">A manager whose role allows this types their PIN.</p><div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<buf.length?"on":""}"></i>`).join("")}</div>
      <div class="err" style="min-height:20px;color:#b42318">${esc(err||"")}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-ap="${n}">${n}</button>`).join("")}<button data-ap="c">C</button><button data-ap="0">0</button><button data-ap="b">⌫</button></div>
      <button class="btn" data-apx style="margin-top:12px;width:100%">Cancel</button></div>`; };
    const done = v => { el.remove(); document.removeEventListener("keydown", key, true); resolve(v); };
    const check = async () => { const pin = buf; buf = "";
      for(const u of S.users.filter(u => !u.deleted && u.active!==false && u.pinHash)){ if(await pinHash(u.id, pin) === u.pinHash){
        const r = S.roles.find(x => x.id===u.roleId && !x.deleted); if(r && (r.permissions||[]).includes(perm)) return done(u);
        return draw(`${u.name}'s role can't approve this.`); } }
      draw("Wrong PIN. Try again."); };
    const press = k => { if(k==="c") buf = ""; else if(k==="b") buf = buf.slice(0,-1); else if(buf.length < 4) buf += k; draw(); if(buf.length===4) check(); };
    const key = e => { if(/^\d$/.test(e.key)){ e.stopPropagation(); press(e.key); } else if(e.key==="Backspace"){ e.stopPropagation(); press("b"); } else if(e.key==="Escape") done(null); };
    el.addEventListener("click", e => { const b = e.target.closest("[data-ap]"); if(b) return press(b.dataset.ap); if(e.target.closest("[data-apx]") || e.target===el) done(null); });
    document.addEventListener("keydown", key, true); draw(); document.body.appendChild(el);
  });
}

const stLbl = o => ({ refund:"Refund", pending:"Waiting for you", active:"In kitchen", closed:"Done", void:"Void", returned:"Returned", declined:"Declined", draft:"Draft" }[o.status] || o.status);
const typLbl = t => t==="fast" ? "Fast sale" : t==="dinein" ? "Dine-in" : t==="pickup"||t==="takeaway" ? "Pickup" : t==="delivery" ? "Delivery" : (t||"—");
const invNo = n => n ? "INV-" + String(n).padStart(6,"0") : "";   // invoice number as shown and printed

async function doVR(kind, mode){

  const stock = a.stockAction==="ask" ? (document.querySelector("[data-st].on")?.dataset.st || "stock") : a.stockAction;
  if(kind==="return" && !openShift()){ $("#vrErr").textContent = "Open a shift first: the refund is paid from this register."; return; }
  const qs = window.__vq || [], idx = [], chosen = (o.items||[]).map((i,ix) => { const q = mode==="items" ? (qs[ix]||0) : (kind==="return" ? retLeft(o, ix) : +i.qty); if(q > 0) idx.push(ix); return { ...i, qty:q, ...(+i.disc ? { disc: +(i.disc * q / i.qty).toFixed(2) } : {}) }; }).filter(i => i.qty > 0);
  if(!chosen.length){ $("#vrErr").textContent = "Pick at least one item."; return; }

      Object.assign(patch, { items, subtotal: +sub.toFixed(2), discount: d, tax, charges, chargesTotal: +charges.reduce((s,c)=>s+c.amount,0).toFixed(2), total,

      return { ...c, ix: idx[k], refund: +(unit * c.qty * share).toFixed(2), reason, stock, returnedAt: now, returnedBy: by, approvedBy: ok.name }; });
    const left = +((+o.total||0) - (+o.refundTotal||0)).toFixed(2), allBack = (o.items||[]).every((i,ix) => retLeft(o, ix) - (ret.find(r=>r.ix===ix)?.qty||0) <= 0);
    const refund = allBack ? left : Math.min(left, +ret.reduce((s,r)=>s+r.refund,0).toFixed(2));
    const rgross = ret.reduce((s,r)=>s+lineNet(r),0), rdisc = +(rgross * (1 - share)).toFixed(2);
    Object.assign(patch, { returnedItems: [...(o.returnedItems||[]), ...ret], refundTotal: +((+o.refundTotal||0) + refund).toFixed(2) });
    delete patch.stockAction; delete patch.approvedBy;
    ticket = { channel:o.channel, source:o.source, type:o.type, status:"refund", refundOf:o.id, brandId:o.brandId || branch?.brandId || null, branchId:device.branchId, deviceId:device.id, shiftId:openShift()?.id || null,
      agent: by, customerName:o.customerName || "", phone:o.phone || "", items: ret.map(({ ix, refund, returnedAt, returnedBy, approvedBy, reason, stock, ...it }) => it),
      subtotal: -(+rgross.toFixed(2)), discount: -rdisc, total: -refund, tax: -(+((+o.tax||0) * (o.total ? refund / o.total : 0)).toFixed(2)),

  }catch(err){ console.error(err); $("#vrErr") && ($("#vrErr").textContent = "Couldn't save. Check the connection and try again."); }
}

function openTables(){

    return `<button class="ttile busy${m >= 60 ? " long" : ""}" data-tbl="${esc(k)}"><span class="tn">${esc(tblLbl(k))}</span><b>${usd(tot)}</b><small>${+l[0].guests ? `👥 ${+l[0].guests} · ` : ""}#${esc(l[0].no || "—")}${l.length > 1 ? ` +${l.length-1}` : ""} · ${m < 60 ? m + " min" : Math.floor(m/60) + " h " + (m%60) + " min"}</small></button>`; };
  const busy = all.filter(t => tableOrders(t.name).length).length;
  modal("tables", `<div class="ohdr"><button class="hbtn" data-close>Back</button><b style="font-size:18px">Tables · ${esc(branch?.name||"")}</b><span class="sp"></span>
    <span class="tleg"><span><i style="background:#fff;border:1px solid #ccc"></i>Free</span><span><i style="background:#f3c18f"></i>Occupied</span><span><i style="background:#f2a3ae"></i>Over 1 hour</span></span></div>
    <div class="mb"><p class="mut" style="margin:0 0 12px">${all.length ? `${busy} of ${all.length} tables occupied. Tap a free table to start a dine-in order, or an occupied one to open its order.` : "No tables set up for this branch yet. Add them in the back office under Manage → Tables."}</p>
    ${secs.map(sc => { const l = all.filter(t => (t.section||"")===sc); return `${secs.length > 1 || sc ? `<h3 class="tsec">${esc(sc || "Tables")}<span class="mut"> · ${l.filter(t => tableOrders(t.name).length).length}/${l.length} occupied</span></h3>` : ""}<div class="tgrid">${l.map(tile).join("")}</div>`; }).join("")}</div>`, true);
  $("#modal").classList.add("full"); $("#scrim").classList.add("fullscr");
}
function askGuests(k){

  modal("guests", `<div class="mh"><h2>${esc(tblLbl(k))} · how many guests?</h2><button class="x" data-close aria-label="Close">×</button></div><div class="mb">

    <div style="display:flex;gap:8px;margin-top:12px"><input id="gNum" type="number" min="1" max="99" inputmode="numeric" placeholder="More…" style="flex:1;padding:12px;border:1px solid var(--line);border-radius:12px"><button class="btn pri" data-guests="custom">OK</button></div></div>`);
