<style>
:root{--acc:#5b2bc4;--on-acc:#fff;--accs:color-mix(in srgb,var(--acc) 12%,#fff);--acci:color-mix(in srgb,var(--acc) 82%,#000);
  --bg:#f6f5f9;--s:#fff;--s2:#faf9fc;--ink:#18171f;--ink2:#55535f;--mut:#8b8996;--line:#e9e7ef;--bad:#b42318;--ok:#1f8a4c;
  --r:18px;--r2:12px;--font:Inter;--hfont:Inter;--shadow:0 1px 2px rgba(20,18,30,.04),0 6px 20px rgba(20,18,30,.06);--ease:cubic-bezier(.2,.8,.2,1)}
:root.dark{--bg:#0f0e13;--s:#1a1921;--s2:#22212a;--ink:#f3f2f7;--ink2:#c3c1cc;--mut:#8f8d99;--line:#2c2b35;--accs:color-mix(in srgb,var(--acc) 22%,#1a1921);--acci:color-mix(in srgb,var(--acc) 55%,#fff);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
:root.warm{--bg:#f8f3ec;--s:#fffdf9;--s2:#fbf6ef;--line:#ece3d6}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{font-family:var(--font),"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:100px;transition:background .3s}
h1,h2,h3{font-family:var(--hfont),var(--font),system-ui,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}

/* header */
.hero{position:relative;color:#fff}
.cover{height:210px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#ff7a59));background-size:cover;background-position:center;position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
.hstyle-solid .cover{background:var(--acc)!important;height:150px}.hstyle-solid .cover::after{display:none}
.hstyle-minimal .cover{height:0}.hstyle-minimal .cover::after{display:none}
.hcard{max-width:1180px;margin:-56px auto 0;padding:0 16px;position:relative;z-index:2;animation:up .5s var(--ease)}
.hstyle-minimal .hcard{margin-top:44px}
.hin{background:var(--s);color:var(--ink);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid var(--line)}
.logo{width:76px;height:76px;border-radius:calc(var(--r) - 2px);background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:800;font-size:30px;flex:none;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);margin-top:-44px;border:4px solid var(--s)}
.logo img{width:100%;height:100%;object-fit:cover}
.hmeta{flex:1;min-width:220px}
.hmeta h1{margin:0;font-size:24px;font-weight:800}
.hmeta p{margin:4px 0 0;color:var(--ink2);font-size:14px;line-height:1.45}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--ink2);text-decoration:none}
.chip svg{width:14px;height:14px}
.chip.open{background:color-mix(in srgb,var(--ok) 12%,var(--s));color:var(--ok);border-color:transparent}
.chip.open i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.chip.shut{background:color-mix(in srgb,var(--bad) 10%,var(--s));color:var(--bad);border-color:transparent}
a.chip:hover{border-color:var(--acc);color:var(--acci)}
.banner{max-width:1180px;margin:12px auto 0;padding:0 16px}
.banner div{display:flex;gap:10px;align-items:center;background:var(--accs);color:var(--acci);border-radius:var(--r2);padding:11px 14px;font-size:14px;font-weight:600;animation:up .5s .1s var(--ease) both}
.banner svg{width:18px;height:18px;flex:none}

/* layout */
.shell{max-width:1180px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:1060px){.shell{grid-template-columns:minmax(0,1fr) 360px}body{padding-bottom:40px}.bar{display:none!important}}
.side{display:none}
@media(min-width:1060px){.side{display:block;position:sticky;top:16px;align-self:start;margin-top:16px}}
.card{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.where{margin-top:16px;animation:up .5s .05s var(--ease) both}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s,background .25s var(--ease),box-shadow .25s}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
.wbody label.l{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.selw{position:relative}.selw select,.tblin{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--s);appearance:none;-webkit-appearance:none}
.selw::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.info{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.45}
.ok2{color:var(--ok)}
.dmap{height:260px;border-radius:var(--r2);border:1px solid var(--line);margin-top:8px;z-index:0}
.locbtn{border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accs);color:var(--acci);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.locbtn svg{width:15px;height:15px}.locbtn:disabled{opacity:.6}

/* search + categories */
.tools{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:16px -16px 0;padding:10px 16px 8px}
.srch{display:flex;align-items:center;gap:8px;background:var(--s);border:1px solid var(--line);border-radius:999px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.srch:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.srch svg{width:18px;height:18px;color:var(--mut);flex:none}.srch input{border:0;outline:0;background:none;padding:11px 0;width:100%}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--s);border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:all .2s var(--ease)}
.cats button:hover{border-color:var(--acc);color:var(--acci)}
.cats button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
section.cat{animation:up .45s var(--ease) both}
h2.ch{font-size:20px;margin:26px 0 12px;display:flex;align-items:center;gap:10px;font-weight:800}
h2.ch small{font-size:13px;color:var(--mut);font-weight:500;font-family:var(--font)}
.cimg{width:40px;height:40px;border-radius:12px;object-fit:cover}

/* items */
.items{display:grid;gap:14px}
.lay-grid .items{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.lay-list .items{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.lay-compact .items{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.item{background:var(--s);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s;display:flex}
.item:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,18,30,.1);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.item .ph{background:var(--s2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--mut)}
.item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}.item:hover .ph img{transform:scale(1.05)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item b{font-weight:700;font-size:15px;line-height:1.3}
.item small{color:var(--mut);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-weight:700;color:var(--ink);margin-top:auto;padding-top:6px}
.lay-grid .item{flex-direction:column}.lay-grid .item .ph{aspect-ratio:4/3;width:100%}.lay-grid .item .tx{padding:12px 14px 14px}
.lay-grid .item .act{position:absolute;right:10px;bottom:12px}
.lay-list .item{padding:14px;gap:14px;align-items:stretch;min-height:128px}.lay-list .item .ph{width:104px;height:104px;border-radius:calc(var(--r) - 6px);order:2}.lay-list .item.noimg .ph{display:none}.lay-list .item .tx{padding-right:4px}
.lay-list .item .act{position:absolute;right:20px;bottom:20px}.lay-list .item.noimg .act{right:14px;bottom:14px}
.lay-compact .item{padding:12px 14px;align-items:center;gap:12px}.lay-compact .item .ph{display:none}.lay-compact .item small{-webkit-line-clamp:1}.lay-compact .item .act{position:static}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .15s}
.add:hover{transform:scale(1.08)}.add:active{transform:scale(.92)}.add svg{width:18px;height:18px}
.qtyc{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:3px;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent);animation:pop .3s var(--ease)}
.qtyc button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:inherit;font-size:17px;font-weight:700;line-height:1}
.qtyc b{min-width:18px;text-align:center;font-size:14px}
.soldout{font-size:12px;font-weight:700;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--s));padding:4px 9px;border-radius:999px}
.item.oos{opacity:.6;cursor:default}.item.oos:hover{transform:none;box-shadow:none}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.skel{height:180px;border-radius:var(--r);background:linear-gradient(90deg,var(--s2) 25%,var(--line) 37%,var(--s2) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}

/* cart */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:12;pointer-events:none}
.bar button{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:640px;margin:0 auto;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);padding:10px 12px 10px 10px;font-weight:700;font-size:16px;box-shadow:0 12px 30px color-mix(in srgb,var(--acc) 40%,transparent);animation:up .35s var(--ease)}
.bar .n{min-width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:14px}
.bar .t{margin-left:auto;padding-right:8px}
.side h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
.side .empt{display:grid;place-items:center;gap:8px;text-align:center;color:var(--mut);padding:26px 6px;font-size:14px}.side .empt svg{width:40px;height:40px;opacity:.5}
.line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);animation:fade .25s}
.line .q{min-width:26px;height:26px;border-radius:8px;background:var(--accs);color:var(--acci);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.line .nm{flex:1;min-width:0;font-weight:600;font-size:14px}
.line .rt{text-align:right;white-space:nowrap;font-weight:600;font-size:14px}
.rm{display:block;border:0;background:none;color:var(--mut);font-size:12px;padding:2px 0;text-decoration:underline}
.mlist{margin:3px 0 0;padding:0 0 0 16px;font-size:12px;line-height:1.45;color:var(--mut);font-weight:400;list-style:disc;text-align:left}.mlist li.mn{list-style:none;margin-left:-16px;font-style:italic}
.tot{display:grid;gap:7px;margin:14px 0;font-size:14px}.tot div{display:flex;justify-content:space-between;color:var(--ink2)}.tot .g{font-size:18px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px solid var(--line)}
.primary{width:100%;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);padding:15px;font-weight:700;font-size:16px;box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .15s,filter .2s}
.primary:hover{filter:brightness(1.06)}.primary:active{transform:scale(.98)}.primary:disabled{opacity:.5;box-shadow:none}
.ghost{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--s);padding:13px;font-weight:600;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.ghost svg{width:18px;height:18px}
.warn{background:color-mix(in srgb,#f5a700 14%,var(--s));color:#8a5a00;border-radius:var(--r2);padding:10px 12px;font-size:13px;margin:8px 0}
:root.dark .warn{color:#ffcf6b}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,12,30,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:40}
.scrim.show{display:flex;animation:fade .2s}
.sheet{background:var(--s);color:var(--ink);width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:sheet .35s var(--ease)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px}}
.sheet h3{margin:0 0 10px;font-size:21px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.x{border:0;background:var(--s2);width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--ink2);display:grid;place-items:center;line-height:1}
.sec{margin:18px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.f input,.f textarea,.f select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--s);outline:0;transition:border-color .2s,box-shadow .2s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{position:relative;border:1.5px solid var(--line);border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s var(--ease);background:var(--s)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt svg{width:20px;height:20px;color:var(--mut);flex:none}
.opt:has(input:checked){border-color:var(--acc);background:var(--accs);color:var(--acci)}.opt:has(input:checked) svg{color:var(--acc)}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.opt small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.done{text-align:center;padding:24px 6px}
.done .ok{width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--ok) 14%,var(--s));color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s var(--ease)}
.done .ok svg{width:38px;height:38px}
.done h3{justify-content:center}
.closed{text-align:center;padding:70px 20px;color:var(--ink2)}
.closed b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}

/* branches */
.locs{margin:40px 0 10px}
.locs .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.loc{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.loc b{display:block;font-size:15px}.loc div{font-size:13px;color:var(--ink2);margin-top:5px;display:flex;gap:6px;align-items:center}.loc svg{width:14px;height:14px;color:var(--mut);flex:none}
.loc a{color:var(--acci);text-decoration:none;font-weight:600}
footer.ft{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 10px}


/* top bar + location picker */
.topbar{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding:12px 16px 10px;flex-wrap:wrap}
.topbar[hidden]{display:none}
.locpill{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px 4px 0;text-align:left;color:var(--ink);min-width:0}
.locpill>svg{width:26px;height:26px;color:var(--acc);flex:none}
.locpill small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.locpill b{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.locpill b i{font-style:normal;font-size:13px;color:var(--ink2)}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--s);border:1px solid var(--line)}.tchip svg{width:15px;height:15px}
.tchip.ok{color:var(--ok)}.tchip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--s));border-color:transparent}

const QR = {stream:null, raf:0, det:null};
function qrLoadLib(){ return window.jsQR ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }

  const tb = u?.searchParams.get("table"), br = u?.searchParams.get("branch"), bd = u?.searchParams.get("brand");
  if(!u || (!tb && !br)){ const t = String(txt).trim(); if(/^\w{1,8}$/.test(t)){ qrClose(); tableNo = t; return render(); } return false; }
  if(bd && brandId && bd !== brandId){ qrClose(); location.href = u.href; return true; }   // another brand's table
  qrClose();
  if(br && branches.some(b => b.id===br) && br !== branchId){ branchId = br; cart = cart.filter(i => visible().some(p=>p.id===i.productId) && !oos(products.find(p=>p.id===i.productId))); reprice(); }

async function openScan(){
  qrClose();
  const el = document.createElement("div"); el.className = "qrcam"; el.id = "qrcam";
  el.innerHTML = `<video playsinline muted autoplay></video><button type="button" class="qrx" aria-label="Close">×</button><div class="qrbox"></div><div class="qrtx">Point your camera at the QR code on your table</div>`;

  try{ QR.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false}); }
  catch(e){ tx.innerHTML = `<span class="qrerr">Camera access was blocked. Allow camera access for this site and try again.</span>`; return; }
  if(!$("#qrcam")){ QR.stream.getTracks().forEach(t => t.stop()); return; }
  v.srcObject = QR.stream; try{ await v.play(); }catch(e){}
  if("BarcodeDetector" in window){ try{ QR.det = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ QR.det = null; } }
  if(!QR.det){ try{ await qrLoadLib(); }catch(e){ tx.innerHTML = `<span class="qrerr">Couldn't load the scanner. Check your connection and try again.</span>`; return; } }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true}); let busy = false, last = "";

        else { const w = Math.min(640, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth); cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h); const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:"dontInvert"}); txt = r?.data || null; }

    }
    QR.raf = requestAnimationFrame(tick);
  };

}

    <div class="sec">Your details</div>
    <div class="f"><label for="cName">Name *</label><input id="cName" required autocomplete="name"></div>
    ${phField("cPhone","Phone *",PROF?.phone||"")}
    ${em !== "off" ? `<div class="f"><label for="cEmail">Email${em==="required" ? " *" : " (optional)"}</label><input id="cEmail" type="email" autocomplete="email"></div>` : ""}
    ${mode==="delivery"?`<div class="sec">Delivery address</div><div class="f"><label for="cA_label">Address name</label><input id="cA_label" placeholder="Home, Work…"></div>
    <div class="f"><label for="cA_street">Area / street *</label><input id="cA_street" required autocomplete="street-address"></div>
    <div class="f2"><div class="f"><label for="cA_building">Building name / no. *</label><input id="cA_building" required></div><div class="f"><label for="cA_floor">Floor *</label><input id="cA_floor" required></div></div>
    <div class="f"><label for="cA_extra">Additional info</label><input id="cA_extra" placeholder="Apartment, landmark, directions"></div>`:""}
    ${CO().notes !== false ? `<div class="f"><label for="cNote">Notes for the kitchen</label><textarea id="cNote" rows="2" placeholder="e.g. extra spicy, no onions"></textarea></div>` : ""}
    <div class="sec">Payment</div><div class="opts">${pays.map(([t,s,i],k)=>`<label class="opt"><input type="radio" name="pay" value="${t}" ${k?"":"checked"}>${ic(i)}<span>${t}${s?`<small>${s}</small>`:""}</span></label>`).join("")}</div>
    ${CO().terms ? `<p class="info">${esc(CO().terms)}</p>` : ""}
    <div class="err" id="coErr"></div><button class="primary" id="place" ${min && sub()<min?"disabled":""}>Place order · ${usd(grand())}</button></form>`;
  $("#scrim").classList.add("show"); $("#scrim").scrollTop = 0;
  if(mode==="delivery" && addr){ const set = (id, v) => { const el = $("#" + id); if(el && v) el.value = v; };
    if(!["gps","pin"].includes(addr.id)) set("cA_label", addr.label); set("cA_street", addr.street); set("cA_building", addr.building); set("cA_floor", addr.floor); set("cA_extra", addr.extra); }
  if(PROF){ const put = (id, v) => { const el = $("#" + id); if(el && v) el.value = v; }; put("cName", fullName()); put("cEmail", USER.email); }
  $("#co").addEventListener("submit", placeOrder);
  $("#co").addEventListener("change", e => { if(e.target.name==="when") $("#whenBox").hidden = e.target.value!=="later"; if(e.target.id==="sDay") $("#sTime").innerHTML = sl[+e.target.value].ts.map(t=>`<option value="${t.getTime()}">${timeLbl(t)}</option>`).join(""); });
}
// one line the branch and call center can read and split again: "[Home] Hamra · Bldg: … · Floor: … · Info: …"
const addrJoin = a => { const c = v => String(v||"").replace(/\s*·\s*/g, ", ").trim(); return [c(a.label) ? "[" + c(a.label).replace(/[\[\]]/g,"") + "]" : "", [c(a.street), c(a.building) && "Bldg: " + c(a.building), c(a.floor) && "Floor: " + c(a.floor), c(a.extra) && "Info: " + c(a.extra)].filter(Boolean).join(" · ")].filter(Boolean).join(" "); };
async function placeOrder(e){
  e.preventDefault();
  const err = t => { $("#coErr").textContent = t; };
  const b = curBranch();
  if(!b){ err(mode==="delivery" ? (pin ? "We don't deliver to this location. Change it from the top of the page." : "Set your delivery location first.") : "Choose a branch first."); setTimeout(() => openLoc("main"), 900); return; }
  const bb = branches.find(x => x.id===b), later = document.querySelector('input[name="when"]:checked')?.value === "later", at = later ? new Date(+$("#sTime")?.value) : null;
  if(bcfg(b).paused) return err(`${bb?.name || "This branch"} isn't taking web orders right now.`);
  if(!later && bb && !brOpenNow(bb)){ const hh = brHoursToday(bb); return err(`${bb.name} is closed now${hh && hh!=="closed today" ? " · opening hours today " + hh : ""}.${CO().schedule ? " Schedule your order instead." : " Please order when it's open."}`); }
  if(later && !(at && +at)) return err("Pick a time for your order.");
  for(const id of ["cName","cPhone","cA_street","cA_building","cA_floor"]){ const el = $("#"+id); if(el && !el.value.trim()){ el.focus(); return err("Please fill in the required fields."); } }
  const phone = phVal("cPhone"); if(phone.replace(/\D/g,"").length < 8) return err("Enter a valid phone number.");
  const email = $("#cEmail")?.value.trim() || ""; if((CO().email==="required" || email) && !/^\S+@\S+\.\S+$/.test(email)) return err("Enter a valid email.");
  const pay = document.querySelector('input[name="pay"]:checked')?.value || "Cash";
  const extra = [later ? `Scheduled for ${dayLbl(at)} ${timeLbl(at)}` : "", payList().length > 1 ? `Pay by ${pay}` : "", email ? `Email: ${email}` : ""].filter(Boolean);
  const note = [$("#cNote")?.value.trim(), ...extra].filter(Boolean).join(" · ");
  if(PREVIEW) return err("This is a preview. Orders can't be placed here.");
  if(!USER) return openAuth("in", openCart, "Sign in or create an account to place your order.");
  $("#place").disabled = true; $("#place").textContent = "Placing your order…";
  const row = { brand_id: brandId, channel:"online", status:"pending", source: qrBranch ? "Table QR" : null, type: mode==="takeaway" ? "pickup" : mode,
    branch_id:b, zone_id: mode==="delivery" ? zoneId : null, table_no: mode==="dinein" ? (tableNo||null) : null,
    lat: mode==="delivery" ? pin[0] : null, lng: mode==="delivery" ? pin[1] : null,
    customer_name:$("#cName").value.trim(), phone, address: mode==="delivery" ? addrJoin(Object.fromEntries(["label","street","building","floor","extra"].map(k => [k, $("#cA_"+k).value]))) : null, notes: note || null,
    items: cart, subtotal:+sub().toFixed(2), delivery_fee:fee(), discount:0, tax:taxIn(), total:grand(), scheduled_at: later ? at.toISOString() : null, customer_user_id: USER.id };
  const { error } = await sb.from("orders").insert(row);
  if(!error){ const h = lsGet(OHK(), []); h.unshift({ created_at:new Date().toISOString(), status:"pending", branch_id:b, type:row.type, items:JSON.parse(JSON.stringify(cart)), total:row.total, uid:USER.id }); lsSet(OHK(), h.slice(0, 30)); }
  if(error){ console.error(error); err("We couldn't place your order. Please try again or call us."); $("#place").disabled = false; $("#place").textContent = `Place order · ${usd(grand())}`; return; }
  if(mode==="delivery" && pin){   // keep the delivery address on this device for next time
    const v = k => $("#cA_" + k)?.value.trim() || "", own = addr && !["gps","pin"].includes(addr.id);
    const sa = { id: own ? addr.id : "a" + Date.now().toString(36), label: v("label") || (own ? addr.label : "Address"), street:v("street"), building:v("building"), floor:v("floor"), extra:v("extra"), lat:pin[0], lng:pin[1] };
    addrs = own ? addrs.map(x => x.id===sa.id ? sa : x) : [sa, ...addrs]; saveAddrs(); addr = sa; lsSet(AK + "_sel", sa.id); renderTop(); }
  const bn = bb?.name || "", wa = String(bcfg(b).whatsapp || (cfg.social||{}).whatsapp || "").replace(/[^\d]/g, "");
  const waText = encodeURIComponent(`Hi ${brand.name}! I just placed an order on your website.\n${cart.map(i => `${i.qty} × ${i.name}`).join("\n")}\nTotal: ${usd(grand())}\nName: ${row.customer_name}`);
  $("#sheet").innerHTML = `<div class="done"><div class="ok">${ic("check")}</div><h3>Order received</h3><p>${esc(bn)} has your order and will confirm it shortly.</p><p class="info">${later ? "We'll have it ready for " + esc(dayLbl(at)) + " at " + esc(timeLbl(at)) + "." : mode==="delivery"?"We'll call you if we need directions.":mode==="takeaway"?"We'll have it ready for pickup" + (bcfg(b).prep ? " in about " + esc(bcfg(b).prep) + " min" : "") + ".":"We'll bring it to your table."}</p>
    <button class="primary" data-close>Done</button>${CO().whatsapp && wa ? `<a class="ghost" href="https://wa.me/${esc(wa)}?text=${waText}" target="_blank" rel="noopener">${ic("chat")}Send it on WhatsApp</a>` : ""}</div>`;
  cart = []; renderMenu();
}
render();
/* ---------- install as an app: home-screen icon, full-screen window, the brand's name and colour ---------- */
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if(STANDALONE) document.documentElement.classList.add("app");
function appIcon(size){ const t = cfg.theme || {}; if(t.logo) return t.logo;
  const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#5b2bc4"; x.fillRect(0, 0, size, size);
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--on-acc").trim() || "#fff"; x.font = `800 ${Math.round(size * .5)}px Inter, system-ui, sans-serif`; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText((brand.name.trim()[0] || "·").toUpperCase(), size / 2, size / 2 + size * .03); return c.toDataURL("image/png"); }
function setupApp(){
  try{ localStorage.setItem("slick_last_brand", brandId); localStorage.setItem("slick_splash_" + brandId, JSON.stringify({ name:brand.name, logo:(cfg.theme||{}).logo || "", acc:getComputedStyle(document.documentElement).getPropertyValue("--acc").trim(), dark:(cfg.theme||{}).bg==="dark" })); }catch(e){}
  if(PREVIEW) return;
  const t = cfg.theme || {}, acc = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#5b2bc4";
  const start = location.origin + location.pathname + "?brand=" + encodeURIComponent(brandId) + (qrBranch ? "&branch=" + encodeURIComponent(qrBranch) + (qrTable ? "&table=" + encodeURIComponent(qrTable) : "") : "");
  const i192 = appIcon(192), i512 = appIcon(512), typ = /^data:/.test(i192) ? "image/png" : undefined;
  const m = { name: brand.name, short_name: brand.name.length > 12 ? brand.name.split(/\s+/)[0] : brand.name, description: cfg.tagline || "Order online", id: start, start_url: start, scope: location.origin + location.pathname.replace(/[^/]*$/, ""),
    display: "standalone", orientation: "portrait", background_color: t.bg==="dark" ? "#0f0e13" : "#ffffff", theme_color: acc,
    icons: [{ src: i192, sizes: "192x192", ...(typ ? { type: typ } : {}), purpose: "any" }, { src: i512, sizes: "512x512", ...(typ ? { type: typ } : {}), purpose: "any maskable" }] };
  $("#mfLink").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
  $("#atIcon").href = appIcon(180);
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = m.short_name;
}
setupApp();
// offer to install: Android / Chrome show their own prompt; iPhone gets "Share → Add to Home Screen"
let instEvt = null; const IK = "slick_inst_" + brandId;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const mobile = iOS || /android/i.test(navigator.userAgent);
function instBar(kind){
  if(STANDALONE || PREVIEW || $("#inst") || (+lsGet(IK, 0) > Date.now())) return;
  const t = cfg.theme || {}, d = document.createElement("div"); d.id = "inst"; d.className = "inst"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Install the app");
  const share = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  d.innerHTML = `${t.logo ? `<img src="${esc(t.logo)}" alt="">` : `<span class="ii">${esc((brand.name.trim()[0]||"·").toUpperCase())}</span>`}<div><b>${esc(brand.name)} app</b><small>${kind==="ios" ? `Tap ${share} Share, then “Add to Home Screen”` : "Install it to order faster"}</small></div>${kind==="ios" ? "" : `<button type="button" class="ib" data-inst>Install</button>`}<button type="button" class="ix" data-instx aria-label="Not now">×</button>`;
  document.body.appendChild(d);
}
// a service worker makes the page installable on every Android browser, so "Install" adds it straight to the home screen
if("serviceWorker" in navigator && !PREVIEW && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("beforeinstallprompt", e => { e.preventDefault(); instEvt = e; if(mobile) setTimeout(() => instBar("prompt"), 2500); });
addEventListener("appinstalled", () => { $("#inst")?.remove(); lsSet(IK, Date.now() + 3650*864e5); });
if(iOS && !STANDALONE && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent)) setTimeout(() => instBar("ios"), 4000);
document.addEventListener("click", async e => {
  if(e.target.closest("[data-addhome]")){
    if(instEvt){ instEvt.prompt(); const r = await instEvt.userChoice.catch(() => null); instEvt = null; if(r?.outcome === "accepted") lsSet(IK, Date.now() + 3650*864e5); return; }
    const share = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
    const plus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
    const dots = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
    const steps = iOS ? [[share, "Tap the <b>Share</b> button in Safari's bar"], [plus, "Scroll down and tap <b>Add to Home Screen</b>"], [ic("check"), "Tap <b>Add</b>. The app appears on your home screen"]]
      : [[dots, "Open your browser's <b>menu</b> (⋮)"], [plus, "Tap <b>Add to Home screen</b> or <b>Install app</b>"], [ic("check"), "Confirm. The app appears on your home screen"]];
    const sh = $("#sheet"); sh.className = "sheet";
    sh.innerHTML = `<h3>Add to home screen <button class="x" data-close aria-label="Close">×</button></h3><div class="ahsteps">${steps.map((x, i) => `<div><span class="n">${i + 1}</span><span class="si">${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div><button type="button" class="primary" data-close style="margin-top:16px">Got it</button>`;
    $("#scrim").classList.add("show"); $("#scrim").scrollTop = 0; return; }
  if(e.target.closest("[data-instx]")){ $("#inst")?.remove(); lsSet(IK, Date.now() + 7*864e5); return; }   // ask again in a week
  if(e.target.closest("[data-inst]") && instEvt){ instEvt.prompt(); const r = await instEvt.userChoice.catch(() => null); instEvt = null; $("#inst")?.remove(); if(r?.outcome !== "accepted") lsSet(IK, Date.now() + 7*864e5); }
});
// live preview from the back office (Web Ordering): the settings being edited, before they're saved
if(PREVIEW){ addEventListener("message", e => { if(e.origin !== location.origin || e.data?.type !== "slick-web-cfg") return; Object.keys(cfg).forEach(k => delete cfg[k]); Object.assign(cfg, e.data.cfg || {}); $("#main").innerHTML = shell(); render(); }); parent.postMessage({ type:"slick-web-ready" }, location.origin); }
})().catch(e => console.error(e)).finally(() => { const s = document.getElementById("splash"); if(s){ s.classList.add("done"); setTimeout(() => s.remove(), 400); } });
</script>
